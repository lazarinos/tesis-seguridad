                          - generic [ref=e396]: SECTION III.
                          - heading "Background" [level=2] [ref=e397]
                        - paragraph [ref=e398]: "There are many factors that contribute to how a model operates and makes its predictions and, therefore, many ways to explain it. XAI methods can be classified using two dimensions: stage and scope."
                        - paragraph [ref=e399]: The extent of the explainability method can vary, with the method capable of offering either a global explanation encompassing the entire model or a local explanation specific to a single prediction, or both.
                        - paragraph [ref=e400]:
                          - text: A taxonomy of XAI methods can be seen in Figure 2. The explainability method can be applied through the three stages of an AI development model (pre-modelling, modelling, and post-modelling). The two main stages where explainability can be applied are the modelling (intrinsic explainability), and the post-modelling (post-hoc explainability)
                          - link "[18]" [ref=e401] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: . Intrinsic models refer to interpretable models like decision trees or rule-based models. Post-hoc models involve extracting information from pre-trained models, and their effectiveness is not tied to the inner workings of the model, making them either model-agnostic or model-specific when the XAI method is developed specific to a DL model.
