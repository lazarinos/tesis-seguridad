                          - paragraph [ref=e747]: and SHAP, but separately also for each. We start by dividing the collected most important system calls by true positive instances, false negatives, true negatives, and false positives. Then we check which and if are there system calls present in the explanations of TP cases that are not present in the explanations of FN (opposite) cases. If so we save them and we perform the same for the opposite and repeat the process for the TN and FP cases. This being, we have a set of system calls that only appear in the explanations of TP and not in FN explanations and a set for the opposite. We also have two sets for the TN and FP the same way. For the third step, we select a system call of the set of TP (X), and one of the FN (Y). We then proceed to replace in the dataset, the appearances of Y with X generating a new modified dataset that we feed back to the black box model and observe the changes in the output. We repeat the process for all the system calls, combining all possible X with all possible Y. We repeat the process for the TN and FP cases.
