                          - paragraph [ref=e1027]: On a first experimental batch, for each instance, the 10 most important system calls were removed from the respective input instances, and the instances were fed back to the black box model to obtain a new result and observe the differences in prediction. The results can be observed in Table 2. In terms of % of changes in prediction, the results are not as satisfactory as expected. However that might be due to the fact of the system call being removed from the sequences.
