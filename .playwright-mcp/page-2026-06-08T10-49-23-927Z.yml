                          - heading "A. Data Preprocessing" [level=3] [ref=e777]
                          - paragraph [ref=e778]: The dataset is a generated version of the ADFA-LD dataset. The dataset is based on system calls, with normal traces and attack traces with attacks such as password brute force, denial of service, and network scan. Every instance of the dataset consists of a sequence of 30 system calls. A system call is a programmatic request for a service provided by the operating system, allowing applications to interact with the underlying hardware and access various system resources. Each different system call in the dataset is represented by a number. For instance, the system call “swapoff” is represented in the data as “168”. In the dataset used, there are 149 different system calls. Figure 7 represents an example of an instance of the dataset. It is a sequence of system calls.
