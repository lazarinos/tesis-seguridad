                          - paragraph [ref=e993]: As for the scores, the accuracy indicates that the model classifies approximately 93.7% of the instances, which is a good result, especially, taking into account the size of the dataset.
                          - paragraph [ref=e994]: The precision suggests that when the model predicts a positive instance, 98.1% of the time it is correct. The sensitivity value of 89.5% represents that the model correctly identifies that number of percentage of the actual positive instances. A higher value is desirable to minimize FN since it suggests a lower rate of missing positive cases, which is of high importance for the use case of the model. With the value of specificity being 98.2%, we can understand a low rate of FP for negative cases, being the number of FP 475 which is very low in comparison to the size of negative cases. The F1 score with a value of 93.6%, means the model achieves a balanced performance in terms of precision and recall. It indicates a good trade-off between FP and FN. The overall analysis of the model based on the scores is good.
                          - paragraph [ref=e995]: The model demonstrates appropriate values for the metrics and it seems to be effective in correctly classifying both positive and negative instances. In overall, we can consider that the model presents high score values, which is important for the classification problem it is inserted on.
                        - generic [ref=e996]:
                          - heading "D. Overall Results" [level=3] [ref=e997]
                          - paragraph [ref=e998]: In order to address the explainability of the model, we have successfully implemented XAI methods, such as LIME and SHAP. With the implementation of these methods we were able to retrieve explanations about the model results.
                          - paragraph [ref=e999]: With the explanations, we were able to retrieve the most important system calls for the classification of each instance of the dataset. These most important system calls are the ones having the most impact on the classification of a particular instance. On a global analysis, it was possible to observe that there are system calls that only appear, for example, in the explanations of FN cases and not in the explanations of TP cases (and vice versa). This information is useful to cybersecurity experts because one system call that only appears in the explanations of FN cases and not in the explanations of TP cases means that when present in the input, that system call might be misleading the model classification. The same was observed for FP and TN cases. These results are presented in Figure 10. It is important to refer that these results match for both LIME and SHAP. However, on a local scope, for the same instance, the systam calls present in the explanations of LIME might be different than the ones present in the explanations of SHAP. For example, it is possible to see that the system call setsockopt appears in the explanations of FN cases and never appears in explanations of TP cases. This might induce that this system call present in the input might be misleading the model to classify the instance as negative when it should be positive.
