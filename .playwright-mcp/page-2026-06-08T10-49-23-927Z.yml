                          - paragraph
                          - paragraph [ref=e1086]: In a comparison with the LIME results, it is possible to conclude that the results with the two methods are very similar. There are cases where perturbations considering explanations with LIME have a bigger percentage of changes in prediction. But the same happens in some cases when perturbing based on SHAP explanations. It is important to analyze instances where the two methods produce divergent explanations since it can reveal vulnerabilities in the IDS model, such as susceptibility to adversarial attacks or the presence of non-linear interactions between features. This information can inform strategies to enhance model robustness and resilience against potential threats.
                        - generic [ref=e1087]:
                          - heading "G. Comparison of Lime and SHAP Results" [level=3] [ref=e1088]
                          - paragraph [ref=e1089]: In order to evaluate, validate, and compare the two XAI methods used (LIME and SHAP), we have performed a survey. The survey had 24 participants. From the participants, 7 had a doctorate degree, 7 a master’s degree, and 8 a bachelor’s. The majority had worked with machine learning or AI, and were familiar with the concept of XAI. The questions are based on two distinct classification problems. The first is very simple in order to the participants familiarize with LIME and SHAP. The second is the actual IDS classification and explanations examples. The survey can be divided into three main sections. The first section presented the first problem, with examples of inputs and outputs without explanations, with explanations from LIME and SHAP, and additionaly with a validation of the explanations from LIME and SHAP. The second section is similar to the first but using the second presented problem. On the third section, LIME and SHAP were compared directly to observe the differences in terms of interpretability increase and confidence felt by the participants regarding one method over the other. On an overall analysis of the answers, it is possible to conclude that, as expected, having explanations to help in the interpretation of the results of the model is of significant importance.
                          - paragraph [ref=e1090]: It is important to note that a choice of method takes into consideration the application context, user preferences, and dataset and model characteristics. In terms of application context, LIME may be more suitable if the priority is local interpretability for individual predictions while SHAP might be a better fit for global interpretability and if consistency is crucial. In terms of user preferences, some users may find LIME’s local, user-friendly explanations more accessible, while others might appreciate the theoretical foundations and global interpretability of SHAP. The nature of the dataset and the complexity of the ML model can influence the effectiveness and efficiency of each method, for instance when dealing with large datasets, the scalability of the explanation method becomes important. However, in the survey, in the questions that directly compared the two XAI methods and where the participants had to chose a favorite, LIME is the clear preferred. These questions presented the explanations from LIME and SHAP for the same instance, questioning the participants which they felt more trust and in which they felt the interpretability increased more. When participants were queried about their preferences and specifically sought information about the characteristics of each method, LIME remained the favored choice. This preference is likely attributed to the more user-friendly visual explanations offered by LIME. In the survey, nearly all participants emphasized the significant importance of the visualization of explanations. However we must also highlight that some of the participants who usually voted on SHAP over LIME were the ones with more technical background, elucidating probably to the consistency of the method over the visualizations.
                          - paragraph [ref=e1091]: It is notable that generating explanations using LIME and SHAP can be computationally expensive, especially for large-scale IDS deployments with high data throughput. The additional overhead of explanation generation might impact the real-time performance of the system. Comparing both methods in terms of computational load, in our work and experiments, we have to highlight that SHAP was in fact considerably more expensive than LIME, for the exact same experiments. This certainly impacts the choice of the XAI method when one of the factors to look for is the computational load.
                          - paragraph [ref=e1092]: We must highlight that the majority of the participants answered that the additional validation step of the explanations increased their trust on the XAI methods and their explanations.
                      - generic [ref=e1093]:
                        - generic [ref=e1094]:
                          - generic [ref=e1095]: SECTION VI.
                          - heading "Conclusion" [level=2] [ref=e1096]
                        - paragraph [ref=e1097]: In this work, we have used two XAI methods (LIME and SHAP) to provide explanations for the results of a black-box model part of an intrusion detection solution for IoT devices. With the explanations, we were able to identify the most important system calls for the classification of each instance. Based on the explanations provided, we carried out perturbations to the input to observe a different output. With these results, we were able to collect system calls that have a significant negative impact on the output, when present in the input sequence. This way, the cybersecurity person in charge of analyzing the model, is provided with insights about the model behavior, and particular features that when present in the input can lead to wrong predictions.
                        - paragraph [ref=e1098]: In this work, we have also performed a direct comparison between the two used XAI methods, LIME, and SHAP. We have performed the same experiments with the two methods and checked which performed better for each experiment. We have also conducted a survey where the participants answered questions that directly compared the two methods in terms of interpretability increase of the black box model, and preference of method, based on characteristics and different provided examples.
                        - paragraph [ref=e1099]: The work can be further improved by conducting similar experiments with a broader range of XAI methods, or by implementing the same approach and experiments on different black box models and diverse use cases. Additionally, extending the approach to other types of intrusion detection systems (IDS) beyond IoT, and exploring applications in various domains, could provide valuable insights. Moreover, ongoing validation, evaluation, and comparison of XAI methods and their explanations are essential for advancing the understanding and adoption of transparent AI systems in real-world scenarios.
