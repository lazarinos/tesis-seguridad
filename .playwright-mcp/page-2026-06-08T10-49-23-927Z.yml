                          - paragraph [ref=e1011]: To evaluate the explanations provided, we have performed perturbations, based on system calls of Figure 10. A system call that only appears, for instance, in the explanations of FN, is replaced every time it appears, with a system call that only appears in the explanations of the opposite case (this being, TP). The same was performed for the TN and FP cases. Some of the most relevant results are represented in Figure 11. For example, when the system call setsockopt that is only present in the explanations of FN cases is replaced with the system call accept that only appears in the explanations of TP cases, 90% of the instances of FN where setsockopt is present in the input change the prediction to TP. This might be a clue that this system call is having a negative impact on the model classification when present in the input.
