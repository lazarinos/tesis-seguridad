                          - paragraph
                          - paragraph [ref=e790]: One system call might appear multiple times in one sequence. This means that it is possible for one sequence to only have one or two system calls with multiple appearances.
                          - paragraph [ref=e791]: In order to pre-process the system call sequences, two mechanisms are used, the Term Frequency-Inverse Document Frequency (TF-IDF) and the chi-squared test.
                          - paragraph [ref=e792]:
                            - text: One of the most common methods to calculate the weights of words that occur in a document, in document classification, is the TF-IDF model. Term Frequency (TF) refers to the occurrences of a certain word in a document, and Inverse Document Frequency (IDF) pertains to the number of times the word occurs in a document corpus (i.e., collection of documents). The n-gram technique is defined as a tuple of
                            - generic [ref=e801]: "n"
                            - text: words where
                            - generic [ref=e810]: "n"
                            - text: is, a small positive integer, in our case the
                            - generic [ref=e819]: "n"
                            - text: is equal to 2.
                          - paragraph [ref=e820]: For dimension reduction, the chi-squared test is applied. The chi-squared test is often employed to analyze data that is organized into categories or counts. It compares the observed frequencies of each category in a dataset with the frequencies that would be expected if there were no association between the variables. It calculates the statistic called the chi-squared statistic (X2), which measures the difference between the observed and expected frequencies.
                          - paragraph [ref=e821]: Figure 8 shows the pre-processing stage of the input system call sequences. A sequence of system calls is received, suffers a vectorization, followed by a feature reduction, resulting in an array of 150 features, being each feature a constant ngram (label), the value of the features, according to the system call sequence in question. Then, the data is fed to the model.
