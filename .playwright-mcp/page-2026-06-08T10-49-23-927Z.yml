                          - generic [ref=e704]: SECTION IV.
                          - heading "Proposed Approach" [level=2] [ref=e705]
                        - generic [ref=e706]:
                          - heading "A. Retrieval of Explanations" [level=3] [ref=e707]
                          - paragraph [ref=e708]:
                            - text: To implement our approach, we applied the selected XAI methods (LIME and SHAP) to a black-box model integrated into a solution designed for intrusion detection in IoT devices. Both methods exhibit model-agnostic characteristics, accommodating multiple models and data types, and offer local explanations. The selection of these methods was influenced by their widespread use in the literature and their similarity, a crucial factor facilitating a meaningful comparison between them. However, some changes on the methods were necessary in order to achieve the desired setup. The dataset used is a generated version of the ADFA-LD
                            - link "[20]" [ref=e709] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: ","
                            - link "[21]" [ref=e710] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: ","
                            - link "[22]" [ref=e711] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: dataset that we will further describe with more detail in section V. The dataset is based on system calls, with normal traces and attack traces with attacks such as password brute force, denial of service, and network scan.
                          - paragraph [ref=e712]:
                            - text: For the explanations with LIME, we used the LimeTabularExplainer
                            - link "[23]" [ref=e713] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: ", where we defined our explainer and fed it information about the model and data. We provided to the explainer the data, the feature names, and the class names. For every dataset instance, explanations were retrieved. It was defined that the explanations would be made using the 10 most important features of each instance."
                          - paragraph [ref=e714]:
                            - text: In the execution of the explanations with the second XAI method (SHAP), the approach is similar. As in the LIME case, SHAP supports numerous models and data types. For our approach we decided to use the KernelExplainer
                            - link "[24]" [ref=e715] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: as it is the model-agnostic explainer of SHAP. For all the instances, as in LIME, the explanations were retrieved using the 10 most important features of each instance.
                          - paragraph [ref=e716]: At the conclusion of this step, we obtain explanations from LIME for all instances in the dataset, along with corresponding explanations from SHAP for the same instances in the dataset.
                        - generic [ref=e717]:
                          - heading "B. Evaluation of Explanations" [level=3] [ref=e718]
                          - paragraph [ref=e719]: In order to better analyze, validate, and evaluate the explanations provided by the XAI methods, we have performed a perturbation analysis based on the explanations.
                          - paragraph [ref=e720]: Perturbation analysis is a valuable technique used to understand the behaviour of the system when subjected to small changes or disturbances in its inputs. The primary goal of the perturbation analysis is to assess how the model responds to the small perturbations carried out. First, we have collected the 10 most important features for the classification of each instance (as presented in the subsection above). Then we have performed perturbations on the input data of each instance by perturbing the 10 most important features previously collected. The perturbations were based on removing/replacing these features from the original input instances, generating new input instances. After the perturbations, the new generated input instances were fed back to the model with the goal of obtaining different outputs, validating and evaluating the explanations provided by the XAI methods. Figure 3 shows the main layout of the experiments that we just described. The results, and experiments are explained in more detail in section V.
