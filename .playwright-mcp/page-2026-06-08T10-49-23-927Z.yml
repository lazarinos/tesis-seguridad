                          - paragraph
                          - paragraph [ref=e1023]: With the explanations provided by the XAI methods, the interpretability of the model increases and cybersecurity experts might extract insights about the model behaviour from them. Based on the perturbations carried, the explanations are validated and on an overall analysis, the identified system calls in Figure 10 represent a significant evolution to the interpretation of the model results leading to cybersecurity experts knowing before-hand the impact these features might have when present in the input sequence. Discovering such features that might lead to incorrect predictions, as revealed by LIME and SHAP explanations, assists in refining the data and enhancing the model, thus improving the accuracy of the intrusion detection system. This understanding allows for adjustments to decision thresholds and model improvement, ensuring more effective intrusion detection in real-world scenarios.
