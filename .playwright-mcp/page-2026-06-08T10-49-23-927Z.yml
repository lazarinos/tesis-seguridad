                        - generic [ref=e329]:
                          - generic [ref=e330]: SECTION I.
                          - heading "Introduction" [level=2] [ref=e331]
                        - paragraph [ref=e332]:
                          - text: Nowadays, network security is extremely important. It is estimated that by this year will be a trillion physical devices connected to the internet
                          - link "[1]" [ref=e333] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: . To cybersecurity, this is a big concern. Devices connected to the Internet with wide distribution and openness are the ideal targets for cyber attacks. Since new equipment with this characteristics is being made and connected every day, collecting and processing private information, they become the perfect targets for attackers
                          - link "[2]" [ref=e334] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: .
                        - paragraph [ref=e335]: In recent years, the field of Artificial Intelligence (AI) has seen significant advancements in terms of learning performance of Deep Learning (DL) methods, compared to traditional Machine Learning (ML) methods. Intrusion Detection Systems (IDS) have proven to be effective, especially with the use of Deep Neural Networks (DNNs) that have improved the detection rates of such models. However, the problem with some state-of-the-art models is their complexity, making them hard to understand when analyzed by humans.
                        - paragraph [ref=e336]:
                          - text: There are models considered interpretable, e.g., Decision Trees, Decision Rules and Linear Models. Unfortunately, usually there is a tradeoff between explainability of the model and its learning performance. Explainability of a machine learning model is usually inverse to its learning performance
                          - link "[3]" [ref=e337] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: . Models with high learning performance are not as explainable as simpler models as Figure 1 shows. We can see so in the figure that Decision Trees have high explainability values. However, looking at the learning performance, they are the learning techniques that present the lowest learning prediction. In contrast, Deep Learning techniques such as Deep Neural Networks (DNNs) show high values of learning performance but are the least explainable. The motivation for eXplainable Artificial Intelligence (XAI) research is to increase the explainability of these high learning performance models.
                        - generic [ref=e338]:
                          - generic [ref=e339]:
                            - link "FIGURE 1. - Explainability of machine learning models appear inverse to their prediction accuracy [3]." [ref=e340] [cursor=pointer]:
                              - /url: /mediastore/IEEE/content/media/6287639/10380310/10440604/gaspa1-3368377-large.gif
                              - img "FIGURE 1. - Explainability of machine learning models appear inverse to their prediction accuracy [3]." [ref=e341]
                            - button "View Larger Image" [ref=e343] [cursor=pointer]: 
                          - generic [ref=e344]:
                            - text: FIGURE 1.
                            - paragraph [ref=e346]:
                              - text: Explainability of machine learning models appear inverse to their prediction accuracy
                              - link "[3]" [ref=e347] [cursor=pointer]:
                                - /url: javascript:void()
                              - text: .
                          - paragraph [ref=e348]:
                            - button "Show All" [ref=e349] [cursor=pointer]
                        - paragraph
                        - paragraph [ref=e350]: eXplainable Artificial Intelligence (XAI) is a research field that aims to address the lack os explainability and trusworthiness of black-box models and make them more understandable to humans. The research on this topic has increased in recent years. However, the majority of work and research about interpretation and transparency of models is focused on other fields like computer vision, natural language processing, biology, and healthcare making model interpretability on IDS still very uncovered.
                        - paragraph [ref=e351]: In non-critical applications such as product recommendations on e-commerce websites or friend suggestions on social networks, a wrong prediction may not have severe consequences. However, in critical applications such IDS or medical diagnosis, the lack of transparency, trustworthiness, and explainability in these models poses significant risks. Thus, there is a need for techniques that enhance the interpretability and increase trustworthiness on these models. For those reasons, in this work, we used two XAI methods such as LIME (Local Interpretable Model-Agnostic Explanations) and SHAP (SHapley Additive exPlanations) to provide explanations and increase the interpretability of a black box model part of an IDS solution that performs intrusion detection on IoT devices.
                        - paragraph [ref=e352]: In the execution of our work we have used a generated version of the ADFA-LD dataset. The model receives sequences of system calls - a programmatic request for a service provided by the operating system, enabling applications to interact with the underlying hardware and access various system resources. The model output is 0 if the sequence is deemed normal and 1 if an anomaly is detected. Given that analyzing system call sequences when unexpected events occur is a complex task, providing explanations about the model predictions gives cybersecurity personnel insights into the model’s behavior, enabling them to make informed decisions about the results. In our approach, we have additionally conducted a perturbation analysis based on the explanations to obtain a different input, thereby validating the explanations. Through perturbation analysis, the adverse impact of specific system calls on classification, when present in the input, is identified. This serves as added value when scrutinizing the model and its results, and it proves advantageous for the continuous improvement of the model. As an additional step, we have conducted a survey analysis in which participants answered questions evaluating the degree of interpretability increase when each XAI method is used, directly comparing both methods. Additionally, it assesses the level of necessity for XAI methods and interpretability in the analysis of black-box models. This work also leaves open the possibility of being enhanced applying this approach to other models and types of data.
                        - paragraph [ref=e353]: "The main contributions of this work are the following:"
                        - list [ref=e354]:
                          - listitem [ref=e355]:
                            - paragraph [ref=e356]: We propose an architecture that uses XAI methods such as LIME and SHAP to provide local explanations for the results of a black-box model that is part of an IDS solution that performs intrusion detection on IoT devices. This architecture is beneficial to the understanding of the predictions made from the IDS, and help cybersecurity personnel to interpret the those predictions with insights of the model behavior.
                          - listitem [ref=e357]:
                            - paragraph [ref=e358]: In addition to the local explanations, we use an approach to validate and enhance the trust on the explanations, based on a perturbation analysis that takes into consideration the explanations provided. The input suffers perturbations in an attempt to obtain a different output, hence validating the explanations provided. Since we use two XAI methods, the perturbation analysis can also serve as a comparison of the XAI methods performance.
                          - listitem [ref=e359]:
                            - paragraph [ref=e360]: To evaluate the explanations provided from the XAI methods, and make a direct comparison between the methods, we carried out a survey where participants answered questions destined to evaluate the degree of interpretability increase of the model using each method, and answered questions that directly compared the XAI methods, choosing the preferred method.
                          - listitem [ref=e361]:
                            - paragraph [ref=e362]: During the experimental phase, we successfully identified features with adverse effects on the model outcome when present in the input. This holds paramount significance for cybersecurity professionals, as it allows for informed analysis of model results. The recognition of these features in the input signals potential inaccuracies in the output. It is notable to highlight its importance in ensuring the continuous improvement of the model.
                        - paragraph
                        - paragraph [ref=e363]: The rest of the paper is organized as follows. section II describes the related works. The background is discussed in section III. In section IV we present our proposed approach to increase the interpretability of a black box model part of an IDS solution for IoT devices, and the validation and evaluations steps of the explanations provided. In section V we describe the experiments carried out using a generated version of the ADFA-LD dataset, presenting the results in detail. Finally, section VI presents the conclusion to this work and how it could be further enhanced.
                      - generic [ref=e364]:
                        - generic [ref=e365]:
                          - generic [ref=e366]: SECTION II.
                          - heading "Related Work" [level=2] [ref=e367]
                        - paragraph [ref=e368]: Although XAI is a captivating research area, the majority of research efforts are directed towards domains like healthcare, natural language processing, and computer vision. The interpretability methods are rarely used for intrusion detection. However, with the intrusion detection systems becoming more complex, works to improve the interpretability of such models have emerged.
                        - paragraph [ref=e369]:
                          - text: Wang et al.
                          - link "[4]" [ref=e370] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: propose a framework that leads to improve the transparency of any IDS, presenting the first use of SHAP to provide local and global explanations for intrusion detection. The authors interpret and compare two different classifiers, one-vs-all classifier and multiclass classifier using the NSL-KDD dataset to test the framework feasibility. The experimental results show that the interpretation results, generated by the framework, are consistent with the characteristics of the specific attacks, and the results are very intuitive.
                        - paragraph [ref=e371]:
                          - text: Patil et al.
                          - link "[5]" [ref=e372] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: proposes an innovative intrusion detection system, using ensemble methods of machine learning and incorporating the XAI method LIME for better explainability and understanding of the black-box approach to reliable intrusion detection. The experimental results confirm LIME is more explanation-friendly and more responsive.
                        - paragraph [ref=e373]:
                          - text: Marino et al.
                          - link "[6]" [ref=e374] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: presented an approach to generate explanations for incorrect classifications made by data-driven IDS. An adversarial approach is used to find the minimum modifications (of the input features) required to correctly classify a given set of misclassified samples. The magnitude of the modifications is used to visualize the most relevant features that explain the reason for the misclassification. Experimental evaluation was conducted on the NSL-KDD99 benchmark dataset using Linear and Multilayer perceptron classifiers.
                        - paragraph [ref=e375]:
                          - text: Mane and Rao
                          - link "[7]" [ref=e376] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: have used deep neural network for network intrusion detection and also proposed explainable AI framework to add transparency at every stage of machine learning pipeline. The explanations are generated from SHAP, LIME, Contrastive Explanations Method (CEM), ProtoDash and Boolean Decision Rules via Column Generation (BRCG). The approaches were applied to NSL-KDD dataset for intrusion detection system (IDS).
                        - paragraph [ref=e377]:
                          - text: Siganos et al.
                          - link "[8]" [ref=e378] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: introduced an AI-powered IDS with explainability functions for the IoT. The proposed IDS relies on ML and DL methods, while SHAP is used to explain decision-making. The evaluations results demonstrate the efficiency of the proposed IDS in terms of detections performance and explainable AI (XAI).
                        - paragraph [ref=e379]:
                          - text: Barnard et al.
                          - link "[9]" [ref=e380] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: present a two-stage pipeline for robust network intrusion detection. The authors implement an extreme gradient boosting (XGBoost) model to perform supervised intrusion detection, and leverage the use of SHAP to provide explanations. In a second stage, the explanations are used to train an auto-encoder to distinguish between previously seen and unseen attacks. Experiments were conducted on the NSL-KDD dataset showing that the solution accurately detect new attacks encountered during testing, while the overall performance is comparable to numerous state-of-the-art works from literature.
                        - paragraph [ref=e381]:
                          - text: Neupane et al.
                          - link "[10]" [ref=e382] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: conducted a comprehensive survey on Explainable Intrusion Detection Systems (X-IDS), emphasizing the importance of transparency and interpretability in the context of evolving cyber threats. The paper provides an overview of current methods, challenges, and opportunities in X-IDS, making it a valuable resource for researchers and practitioners in the field.
                        - paragraph [ref=e383]:
                          - text: Sharma et al.
                          - link "[11]" [ref=e384] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: propose a deep learning-based approach for intrusion detection in IoT networks. They address security issues in IoT layers and use XAI techniques such as LIME and SHAP to interpret the deep learning model’s decisions. The approach achieves high accuracy and offers valuable insights for researchers in this field.
                        - paragraph [ref=e385]:
                          - text: Even though the past works use XAI methods for intrusion detection, they focus on the part of developing an IDS and apply the XAI methods to have explanations, either local or global in scope. Although there has been adoption of XAI methods like LIME and SHAP, the literature lacks validation, evaluation, and comparison of the results of such methods. These steps are important not only to ensure the reliability and robustness of these methods but also for facilitating meaningful comparisons between different XAI techniques, allowing possible end-user of such techniques to make well-informed decisions when it comes to the selection and use of XAI methods. In this work, we went further and address it; we explored the explanations provided by LIME
                          - link "[12]" [ref=e386] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: and SHAP
                          - link "[13]" [ref=e387] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: through evaluation and validation analysis.
                        - paragraph [ref=e388]: In the validation analysis, perturbation on the input data was performed based on the explanations in order to obtain a different output to attempt to check the truthfulness of the explanations. Through the validation analysis we were also able to retrieve system calls that have a negative impact on the classification of the model when present in the input that will be discussed in more detail on section V. The evaluation analysis was based on the validation and on a survey where the participants answered questions on how the explanations are important for a better understanding of the model. In the survey, a direct comparison of both XAI methods used (LIME and SHAP) is performed to evaluate which method the participants felt more confident with.
                        - paragraph [ref=e389]:
                          - text: We have selected LIME and SHAP due to their model-agnostic nature, allowing their application to multiple models and data types, also offering local explanations. The selection of these methods was also influenced by their widespread use in the literature, and we will elaborate more on them in the next section. However, there are other well-known and used XAI methods that could have been selected, such as Anchors
                          - link "[14]" [ref=e390] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: ", Accumulated Local Effects (ALE)"
                          - link "[15]" [ref=e391] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: ", Counterfactual Explanations"
                          - link "[16]" [ref=e392] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: ", and Contrastive Explanations Method (CEM)"
                          - link "[17]" [ref=e393] [cursor=pointer]:
                            - /url: javascript:void()
                          - text: . For further improvement of this work such methods could be considered to be applied on the approach and compared with LIME and SHAP.
