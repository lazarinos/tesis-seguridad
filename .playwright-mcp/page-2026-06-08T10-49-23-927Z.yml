                          - paragraph [ref=e1055]: On an overall analysis of the LIME results, the impact of different system calls for different scenarios can be observed. These perturbations serve to validate the explanations of LIME as we try to obtain a different output by perturbing the system calls that LIME says have the most impact for each instance’s classification. Not only that but we can also obtain tangible values about the impact of particular system calls that might be affecting the results of the model to a wrong classification when present in the input. It can also be used to compare the precision of the explanations with the ones retrieved with SHAP. It is notable to mention again that this information is significantly important to the cybersecurity experts analyzing the results and helps the continuous improvement of the model.
