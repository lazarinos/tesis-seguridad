                          - heading "C. Structure and Performance of the Ids" [level=3] [ref=e971]
                          - paragraph [ref=e972]: In order to apply and validate our approach we used as the black box model, a MLPClassifier, part of an IDS solution that performs intrusion detection on IoT devices.
                          - paragraph [ref=e973]: "The MLPClassifier has four layers: one input layer and 3 dense layers. The first and second layers of the dense layers have as activation function the “relu” function, while the third dense layer has the “sigmoid” function as activation function. The model is a Tensorflow model and generated with Keras framework. The IDS analyzes sequences of 30 system calls - a fundamental interface between a user-level process and the operating system (OS) kernel. The sequences undergo a pre-processing stage, transforming them in the input data of the MLPClassifier. The model input data is in form of arrays of 150 features, and is explained in more detail further ahead. The model makes binary predictions. If the output of the model, to a certain input instance is 1, then it is because something abnormal has happened, possibly being an intrusion. In the case of the output being 0, no anomaly is detected."
                          - paragraph [ref=e974]: Figure 9, and Table 1, present the current scores of the model. As it can be seen, the model presents good performance values which means that most of its predictions are accurate. However, there are cases where the model is incorrect, as we can see through the confusion matrix. There are 52656 instances on the dataset that we have used. We can see that there are 24 038 TP, which means the number of times that the model predicted that there was a possible anomaly and was correct. The number of FN is 2832, and, as we can understand, very low in comparison to the number of TP. However, the number is relevant and represents important mistakes of the model. In the case of anomaly detection, a FN can be harmful because it is misunderstood by the model and so the cybersecurity experts that are in charge of analyse the system, in case of a potential threat, will not be aware that there is one in these cases. Similarly, the number of TN is 25 311 and the number of FP is 475, which is not as impactful as the TP and FN. This is because a FP was supposed to be a negative prediction, meaning that there was no anomaly happening. In Figure 9 we can see the complete confusion matrix for the model.
