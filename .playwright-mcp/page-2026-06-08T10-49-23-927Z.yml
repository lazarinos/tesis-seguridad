                          - heading "B. SHAP" [level=3] [ref=e539]
                          - paragraph [ref=e540]:
                            - text: SHAP is an unified framework proposed by Lundberg and Lee
                            - link "[13]" [ref=e541] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: for interpreting predictions. Assigns each feature an importance value for a particular prediction and connects LIME and Shapley values.
                          - paragraph [ref=e542]:
                            - text: "One innovation that SHAP has is that the Shapley value explanation is represented as a linear model. That view connects LIME and Shapley Values. Each SHAP value measures how much each feature in the model contributes, either positively or negatively. It offers two essential benefits: it can be calculated for any model rather than just simple, linear models and each record has its own set of SHAP value. SHAP values provide three significant advantages compared to other methods. First, SHAP has a solid theoretical foundation in game theory"
                            - link "[4]" [ref=e543] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: ". Shapley values are the only attribution method to satisfy the properties: Efficiency, Symmetry, Dummy, and Additivity"
                            - link "[19]" [ref=e544] [cursor=pointer]:
                              - /url: javascript:void()
                            - text: . Efficiency refers to the feature contributions that must add up to the difference of prediction for x and the average. Symmetry is about the contributions of two feature values j and k should be the same if they contribute equally to all possible coalitions. Dummy refers to a feature j that does not change the predicted value, regardless of which coalition of feature values it is added to and should have a Shapley value of 0. Additivity means that the total Shapley value assigned to a coalition of players or features is equal to the sum of the individual Shapley values of the players or features when they join the coalition. SHAP can also satisfy these since it gets Shapley values from linear models. Second, SHAP connects LIME and Shapley values. It helps to unify the field of interpretable machine learning. At last, SHAP has a fast computation for machine learning models compared to calculating Shapley values directly. SHAP specifies the explanation for an instance x
