            - main [ref=e155]:
              - generic [ref=e156]:
                - generic [ref=e158]: Resumen
                - generic [ref=e165]: En la plataforma del Vicerrectorado de Investigación de la Universidad Nacional del Altiplano de Puno en 2019, se planteó la hipótesis de la existencia de una probabilidad de riesgo en la seguridad informática, en relación a la ocurrencia de amenazas e impacto en daños. El principal objetivo de esta investigación fue determinar el nivel de riesgo en seguridad informática mediante políticas y estándares ISO 17799, bajo un diseño descriptivo transversal-exploratorio, lo que permitió la implementación de procesos y procedimientos seguros en el manejo y seguridad de la información. Los resultados generales de esta investigación mostraron que el 40,6 % de los ítems observados tenían un alto impacto, y la probabilidad de ocurrencia fue de nivel medio; en seguridad informática, esto representa un alto riesgo en el manejo de la información. También se observó que el 68,6 % de los ítems con alta probabilidad de ocurrencia tuvieron un alto impacto en el nivel de seguridad, los cuales serán reforzados en base a los hallazgos. En conclusión, se determinó que el nivel de riesgo en seguridad informática en la plataforma del Vicerrectorado de Investigación fue alto, de acuerdo con los activos que podrían verse comprometidos en caso de nuevos ataques a la seguridad informática.
