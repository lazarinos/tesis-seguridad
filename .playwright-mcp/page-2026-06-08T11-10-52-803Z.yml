                        - 'heading "2.2. SHAP: SHapley Additive Explanations" [level=3] [ref=e311]'
                        - generic [ref=e312]:
                          - text: SHAP is a model-agnostic technique designed to explain the prediction of a specific instance x by calculating the contribution of each individual feature to the final prediction. This approach is grounded in Shapley values, derived from game theory [
                          - link "28" [ref=e313] [cursor=pointer]:
                            - /url: "#B28-computers-14-00160"
                          - text: "]. Within this framework, data features are considered “players” in a coalition, while Shapley values equitably distribute the prediction, treated as the “payout”, among the relevant features ["
                          - link "21" [ref=e314] [cursor=pointer]:
                            - /url: "#B21-computers-14-00160"
                          - text: "]. Notably, a single player may represent a group of related features. A conceptual diagram of SHAP is presented in"
                          - link "Figure 2" [ref=e315] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f002"
                          - text: ", a technique based on Shapley value theory to explain predictions in black-box machine learning models. It is divided into three sections: definition, highlighting its capability for both local and global explainability; objectives, which include interpretability, equitable feature contribution, and transparency in identifying influential variables; and process, which encompasses instance selection, baseline prediction, feature coalition formation, marginal contribution calculation, and the generation of local and global explanations. This approach enhances the interpretability and transparency of complex machine learning models."
