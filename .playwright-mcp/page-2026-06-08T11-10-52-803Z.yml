                      - generic [ref=e945]:
                        - heading "3.3. Comparative Analysis of SHAP and LIME Explanations" [level=3] [ref=e946]
                        - generic [ref=e947]:
                          - text: Considering the need for an objective evaluation of the applied explainability methods, this section presents a systematic quantitative analysis comparing SHAP and LIME. The five most relevant features identified by each method are compared across ten representative instances from the UNSW-NB15 dataset, using the Jaccard similarity index to assess their degree of overlap. Additionally, divergent features are identified to explore differences in relevance attribution. This analysis strengthens the interpretative validity of the model and highlights the complementary value of both approaches in cybersecurity forensic analysis contexts. As shown in
                          - link "Table 4" [ref=e948] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t004"
                          - text: ", SHAP and LIME exhibit high consistency in several instances, with perfect agreement (Jaccard = 1.00) in four out of ten cases. However, instances with lower similarity scores reveal subtle divergences in feature prioritization, underscoring the importance of a complementary use of both explainers for robust forensic interpretations."
                        - generic [ref=e949]:
                          - generic [ref=e950]: Table 4. Quantitative comparison of SHAP and LIME explanations across sample instances.
                          - generic [ref=e952] [cursor=pointer]:
                            - img [ref=e953]
                            - link [ref=e954]:
                              - /url: "#table_body_display_computers-14-00160-t004"
                        - generic [ref=e955]: To enhance the interpretability analysis, a detailed comparison of the top-five features identified by SHAP and LIME was conducted across ten representative instances from the dataset. For each case, the number of overlapping features and the Jaccard similarity index, expressed as a percentage, were calculated to quantify the degree of agreement between the two explainability methods. Additionally, the specific features exclusively identified by each method are reported to highlight divergences in relevance attribution.
                        - generic [ref=e956]:
                          - text: These results are summarized in
                          - link "Table 5" [ref=e957] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t005"
                          - text: ", which presents the feature sets selected by each method, the overlap count, and the corresponding Jaccard index for each instance, along with the divergent attributes identified exclusively by SHAP or LIME. This analysis provides a granular perspective on the consistency and complementarity of SHAP and LIME, facilitating a deeper understanding of how each method captures feature importance. By referencing the original feature indices, the results also maintain alignment with the dataset’s structure, reinforcing the transparency and traceability of the explainability framework."
