                          - generic [ref=e691]: Figure 4. Diagram of the model training process using the UNSW-NB15 dataset and its integration with SHAP-based explainability.
                        - generic [ref=e692]:
                          - text: "The dataset is first partitioned into three subsets to support the model development workflow: 70% of the data are used for training, 20% for validation, and the remaining 10% for testing. The training and validation sets are employed to select the appropriate algorithm and optimize hyperparameters, while the test set is reserved exclusively for final performance evaluation. Model performance is primarily assessed using accuracy as the main evaluation metric. Additionally, confusion matrices are employed to visualize and analyze the distribution of predictions, offering a detailed understanding of the model’s ability to distinguish between normal and attack traffic. To complement this evaluation, post hoc explainability techniques such as SHAP and LIME are applied to interpret the model’s predictions, identify the most influential features, and ensure transparency in decision-making, particularly in the context of intrusion detection. To address overfitting, the model configurations implemented in this study incorporate architectural mechanisms specifically designed to enhance generalization. XGBoost integrates validation-based early stopping and regularization strategies that constrain model complexity and prevent overtraining. TabNet, in turn, relies on a sparse and attentive architecture that selectively emphasizes the most relevant features, inherently reducing the risk of overfitting while preserving interpretability. In both cases, the combination of adaptive learning dynamics and regularization contributes to stable and efficient training. The integration of these architectural strategies supports the validity of the resulting models by promoting robust generalization to unseen data, without relying on additional or computationally intensive overfitting control procedures. The complete architecture, which is obtained by generating the final form of UNSW-NB15 from the pcap files, is presented in a CSV file with 49 features ["
                          - link "39" [ref=e693] [cursor=pointer]:
                            - /url: "#B39-computers-14-00160"
                          - text: ","
                          - link "40" [ref=e694] [cursor=pointer]:
                            - /url: "#B40-computers-14-00160"
                          - text: "]. These features are detailed in"
                          - link "Table 2" [ref=e695] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t002"
                          - text: .
                        - generic [ref=e696]:
                          - generic [ref=e697]: Table 2. Consolidated feature description grouped by feature type.
