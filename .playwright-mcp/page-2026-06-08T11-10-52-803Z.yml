                      - generic [ref=e702]:
                        - heading "2.4. Model Training" [level=3] [ref=e703]
                        - generic [ref=e704]:
                          - text: The model training was conducted using the UNSW_NB15_training-set file, which consists of 175,341 distinct traffic entries. Each of these rows is categorized based on the type of traffic (Fuzzers, Analysis, Backdoors, DoS, Exploits, Generic, Reconnaissance, Shellcode, and Worms) as shown in
                          - link "Table 2" [ref=e705] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t002"
                          - text: . The UNSW-NB15 dataset is widely recognized for its capability to simulate modern network traffic and attacks, making it a critical resource for evaluating intrusion detection systems [
                          - link "41" [ref=e706] [cursor=pointer]:
                            - /url: "#B41-computers-14-00160"
                          - text: "]. Recent studies emphasize its use for benchmarking machine learning models in cybersecurity ["
                          - link "42" [ref=e707] [cursor=pointer]:
                            - /url: "#B42-computers-14-00160"
                          - text: "]."
                        - generic [ref=e708]:
                          - text: This dataset splitting strategy aligns with standard practices in the field, ensuring adequate model generalization and reliable evaluation of its performance [
                          - link "43" [ref=e709] [cursor=pointer]:
                            - /url: "#B43-computers-14-00160"
                          - text: "]. Ensuring a balanced split between training and validation subsets is particularly important to maintain the statistical relevance of the dataset ["
                          - link "44" [ref=e710] [cursor=pointer]:
                            - /url: "#B44-computers-14-00160"
                          - text: "]."
                        - generic [ref=e711]:
                          - text: To ensure a focused and robust analysis while adhering to best practices aimed at preventing model overfitting and enhancing interpretability [
                          - link "45" [ref=e712] [cursor=pointer]:
                            - /url: "#B45-computers-14-00160"
                          - text: "], a total of 39 features were selected from the original set of 49 variables available in the UNSW-NB15 dataset, presented in"
                          - link "Table 2" [ref=e713] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t002"
                          - text: ". The 10 excluded features fall into the following categories:"
                        - list [ref=e715]:
                          - listitem [ref=e716]:
                            - generic [ref=e717]: "Nominal Identifiers and High-Cardinality Categoricals: Features such as srcip (source), dstip (destination IP addresses), sport, dsport (port numbers), proto (protocol type, such as TCP or UDP), state (state and protocol indicator, such as ACC or CLON), and service (e.g., HTTP, FTP, SSH, DNS) were excluded. These features often act as unique identifiers or have very high cardinality, making them challenging for direct model input without specific encoding strategies (like hashing or embedding) that could potentially obscure interpretability or lead to overfitting. The attack_cat feature was also excluded as it represents the specific attack category name derived from the target label itself."
                          - listitem [ref=e718]:
                            - generic [ref=e719]: "Temporal Features: stime and ltime (start and end timestamps) were omitted as raw timestamps are typically not directly suitable for non-sequential models like the ones used here and could introduce data leakage if not handled carefully."
                        - generic [ref=e720]:
                          - text: The exclusion of 10 features was based on strategic criteria, prioritizing variables with higher predictive relevance and removing those that introduced noise or redundancy into the model. Specifically, nominal attributes such as source and destination IP addresses, port numbers, and service categories, as well as connection time records, were excluded. Although these features provide descriptive context, they do not offer significant explanatory value for the detection of malicious cyber activities [
                          - link "46" [ref=e721] [cursor=pointer]:
                            - /url: "#B46-computers-14-00160"
                          - text: "]. This feature selection process not only simplified the model architecture, improving its interpretability through explainable AI methods such as SHAP and LIME, but also enhanced the transparency of the findings, an essential factor for ensuring the forensic applicability of the results and meeting the ethical and legal standards required for the digital forensic analysis of cyber threats ["
                          - link "47" [ref=e722] [cursor=pointer]:
                            - /url: "#B47-computers-14-00160"
                          - text: "]."
                        - generic [ref=e723]:
                          - text: Following this feature selection and data refinement stage, two models were trained to evaluate the performance of explainable AI techniques. The first model employed XGBoost, an ensemble learning algorithm based on decision trees, which has demonstrated robust performance in cybersecurity applications, particularly for anomaly detection tasks (Algorithm 1). The second model was developed using TabNet (Algorithm 2), a novel deep learning architecture that integrates feature selection within its structure while maintaining high interpretability for tabular data modeling. The objective of training these models was to compare the machine reasoning explanations generated by SHAP and LIME, leveraging models with different levels of inherent interpretability. These models and their respective results will be discussed in detail in the following sections. To support model training, a set of preprocessing operations was applied to the input features, including encoding of categorical variables, normalization of numerical attributes, and exclusion of non-informative identifiers.
                          - link "Table 3" [ref=e724] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t003"
                          - text: summarizes the key preprocessing techniques and their role in preparing the data for both XGBoost and TabNet.
