                    - generic [ref=e967]:
                      - heading "4. Discussion" [level=2] [ref=e968]
                      - generic [ref=e969]: This section analyzes the results obtained from both performance and explainability perspectives, considering the behavior of the XGBoost and TabNet models across validation and test scenarios. Emphasis is placed on understanding the differences in predictive accuracy, the consistency of explanations generated by LIME and SHAP, and the implications of these findings for their application in forensic analysis.
                      - generic [ref=e970]:
                        - heading "4.1. Model Performance and Generalization" [level=3] [ref=e971]
                        - generic [ref=e972]:
                          - text: The experimental results revealed a clear performance drop when moving from the validation to the test phase. While both models—XGBoost and TabNet—achieved high accuracy during validation, 97.80% and 97.68%, respectively, as shown in
                          - link "Figure 6" [ref=e973] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f006"
                          - text: and
                          - link "Figure 11" [ref=e974] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f011"
                          - text: ", their performance decreased significantly on the test set (85.91% and 84.41%, respectively). This decline is likely attributable to overfitting during training, where the models became overly specialized in the training data and thus less capable of generalizing to previously unseen examples."
                      - generic [ref=e975]:
                        - 'heading "4.2. Global Interpretability: SHAP Summary Insights" [level=3] [ref=e976]'
                        - generic [ref=e977]:
                          - text: Global explanations generated with KernelSHAP provided relevant insights into feature importance for both models. In the case of XGBoost, the feature sttl emerged as the most influential, followed by ct_state_ttl, ct_dst_sport_ltm, dbytes, and ct_dst_src_ltm, as shown in
                          - link "Figure 7" [ref=e978] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f007"
                          - text: . In contrast, the TabNet model assigned higher importance to ct_state_ttl, reducing the relative influence of sttl. Notably, the feature dmean gained relevance in TabNet, while dbytes lost significance. These differences reflect the architectural and representational divergences between XGBoost’s tree-based structure and TabNet’s deep learning framework.
                      - generic [ref=e979]:
                        - 'heading "4.3. Local Interpretability: Agreement and Divergence Between LIME and SHAP" [level=3] [ref=e980]'
                        - generic [ref=e981]:
                          - text: The instance-level analyses using LIME and KernelSHAP revealed varying degrees of consistency between the explainers. For XGBoost, both methods classified the analyzed traffic instance as normal with approximately 99% confidence and agreed on the dominant role of sttl. Minor differences were observed in the ranking of less influential features such as ct_state_ttl and dttl, but these remained within acceptable similarity margins (
                          - link "Figure 8" [ref=e982] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f008"
                          - text: and
                          - link "Figure 9" [ref=e983] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f009"
                          - text: ).
                        - generic [ref=e984]:
                          - text: Conversely, for TabNet, greater discrepancies emerged between the LIME and KernelSHAP outputs (
                          - link "Figure 13" [ref=e985] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f013"
                          - text: and
                          - link "Figure 14" [ref=e986] [cursor=pointer]:
                            - /url: "#fig_body_display_computers-14-00160-f014"
                          - text: "). Although both explainers classified the instance as normal with 100% certainty, they diverged on the most influential features: KernelSHAP highlighted ct_state_ttl, whereas LIME identified sttl as most impactful. These differences may result from the increased representational complexity and non-linearity in TabNet, which introduces more intricate feature interactions that are harder to consistently approximate with model-agnostic methods."
                      - generic [ref=e987]:
                        - heading "4.4. Comparative Interpretability and Forensic Applicability" [level=3] [ref=e988]
                        - generic [ref=e989]: The comparative evaluation of XGBoost and TabNet, using a reduced feature set of 39 variables from the UNSW-NB15 dataset, allowed for a nuanced assessment of performance and interpretability in forensic scenarios. While XGBoost demonstrated greater stability across explainability methods and consistent behavior with structured data, TabNet’s deep architecture offered advantages in capturing higher-order interactions, albeit at the cost of increased interpretive variability.
                        - generic [ref=e990]: Despite these differences, both models provided valuable insights for forensic analysis, particularly by enabling the traceability of decisions and reinforcing trust in automated intrusion detection systems. The use of SHAP and LIME not only supports model transparency but also enhances practical forensic capabilities. These techniques facilitate the identification of key features underlying predictions, supporting the validation of alerts, reconstruction of attack paths, and verification of evidence reliability. In operational settings, such explainability can ultimately improve responsiveness, decision accuracy, and the transparency of forensic intelligence procedures.
                    - generic [ref=e991]:
                      - heading "5. Conclusions" [level=2] [ref=e992]
                      - generic [ref=e993]: This study has demonstrated the importance of integrating explainable artificial intelligence (XAI) techniques into the field of computer forensics, particularly in the analysis and interpretation of network-based intrusion detection systems (NIDSs). By implementing SHAP and LIME methods on two representative models, XGBoost and TabNet, the effectiveness of these explanatory techniques in revealing the internal logic of predictions made by complex machine learning models was evaluated.
                      - generic [ref=e994]: The results obtained indicate that both XAI approaches offer useful and understandable interpretations of the decisions made by the models, allowing the identification of the most influential features in the classification process. This interpretive capability contributes to strengthening trust in AI systems, supports their legal admissibility in forensic contexts, and promotes more transparent and accountable investigations.
                      - generic [ref=e995]: Regarding the performance of the evaluated models, XGBoost stands out for its rapid convergence and high accuracy in the early stages of training, making it an efficient solution for environments that require expeditious model deployment and updating. However, its tendency to quickly plateau in the validation phase suggests a limited ability to capture complex relationships in the data.
                      - generic [ref=e996]: In contrast, TabNet, with its architecture based on attention mechanisms and integrated feature selection, showed continuous improvement during training, achieving greater alignment between training and validation performance. This indicates improved generalization capabilities, positioning it as a particularly useful model in cybersecurity scenarios requiring interpretability and operational robustness.
                      - generic [ref=e997]: "The main contributions of this work are as follows: (i) the practical evaluation of two widely used XAI techniques, (ii) the comparative analysis of their results in forensic contexts applied to models with different architectures, and (iii) the discussion of their ethical and operational implications in real-world scenarios. Furthermore, it is highlighted that this approach contributes to compliance with regulatory and ethical requirements by promoting transparency and accountability in the use of AI-based systems."
                      - generic [ref=e998]: Despite its contributions, this study has certain limitations, notably the high computational cost of applying SHAP to deep learning models and the use of a single dataset, which may constrain the generalizability of the findings. Future work will consider evaluating the proposed XAI methodologies on additional forensic datasets, such as CICIDS2017 or data from real-world incidents, to assess the robustness and external validity of the results.
                      - generic [ref=e999]: Further directions include the incorporation of alternative explainability frameworks, such as Anchors and DeepLIFT, to broaden the comparative analysis of interpretability methods. Additionally, the integration of XAI outputs into the operational workflows of forensic analysts is proposed to enhance the practical relevance of these tools and support decision-making based on interpretable and verifiable evidence. Finally, hybrid approaches combining the computational efficiency of XGBoost with TabNet’s representational capabilities will be explored to optimize intrusion detection performance in complex and dynamic environments.
                      - generic [ref=e1000]: Finally, future research could lead to a deeper understanding of the interplay between algorithmic explanation and expert analysis, thereby fostering the development of detection systems that are more transparent, reliable, and suited to the requirements of complex operational contexts.
