                        - generic [ref=e651]:
                          - text: These properties, along with efficiency, ensure that SHAP provides the most theoretically grounded method for feature attribution [
                          - link "29" [ref=e652] [cursor=pointer]:
                            - /url: "#B29-computers-14-00160"
                          - text: "]. Unlike alternative techniques such as LIME, which assumes local linearity of the machine learning model, SHAP is built upon solid theoretical foundations that guarantee completeness and consistency ["
                          - link "30" [ref=e653] [cursor=pointer]:
                            - /url: "#B30-computers-14-00160"
                          - text: ","
                          - link "31" [ref=e654] [cursor=pointer]:
                            - /url: "#B31-computers-14-00160"
                          - text: "]. Recent advancements have further validated SHAP’s effectiveness in high-stakes applications like finance and healthcare, where trust in AI systems is paramount ["
                          - link "32" [ref=e655] [cursor=pointer]:
                            - /url: "#B32-computers-14-00160"
                          - text: ","
                          - link "33" [ref=e656] [cursor=pointer]:
                            - /url: "#B33-computers-14-00160"
                          - text: "]."
                        - generic [ref=e657]:
                          - text: The efficiency property, unique to Shapley values and SHAP, ensures the fair distribution of the prediction among the features of the instance. This makes SHAP the only method capable of providing a complete explanation, which is particularly crucial in scenarios where legal requirements mandate explainability [
                          - link "29" [ref=e658] [cursor=pointer]:
                            - /url: "#B29-computers-14-00160"
                          - text: "]. By satisfying these conditions, SHAP can meet stringent regulatory standards for transparency in AI models. This advantage positions SHAP as an essential tool in the development of ethical AI systems ["
                          - link "13" [ref=e659] [cursor=pointer]:
                            - /url: "#B13-computers-14-00160"
                          - text: ","
                          - link "34" [ref=e660] [cursor=pointer]:
                            - /url: "#B34-computers-14-00160"
                          - text: "]."
                        - generic [ref=e661]:
                          - text: LIME and SHAP are techniques aimed at interpreting complex machine learning models. LIME provides quick local explanations using linear approximations, whereas SHAP delivers global and comprehensive interpretations based on Shapley values, albeit with higher computational cost. Both methods significantly enhance model transparency and understanding; a detailed comparison is presented in
                          - link "Table 1" [ref=e662] [cursor=pointer]:
                            - /url: "#table_body_display_computers-14-00160-t001"
                          - text: . The SHAP/LIME analysis phase provides interpretability by calculating feature contributions and visualizing both local and global explanations. Finally, the insights phase identifies key features, optimizes performance, and justifies model decisions for end users. This structured workflow highlights the importance of explainability techniques in understanding machine learning model behavior.
                        - generic [ref=e663]:
                          - generic [ref=e664]: Table 1. Comparative summary of LIME and SHAP explanation techniques.
