                    - generic [ref=e176]: Graphical Abstract
                - generic [ref=e177]:
                  - generic [ref=e178]:
                    - generic [ref=e179]:
                      - heading "1. Introduction" [level=2] [ref=e180]
                      - generic [ref=e181]:
                        - text: The rapid digitalization of society has led to an unprecedented surge in cybercriminal activities, with an increasing number of connected devices and users becoming potential targets [
                        - link "1" [ref=e182] [cursor=pointer]:
                          - /url: "#B1-computers-14-00160"
                        - text: ","
                        - link "2" [ref=e183] [cursor=pointer]:
                          - /url: "#B2-computers-14-00160"
                        - text: "]. These cyber threats encompass various malicious objectives, including unauthorized data collection from individuals and organizations, ransomware attacks on devices containing confidential information, and illicit content trading in dark markets ["
                        - link "3" [ref=e184] [cursor=pointer]:
                          - /url: "#B3-computers-14-00160"
                        - text: "]."
                      - generic [ref=e185]:
                        - text: Digital forensics, a branch of forensic science, focuses on the recovery, preservation, and analysis of electronic data crucial for criminal investigations. This field encompasses the examination of computers, hard drives, mobile devices, and other data storage media [
                        - link "4" [ref=e186] [cursor=pointer]:
                          - /url: "#B4-computers-14-00160"
                        - text: ","
                        - link "5" [ref=e187] [cursor=pointer]:
                          - /url: "#B5-computers-14-00160"
                        - text: "]. The convergence of escalating cyber attacks and the growing diversity of vulnerable devices has necessitated the adaptation of forensic analysis and incident response methodologies, particularly through the integration of artificial intelligence (AI) technologies ["
                        - link "6" [ref=e188] [cursor=pointer]:
                          - /url: "#B6-computers-14-00160"
                        - text: "]."
                      - generic [ref=e189]:
                        - text: AI, specifically machine learning (ML) algorithms, has demonstrated significant potential in forensic triage by enabling analysts to classify and categorize vast amounts of data while automating repetitive tasks [
                        - link "7" [ref=e190] [cursor=pointer]:
                          - /url: "#B7-computers-14-00160"
                        - text: "]. However, this technological advancement presents unique challenges in the context of digital forensics, where practitioners are bound by strict ethical codes and legal requirements. These protocols ensure that forensic analysis is conducted fairly, objectively, and transparently while adhering to established legislation ["
                        - link "8" [ref=e191] [cursor=pointer]:
                          - /url: "#B8-computers-14-00160"
                        - text: ","
                        - link "9" [ref=e192] [cursor=pointer]:
                          - /url: "#B9-computers-14-00160"
                        - text: "]. Nonetheless, the increasing integration of AI in legal contexts raises additional concerns regarding accountability and due process, particularly when AI decisions cannot be clearly interpreted or challenged. Recent legal research emphasizes the urgency of establishing regulatory standards for the transparent use of AI-generated digital evidence ["
                        - link "8" [ref=e193] [cursor=pointer]:
                          - /url: "#B8-computers-14-00160"
                        - text: "]."
                      - generic [ref=e194]:
                        - text: A critical challenge emerges from the opacity of AI systems, particularly those based on deep neural networks (DNNs). This opacity, known as the “black-box problem” [
                        - link "10" [ref=e195] [cursor=pointer]:
                          - /url: "#B10-computers-14-00160"
                        - text: ","
                        - link "11" [ref=e196] [cursor=pointer]:
                          - /url: "#B11-computers-14-00160"
                        - text: "], creates difficulties in interpreting and explaining the logic behind AI-generated conclusions. This limitation has significant implications for the legal admissibility of evidence and the overall integrity of forensic investigations ["
                        - link "12" [ref=e197] [cursor=pointer]:
                          - /url: "#B12-computers-14-00160"
                        - text: "]. Furthermore, although empirical cases of legal challenges based solely on the opacity of AI models remain limited, recent studies highlight concerns regarding the admissibility of AI-generated evidence in court contexts ["
                        - link "12" [ref=e198] [cursor=pointer]:
                          - /url: "#B12-computers-14-00160"
                        - text: "]. In this regard, the lack of transparency can undermine the trust of legal actors in AI systems, which has led to the development of legal frameworks demanding greater explainability ["
                        - link "13" [ref=e199] [cursor=pointer]:
                          - /url: "#B13-computers-14-00160"
                        - text: "]."
                      - generic [ref=e200]:
                        - text: Explainable artificial intelligence (XAI) has emerged as a promising approach to address these challenges. XAI is a subfield of artificial intelligence focused on making ML models more interpretable and explainable to humans. It encompasses processes and methods that enable human users to understand and trust the outputs generated by ML algorithms [
                        - link "14" [ref=e201] [cursor=pointer]:
                          - /url: "#B14-computers-14-00160"
                        - text: ","
                        - link "15" [ref=e202] [cursor=pointer]:
                          - /url: "#B15-computers-14-00160"
                        - text: ","
                        - link "16" [ref=e203] [cursor=pointer]:
                          - /url: "#B16-computers-14-00160"
                        - text: "]. XAI techniques achieve this by unveiling the decision-making process, identifying potential biases, debugging and improving models, and enhancing trust and transparency ["
                        - link "17" [ref=e204] [cursor=pointer]:
                          - /url: "#B17-computers-14-00160"
                        - text: "]. Interpretability, a closely related concept, is described as the degree to which a human can understand the cause of a decision ["
                        - link "18" [ref=e205] [cursor=pointer]:
                          - /url: "#B18-computers-14-00160"
                        - text: ","
                        - link "19" [ref=e206] [cursor=pointer]:
                          - /url: "#B19-computers-14-00160"
                        - text: "]. It has also been defined as the ability to explain or present results in understandable terms for a human ["
                        - link "20" [ref=e207] [cursor=pointer]:
                          - /url: "#B20-computers-14-00160"
                        - text: "] or as methods and models that make the behavior and predictions of ML systems comprehensible to humans ["
                        - link "21" [ref=e208] [cursor=pointer]:
                          - /url: "#B21-computers-14-00160"
                        - text: "]."
                      - generic [ref=e209]:
                        - text: XAI techniques can be categorized into local and global explainers. Local explainers focus on elucidating the reasoning behind the model’s predictions for individual data points, analyzing how the model arrives at specific predictions based on its decision history. In contrast, global explainers aim to understand the overall behavior of the model across the entire dataset, identifying patterns in the model’s outputs and determining which input variables have the most significant influence on predictions [
                        - link "22" [ref=e210] [cursor=pointer]:
                          - /url: "#B22-computers-14-00160"
                        - text: "]."
                      - generic [ref=e211]:
                        - text: This research aims to evaluate XAI approaches and techniques within the digital forensics context, addressing challenges related to transparency, explicability, and reliability of deep learning models. We focus on examining implementation and design methods to ensure compliance with ethical and legal requirements in forensic computing [
                        - link "23" [ref=e212] [cursor=pointer]:
                          - /url: "#B23-computers-14-00160"
                        - text: "]. This is achieved through the following key contributions:"
                      - generic [ref=e213]: "1. Critical review of XAI techniques in digital forensics: this study conducts a comprehensive analysis of current explainable artificial intelligence (XAI) techniques applied to digital forensic contexts, highlighting their advantages, limitations, and relevance to investigative processes."
                      - generic [ref=e214]: "2. Theoretical foundation of XAI methods: it explores the conceptual and mathematical underpinnings of prominent XAI approaches, including LIME and SHAP, emphasizing their suitability for interpreting complex machine learning models used in cybersecurity and forensic analysis."
                      - generic [ref=e215]: "3. Identification of current challenges: this work analyzes pressing issues in digital forensics related to the opacity of AI models, particularly in contexts where transparency and accountability are critical for the admissibility and reliability of digital evidence."
                      - generic [ref=e216]: "4. Implementation and evaluation of XAI in case studies: multiple XAI techniques are applied and assessed within practical forensic scenarios using the UNSW-NB15 dataset, comparing their interpretability, consistency, and contribution to the traceability of decisions made by ML models."
                      - generic [ref=e217]: "5. Definition of future research directions: this study outlines prospective avenues for advancing the integration of XAI in forensic analysis, including hybrid explanation models, regulatory compliance frameworks, and application to real-time threat detection systems."
                      - generic [ref=e218]:
                        - text: "The remainder of this paper is organized as follows:"
                        - link "Section 2" [ref=e219] [cursor=pointer]:
                          - /url: "#sec2-computers-14-00160"
                        - text: introduces the XAI methods LIME and SHAP, describing their theoretical foundations and implementation details. It also presents the UNSW-NB15 dataset and outlines the preprocessing steps applied and details the configuration and training processes for the XGBoost and TabNet models.
                        - link "Section 3" [ref=e220] [cursor=pointer]:
                          - /url: "#sec3-computers-14-00160"
                        - text: reports the experimental results, including accuracy metrics and explainability analyses based on local and global perspectives.
                        - link "Section 4" [ref=e221] [cursor=pointer]:
                          - /url: "#sec4-computers-14-00160"
                        - text: discusses the implications of the findings, emphasizing the comparative interpretability of the models and the utility of XAI methods in forensic contexts. Finally,
                        - link "Section 5" [ref=e222] [cursor=pointer]:
                          - /url: "#sec5-computers-14-00160"
                        - text: concludes this paper by summarizing the main contributions and outlining future research directions aimed at enhancing transparency, accountability, and operational applicability in explainable forensic intelligence.
                    - generic [ref=e223]:
                      - heading "2. Explainability and Interpretability Methods and Datasets" [level=2] [ref=e224]
                      - generic [ref=e225]: This section presents LIME (Local Interpretable Model-Agnostic Explanations) and SHAP (SHapley Additive Explanations), two widely used methods for interpreting the behavior of complex models, enabling the understanding of each variable’s contribution to the model’s decisions. Additionally, the UNSW-NB15 dataset is described, a database commonly used for evaluating intrusion detection systems, providing a suitable environment for validating the analyzed models.
                      - generic [ref=e226]:
                        - 'heading "2.1. LIME: Local Interpretable Model-Agnostic Explanations" [level=3] [ref=e227]'
                        - generic [ref=e228]:
                          - text: LIME is a widely used technique for interpreting the results of black-box models. Its approach is based on generating a new dataset composed of permuted samples and their corresponding predictions from the original model [
                          - link "23" [ref=e229] [cursor=pointer]:
                            - /url: "#B23-computers-14-00160"
                          - text: "]. From this dataset, LIME trains an interpretable model, weighting each instance based on its proximity to the instance of interest being explained. Recent studies highlight its effectiveness in providing meaningful explanations for complex machine learning models, particularly in domains such as healthcare and cybersecurity ["
                          - link "24" [ref=e230] [cursor=pointer]:
                            - /url: "#B24-computers-14-00160"
                          - text: ","
                          - link "25" [ref=e231] [cursor=pointer]:
                            - /url: "#B25-computers-14-00160"
                          - text: "]. The primary goal of LIME is to construct an interpretable model that is locally faithful to the classifier’s behavior around the instance of interest ["
                          - link "23" [ref=e232] [cursor=pointer]:
                            - /url: "#B23-computers-14-00160"
                          - text: "]. This enables the analysis of feature contributions to the final prediction. LIME perturbs the original input and evaluates changes in the output to identify the most relevant features. Recent advancements have improved the scalability of LIME for large datasets and increased its adoption in real-world applications ["
                          - link "26" [ref=e233] [cursor=pointer]:
