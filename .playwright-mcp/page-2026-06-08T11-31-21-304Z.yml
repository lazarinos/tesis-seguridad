            - table "Descripción" [ref=e134]:
              - caption [ref=e135]: Descripción
              - rowgroup [ref=e136]:
                - row [ref=e137]:
                  - rowheader "Sumario:" [ref=e138]
                  - cell [ref=e139]: Actualmente, con el constante desarrollo de la Ciencia de la Computación, la seguridad de redes es uno de los problemas más importantes a resolver; el crecimiento de redes y equipos utilizados en casi todas las áreas de trabajo hace que sean más sensibles a ser vulnerados. Dentro del ámbito de la seguridad, un tema importante es la organización y el fácil acceso a la información sobre posibles alertas por parte de los administradores, lo cual es vital para tomar rápidamente las medidas necesarias. Por otro lado, con el considerable aumento de dispositivos móviles y otras tecnologías, es necesario crear una conexión entre estos dispositivos y los sistemas de seguridad. La presente tesis, describe la implementación de un aplicativo móvil que permitirá a los administradores de seguridad, obtener información de las alertas de forma fiable y de fácil acceso en sus celulares, tabletas o cualquier dispositivo móvil de bajo costo. El trabajo consiste en desarrollar la aplicación móvil del administrador incluyendo las vistas básicas y plugins, la implementación del Sistema de Detección de Intrusiones (IDS por sus siglas en inglés Intrusión Detection System) utilizando Snort, la implementación del servicio web para transmisión de datos y, finalmente, el sistema de notificaciones.
