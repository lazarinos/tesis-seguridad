                        - listitem [ref=e508]:
                          - generic [ref=e509]: "Addressing key challenges: by effectively handling the diversity and complexity of real-world buildings, this work addresses key challenges that have limited the applicability of procedural modeling in the past."
                        - listitem [ref=e510]:
                          - generic [ref=e511]: "Future directions: the findings set the stage for future research, offering valuable insights and a robust framework for further innovations in the AI-driven geovisualization of buildings."
                      - generic [ref=e512]: Overall, this research significantly advances the field of procedural modeling and sets the stage for future innovations in AI-driven geovisualization.
