                      - list [ref=e226]:
                        - listitem [ref=e227]:
                          - generic [ref=e228]: "Building Descriptions as Input: The initial step in automated procedural building modeling is gathering building descriptions. These descriptions may contain information such as the number of floors, types of materials, room layouts, and architectural elements."
                        - listitem [ref=e229]:
                          - generic [ref=e230]: "Visual Recognition of Building Characteristics: Utilizing computer vision techniques and image processing allows systems to automatically recognize building characteristics from visual data. This may involve identifying shapes, colors, textures, and other key elements."
                        - listitem [ref=e231]:
                          - generic [ref=e232]: "AI and Data Analysis: After collecting descriptions or visual recognition, artificial intelligence algorithms can analyze this data and generate building model plans. These AI systems can employ techniques like deep learning for precise understanding and interpretation of data."
                        - listitem [ref=e233]:
                          - generic [ref=e234]: "Online Databases of Building Elements: Online databases containing a plethora of building elements, such as windows, doors, roofs, and more, serve as valuable resources. These databases can be integrated into the procedural modeling pipeline, allowing for the automatic selection and placement of elements based on the generated building plans."
                        - listitem [ref=e235]:
                          - generic [ref=e236]: "Machine Learning for Optimization: Machine learning algorithms can be employed to optimize the procedural modeling process. By learning from past models and user preferences, these algorithms can iteratively refine the generated building designs to better match desired criteria and aesthetics."
                        - listitem [ref=e237]:
                          - generic [ref=e238]: "Parametric Modeling: Leveraging parametric modeling techniques enables the creation of flexible building models that can be easily adjusted based on various parameters such as size, style, and functionality."
                        - listitem [ref=e239]:
                          - generic [ref=e240]: "Rule-Based Systems: Rule-based systems can enforce constraints and guidelines during the modeling process, ensuring that the generated building designs adhere to specific regulations or architectural standards."
                        - listitem [ref=e241]:
                          - generic [ref=e242]: "Real-time Feedback and Iteration: Integrating real-time feedback mechanisms allows for iterative improvements in the procedural modeling process. Users can interact with the system, providing feedback on generated designs, which can then be incorporated to refine subsequent iterations."
                        - listitem [ref=e243]:
                          - generic [ref=e244]: "Simulation and Visualization: Simulation and visualization techniques enable users to preview and assess the generated building models in virtual environments. This allows for better understanding and validation of the designs before physical implementation."
                        - listitem [ref=e245]:
                          - generic [ref=e246]: "Scalability and Adaptability: The automated procedural modeling approach should be scalable and adaptable to different project scales and requirements. Whether designing individual buildings or entire cityscapes, the system should be capable of handling diverse scenarios effectively."
                      - generic [ref=e247]:
                        - text: Automated procedural building modeling, driven by AI, online databases, and machine learning, offers a powerful solution for rapidly generating complex building structures. By leveraging these technologies in combination, designers and architects can streamline the modeling process, increase efficiency, and explore innovative design possibilities. The goal of this research is to connect all available technologies combining procedural modeling and reverse procedural modeling to automatically produce a 3D model of a building [
                        - link "44" [ref=e248] [cursor=pointer]:
                          - /url: "#B44-applsci-14-08345"
                        - text: ","
                        - link "45" [ref=e249] [cursor=pointer]:
                          - /url: "#B45-applsci-14-08345"
                        - text: ","
                        - link "46" [ref=e250] [cursor=pointer]:
                          - /url: "#B46-applsci-14-08345"
                        - text: ","
                        - link "47" [ref=e251] [cursor=pointer]:
                          - /url: "#B47-applsci-14-08345"
                        - text: ","
                        - link "48" [ref=e252] [cursor=pointer]:
                          - /url: "#B48-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e253]:
                        - text: Up until now, machine learning technology has been used wherein computers have learned from many examples of different styles and types of buildings through optical recognition of building parts from one or more building photographs, reconstructing the entire building model. Today, AI allows us how to converse, create videos, utilize machine learning technology, and obtain building descriptions. With the help of AI and these descriptions, we can construct a building using a script that outlines and defines the structure. This will be described in this paper, and to automate the process, all steps need to be integrated into a single entity and ultimately assess the success of forming a 3D model of a building, specifically to implement this new idea of creating a 3D building model. The question is how machine learning technology has been historically used to recognize building parts and reconstruct building models and advancements using AI, which can interact with humans and perform various tasks, including generating building descriptions and constructing buildings based on those descriptions using scripts. The text emphasizes the need to integrate all steps of the process into a cohesive workflow and evaluate the success of generating 3D building models. Finally, it mentions the intention to implement this new approach to building modeling [
                        - link "49" [ref=e254] [cursor=pointer]:
                          - /url: "#B49-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e255]:
                        - text: Hypothesis 1.
                        - generic [ref=e256]: The integration of artificial intelligence (AI) and machine learning techniques, such as convolutional neural networks (CNNs) and Generative Adversarial Networks (GANs), with procedural modeling significantly enhances the efficiency and accuracy of generating 3D building models compared to conventional methods.
                      - generic [ref=e257]:
                        - text: Hypothesis 2.
                        - generic [ref=e258]: The application of AI-driven procedural modeling in geovisualization not only reduces the time required for creating detailed 3D building models but also improves the realism and adaptability of these models in various urban planning and architectural contexts.
                    - generic [ref=e259]:
                      - heading "2. Materials and Methods" [level=2] [ref=e260]
                      - generic [ref=e261]: To effectively combine and utilize different available technologies, it is necessary to analyze and evaluate all existing methods aimed at expediting the process of obtaining and visualizing 3D building models.
                      - generic [ref=e262]:
                        - heading "2.1. What Can Be Achieved with Today’s Technology and Also by Combining Different Technologies?" [level=3] [ref=e263]
                        - generic [ref=e264]: There are not many ideas or research published in scientific journals focusing on procedural modeling, machine learning, and AI for 3D building modeling. The following are some examples of techniques and methods applied here.
                        - generic [ref=e265]: "Procedural Modeling: Various techniques of procedural modeling are used to generate complex 3D building models. This includes generating parametric rules or scripts that automatically create detailed architectural structures. Published research often explores different approaches to procedural generation, including L-systems, shape grammars, or parameterized models. Parametric Modeling: this defines building elements using parameters such as height, width, and style, which can be adjusted to generate variations. Shape Grammar: formal grammar that defines rules for generating building shapes and styles based on hierarchical compositions of architectural elements. Procedural Texturing: generating textures for building surfaces based on procedural algorithms, such as fractal patterns or procedural noise."
                        - generic [ref=e266]: "Machine Learning: In the field of machine learning, researchers apply various techniques to teach models to generate 3D building geometry from images or other input data. This can involve using convolutional neural networks (CNNs) for directly generating 3D models from images or using Generative Adversarial Networks (GANs) for generating textures or detailed features. Image-to-Geometry Translation: this trains models to convert 2D images of buildings into 3D geometric representations using techniques like convolutional neural networks (CNNs). Generative Models: these use generative models like Variational Autoencoders (VAEs) or Generative Adversarial Networks (GANs) to create plausible 3D building structures and textures from noise vectors or latent representations. Semantic Segmentation: this trains models to segment building elements (e.g., walls, windows, doors) in images, enabling more accurate reconstruction of 3D building geometry."
                        - generic [ref=e267]: "Artificial Intelligence: In the realm of artificial intelligence, researchers develop systems that leverage deep neural networks or other techniques to generate 3D building models. This includes using AI for tasks such as semantic segmentation of building elements, style transfer for architectural design, or even the autonomous generation of entire cityscapes. Style Transfer: this applies AI techniques to transfer architectural styles from existing buildings or to design concepts to generate new building designs with similar aesthetics. Evolutionary Algorithms: this uses genetic algorithms or other evolutionary techniques to evolve and optimize building designs based on specified criteria such as energy efficiency or visual appeal. Reinforcement Learning: this trains AI agents to autonomously generate and optimize building designs through trial and error, with feedback based on predefined objectives or constraints."
                        - generic [ref=e268]:
                          - text: These are just a few broad areas where research is ongoing. Within each area, there are numerous specific methodologies and approaches being explored to improve the efficiency and realism of 3D building modeling using procedural techniques, machine learning, and AI [
                          - link "44" [ref=e269] [cursor=pointer]:
                            - /url: "#B44-applsci-14-08345"
                          - text: ","
                          - link "45" [ref=e270] [cursor=pointer]:
                            - /url: "#B45-applsci-14-08345"
                          - text: ","
                          - link "46" [ref=e271] [cursor=pointer]:
                            - /url: "#B46-applsci-14-08345"
                          - text: ","
                          - link "47" [ref=e272] [cursor=pointer]:
                            - /url: "#B47-applsci-14-08345"
                          - text: ","
                          - link "48" [ref=e273] [cursor=pointer]:
                            - /url: "#B48-applsci-14-08345"
                          - text: "]."
                        - generic [ref=e274]: "Although there are many advantages to using procedural techniques, machine learning, and artificial intelligence to automate the process of obtaining 3D building models, there are also certain drawbacks and challenges that researchers need to consider:"
                        - list [ref=e276]:
                          - listitem [ref=e277]:
                            - generic [ref=e278]: "Lack of Precision: automated processes may result in less precise or realistic models, especially when it comes to detailed architectural elements or complex textures."
                          - listitem [ref=e279]:
                            - generic [ref=e280]: "Limited Generalization: models trained on one dataset may not generalize well to other cities or architectural styles, limiting the usability of these methods across different areas."
                          - listitem [ref=e281]:
                            - generic [ref=e282]: "Dependency on Input Data Quality: the quality of the resulting models often depends on the quality of input data, including image resolution or accuracy of geolocation information."
                          - listitem [ref=e283]:
                            - generic [ref=e284]: "Need for Large Datasets: training effective machine learning and artificial intelligence models requires large datasets, which can be challenging to gather and process, especially for specific locales or architectural styles."
                          - listitem [ref=e285]:
                            - generic [ref=e286]: "Requirement for Computational Resources: some advanced techniques, such as Generative Adversarial Networks (GANs) or deep neural networks, require large amounts of computational resources for training and model generation, which can be costly and require specialized hardware infrastructure."
                          - listitem [ref=e287]:
                            - generic [ref=e288]: "Challenges of Result Interpretation: in some cases, machine learning and artificial intelligence techniques may generate models that are difficult to interpret or explain, which can be problematic in certain applications, such as urban planning or architectural design."
                        - generic [ref=e289]:
                          - text: Despite these challenges, research in the field of automating the process of obtaining 3D building models continues to advance, and further work on improving algorithms, techniques, and the quality of input data may help overcome these drawbacks [
                          - link "49" [ref=e290] [cursor=pointer]:
                            - /url: "#B49-applsci-14-08345"
                          - text: "]."
                        - generic [ref=e291]:
                          - text: "The impact of input variation on procedural modeling, which is the optimal input modality for AI-based procedural modeling, comparing verbal descriptions with optical recognition of building images, delves into the efficacy and suitability of these two distinct approaches in informing the generation of procedural models for 3D buildings. This research explores two primary approaches for automated procedural building modeling: verbal descriptions and optical recognition of building images. Verbal descriptions as input for 3D modeling involve utilizing textual narratives or structured data outlining the characteristics of buildings. Natural language processing (NLP) techniques are employed to parse and extract relevant information. For instance, descriptions of architectural styles, materials, and dimensions are translated into detailed 3D models. Optical recognition of building images DeepMind’s Alpha3D Experimental was used. Computer vision algorithms analyze visual data from images or videos. Techniques such as convolutional neural networks (CNNs) are used (Midas is used because it can be highly effective when combined with other 3D reconstruction methods working with a single image like in our case) to identify and extract architectural features. This method leverages deep learning to generate accurate 3D models based on visual inputs. A comparative analysis is conducted to evaluate the efficiency of these approaches. Metrics such as model accuracy, computational efficiency, and user satisfaction are assessed. The findings will provide insights into the optimal methodology for different scenarios ("
                          - link "Figure 1" [ref=e292] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f001"
                          - text: ).
                        - generic [ref=e293]:
                          - generic [ref=e295] [cursor=pointer]:
                            - img "Applsci 14 08345 g001" [ref=e296]
                            - link [ref=e297]:
                              - /url: "#fig_body_display_applsci-14-08345-f001"
                          - generic [ref=e298]: Figure 1. The research framework methodology and comparative analysis of two research patterns—by collecting verbal descriptions and collecting building images.
                        - generic [ref=e299]:
                          - link "Figure 1" [ref=e300] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f001"
                          - text: "flowchart explanation:"
                        - list [ref=e302]:
                          - listitem [ref=e303]:
                            - generic [ref=e304]: Collect Verbal Descriptions (gather textual descriptions of buildings, including architectural styles, dimensions, and materials).
                          - listitem [ref=e305]:
                            - generic [ref=e306]: Utilize NLP for Data Parsing (use Natural Language Processing (NLP) techniques to parse and extract relevant information from the collected verbal descriptions).
                          - listitem [ref=e307]:
                            - generic [ref=e308]: Generate Initial 3D Models (create initial 3D building models based on the parsed data).
                          - listitem [ref=e309]:
                            - generic [ref=e310]: Collect Building Images (gather images or videos of buildings from various sources).
                          - listitem [ref=e311]:
                            - generic [ref=e312]: Apply Computer Vision Algorithms (use computer vision techniques to analyze the collected images and extract architectural features).
                          - listitem [ref=e313]:
                            - generic [ref=e314]: Extract Architectural Features (identify and extract detailed architectural elements from the images).
                          - listitem [ref=e315]:
                            - generic [ref=e316]: Generate Detailed 3D Models (create detailed 3D models based on the extracted features).
                          - listitem [ref=e317]:
                            - generic [ref=e318]: Comparative Analysis of Methods (compare the models generated from verbal descriptions and images to evaluate their accuracy and efficiency).
                          - listitem [ref=e319]:
                            - generic [ref=e320]: Evaluate Model Accuracy and Efficiency (assess the models based on various metrics such as accuracy, fidelity, and computational efficiency).
                          - listitem [ref=e321]:
                            - generic [ref=e322]: Refine Models Based on Findings (make necessary adjustments to improve the models based on the evaluation results).
                        - generic [ref=e323]: "This study’s experimental design focuses on developing an AI-driven procedural modeling approach aimed at improving the geovisualization of 3D building models. Two primary approaches were explored: generating 3D models from verbal descriptions and creating models based on optical recognition of building images. These approaches were subjected to a comparative analysis to evaluate their respective strengths and weaknesses in terms of model accuracy, computational efficiency, and user satisfaction. Regarding dataset selection for this study, we selected two types of datasets that cater to the different approaches. The first dataset comprises textual descriptions of various buildings, detailing architectural styles, materials, dimensions, and other key elements. This dataset was crucial for training the NLP models. The second dataset includes images and videos of buildings, sourced from architectural databases and on-site photography. These visual datasets were utilized to train computer vision models to accurately identify and extract architectural features for 3D model generation. The training process of the AI model was conducted in two parallel streams to address both the verbal and visual approaches. The NLP models were trained using the textual descriptions dataset, employing techniques such as tokenization and parsing to convert textual inputs into structured data. These models learned to interpret architectural terminology and generate corresponding 3D models. Concurrently, deep learning models, particularly convolutional neural networks (CNNs), were trained on the visual dataset. These models were designed to recognize architectural features from images, such as windows, doors, and structural elements, which were then used to generate detailed 3D models. Both models underwent iterative training, guided by performance metrics to ensure optimal accuracy and efficiency. To validate the effectiveness of the AI models, we employed several evaluation indicators. Model accuracy was assessed by comparing the AI-generated 3D models against manually created or real-world counterparts, focusing on metrics such as precision, recall, and F1-score. Computational efficiency was measured by the time required to generate 3D models from both verbal descriptions and images, alongside the computational resources utilized, including CPU and GPU usage. Additionally, user satisfaction was gauged through surveys and expert reviews, which evaluated the usability, interpretability, and overall quality of the generated models. Lastly, scalability was considered by examining the models’ ability to handle varying levels of detail, from individual buildings to complex cityscapes. This comprehensive experimental design and methodology underscore the rigor of our research process, ensuring that the findings are both reliable and reproducible across similar studies."
                        - generic [ref=e324]: To validate each research hypothesis in this paper effectively, it is essential to employ specific technical methods and a carefully designed experimental framework. This approach will enhance the logical coherence of the paper by ensuring that each hypothesis is rigorously tested and supported by empirical evidence. For the first hypothesis, which posits that buildings in the real world are mostly different but can still be effectively modeled through procedural modeling, the validation process should begin by developing a procedural modeling framework capable of capturing the diversity inherent in real-world architecture. This can be accomplished by creating a flexible grammatical language designed to describe various building styles, architectural features, and structural elements. The experimental design should involve selecting a diverse dataset of building types that represent a wide range of architectural styles. By using this dataset, the framework can generate 3D models that are then compared against the original buildings. The validation of this hypothesis will be based on several metrics, including structural accuracy, aesthetic similarity, and computational efficiency. A control group of buildings, modeled using traditional methods, should be included to provide a baseline for comparison. This will allow for a robust assessment of how well the procedural models replicate the variety found in real-world structures. The second hypothesis, which suggests that this modeling can be achieved through different approaches such as AI and machine learning, requires the implementation of AI-based techniques to test its validity. Specifically, AI methods like deep learning for computer vision and Natural Language Processing (NLP) for parsing architectural descriptions can be employed to create 3D models. The experimental design for this hypothesis should involve gathering input data in the form of images and textual descriptions of buildings. AI models should then be trained using a subset of this data to learn to recognize and replicate architectural features. The effectiveness of these AI-generated models should be evaluated by comparing them with manually created models, focusing on their accuracy, level of detail, and the time efficiency of the modeling process. A comparative analysis should be conducted to assess which approach—AI-based or procedural—better accommodates the diversity of buildings. This analysis will provide critical insights into the strengths and weaknesses of each method. To further strengthen the validation process, a hybrid approach can be tested, wherein procedural modeling is enhanced with AI-generated inputs. This combined method could involve using AI to generate initial modeling scripts that are subsequently refined through procedural techniques. The experimental design for this approach would involve creating a workflow that integrates AI and procedural modeling and then analyzing the effectiveness of this hybrid method in handling complex architectural structures. The resulting models can be compared to those produced by AI or procedural methods alone to determine the added value of combining these techniques. Throughout the validation process, it is important to employ statistical methods to assess the significance of the results. Hypothesis testing, such as t-tests or ANOVA, can be used to evaluate whether the differences between models generated by various methods are statistically significant. This statistical validation will ensure that the conclusions drawn from the experiments are robust and reliable.
                      - generic [ref=e325]:
                        - heading "2.2. Verbal Descriptions as Input for 3D Modeling" [level=3] [ref=e326]
                        - generic [ref=e327]: Utilizing verbal descriptions entails the provision of textual narratives or structured data outlining the characteristics, dimensions, and architectural features of the building. This approach offers the advantage of leveraging Natural Language Processing (NLP) techniques to parse and extract relevant information from textual inputs. Verbal descriptions provide a structured and standardized format for conveying building specifications, enabling straightforward data processing and interpretation by AI algorithms. However, the efficacy of this approach may be contingent upon the accuracy and comprehensiveness of the provided descriptions, as well as the proficiency of NLP algorithms in extracting pertinent details.
                        - generic [ref=e328]: For example, the same Frauenkirche in Munich with a verbal description as input is not needed since it is a well-known church described many times on the Internet and available to ChatGPT.
                        - generic [ref=e329]:
                          - text: If the request “write me a python script for procedural modeling of a 3D model for Frauenkirche in Munich is input into ChatGPT, the following script is generated. The full answer is available in Ref. [
                          - link "50" [ref=e330] [cursor=pointer]:
                            - /url: "#B50-applsci-14-08345"
                          - text: "] in the"
                          - link "Supplementary Materials" [ref=e331] [cursor=pointer]:
                            - /url: "#app1-applsci-14-08345"
                          - text: .
                      - generic [ref=e332]:
                        - heading "2.3. Optical Recognition of Building Images" [level=3] [ref=e333]
                        - generic [ref=e334]:
                          - text: Alternatively, the optical recognition of building images involves the utilization of computer vision algorithms to analyze visual data captured from images or videos of buildings. This approach relies on image processing techniques to identify and extract architectural features, spatial relationships, and structural elements from visual inputs. By leveraging convolutional neural networks (CNNs) or other deep learning models, optical recognition can discern intricate details and nuances in building facades, enabling the generation of highly accurate procedural models. However, the effectiveness of this approach may be influenced by factors such as image quality, lighting conditions, and occlusions, which can impact the accuracy of feature extraction and subsequent model generation. The automatic recognition of buildings and the generation of their 3D models has been created and demonstrated. Using neural networks and AI has resulted in successful and well-rendered examples; however, certain building photos require further refinement to achieve a visually satisfactory result. Automation has been shown and proven to be very useful for geovisualization cartographic purposes for shaping individual buildings as well as entire cities. First, image segmentation is performed (
                          - link "Figure 2" [ref=e335] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f002"
                          - text: ), where individual elements of the image are separated so that AI can recognize them from a database of 3D building parts. Some other databases are also used for accessing building geometry parts, such as OpenStreetMap (OSM), CityGML, SketchUp 3D Warehouse, Trimble Building Point Cloud Library (PCL), Google Poly, Building Information Model (BIM) Repositories (BIMobject and NBS National BIM Library), and IFC (Industry Foundation Classes) Models (BIMserver and IfcOpenShell). Following this, in the process of forming or merging parts into the whole, a 3D model of a single building is obtained (
                          - link "Figure 3" [ref=e336] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f003"
                          - text: ). The time required for the automatic formation of a 3D model of a building for preview in
                          - link "Figure 3" [ref=e337] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f003"
                          - text: is 10 s, and in
                          - link "Figure 4" [ref=e338] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f004"
                          - text: it is 19 s. For full resolution of the building model, about 45 min is needed.
