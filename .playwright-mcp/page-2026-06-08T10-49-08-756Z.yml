                        - generic [ref=e357]:
                          - text: Depending on the level of technology available today, it can be observed that with a building image like in
                          - link "Figure 2" [ref=e358] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f002"
                          - text: and
                          - link "Figure 3" [ref=e359] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f003"
                          - text: ", the models are visually satisfactory for the building in"
                          - link "Figure 2" [ref=e360] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f002"
                          - text: ", but not for the building in"
                          - link "Figure 3" [ref=e361] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f003"
                          - text: . This is because computers and all available technology can only assume what is on the other side of the building. Therefore, it is necessary to have multiple images from all sides of the building (which is sometimes not possible) or at least one from the building’s facade. However, the model is faithful to the building’s visualization only if the building is symmetrical relative to the two surfaces captured from the facade. The drawback of this method is that when a building is photographed typically from only one side or the front, it is assumed that the rear side mirrors the front side. When this is not the case, unusual results can occur, which can distort the visual identity of the building, as seen in
                          - link "Figure 4" [ref=e362] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f004"
                          - text: ", where the church towers are too far apart, and the entire church is deformed and stretched on the side opposite the photographer’s viewpoint. Therefore, it is beneficial to introduce another step: primarily removing excess elements from the image before the modeling process."
                        - generic [ref=e363]:
                          - text: If a building is surrounded by other buildings, the so-called unwanted excess can also be automatically removed from the image, adding another step to the entire process of obtaining a 3D model. However, given the time-consuming nature of the process, this step is negligible and can be performed online; for example, in Ref. [
                          - link "51" [ref=e364] [cursor=pointer]:
                            - /url: "#B51-applsci-14-08345"
                          - text: "], with the result shown in"
                          - link "Figure 4" [ref=e365] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f004"
                          - text: . The limitation of such a model is visible in
                          - link "Figure 4" [ref=e366] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f004"
                          - text: and
                          - link "Figure 5" [ref=e367] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-08345-f005"
                          - text: because the optical recognition of parts from the original image is not possible in the lower part of the cathedral, where surrounding houses and buildings obscure the base of the cathedral, making it invisible in the original image. The original image of the object should always be of the entire object from all sides, which in this case can be achieved using a drone or terrestrial photogrammetry.
