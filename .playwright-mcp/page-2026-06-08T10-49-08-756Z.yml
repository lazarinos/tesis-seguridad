                  - paragraph
                - generic [ref=e155]:
                  - generic [ref=e156]:
                    - generic [ref=e157]:
                      - heading "1. Introduction" [level=2] [ref=e158]
                      - generic [ref=e159]:
                        - text: Procedural modeling stands out when compared to conventional methods of geovisualizing 3D building models due to its ability to encapsulate model descriptions, such as those of buildings or residences, using scripting languages or machine code. This feature renders procedural modeling exceptionally conducive to computational processing, facilitating the expeditious rendering of comprehensive building models and urban landscapes composed of homogeneous building structures. In essence, procedural modeling thrives particularly in scenarios where building diversity is relatively limited, thus accentuating its manifold advantages [
                        - link "1" [ref=e160] [cursor=pointer]:
                          - /url: "#B1-applsci-14-08345"
                        - text: ","
                        - link "2" [ref=e161] [cursor=pointer]:
                          - /url: "#B2-applsci-14-08345"
                        - text: ","
                        - link "3" [ref=e162] [cursor=pointer]:
                          - /url: "#B3-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e163]:
                        - text: Procedural modeling is a technique that generates 3D models and environments algorithmically, as opposed to manually creating each element. This approach utilizes a set of rules or procedures to automatically create complex structures, allowing for the efficient generation of large-scale models with varying levels of detail. Procedural modeling is particularly effective in urban modeling, where it can be used to create extensive cityscapes with minimal manual input [
                        - link "4" [ref=e164] [cursor=pointer]:
                          - /url: "#B4-applsci-14-08345"
                        - text: "]. This method is highly flexible and scalable, making it ideal for applications in virtual reality, video games, and urban planning. The conventional approach to geovisualizing 3D building models typically involves manual or semi-automated processes that rely on CAD (Computer-Aided Design) tools and GIS (Geographic Information Systems) software. This approach often requires significant manual intervention to create accurate and detailed 3D models from 2D plans, maps, or on-site measurements ["
                        - link "5" [ref=e165] [cursor=pointer]:
                          - /url: "#B5-applsci-14-08345"
                        - text: "]. These models are then used in various applications, such as urban planning, architectural design, and geospatial analysis. While this approach can produce highly detailed models, it is time-consuming and less adaptable to changes in scale or design."
                      - generic [ref=e166]: The integration of AI-driven procedural modeling into architectural and urban design holds significant implications for the future of these fields. By automating the generation of detailed 3D building models, this research offers a transformative tool that can greatly enhance the efficiency and precision of design processes. Architects and urban planners can leverage these advanced techniques to quickly prototype and visualize complex structures, enabling more informed decision-making and facilitating a more iterative design process. Moreover, the ability to rapidly produce accurate and adaptable models supports the development of smart cities, where real-time data can be integrated into urban planning to create more responsive and sustainable environments. This research thus not only advances the technical capabilities of 3D modeling but also contributes to the broader goal of creating more efficient, livable, and resilient urban spaces.
                      - generic [ref=e167]:
                        - text: Procedural modeling stands out prominently in the field of geovisualizing 3D building models due to its efficiency in rendering comprehensive building models and urban landscapes. However, despite its advantages, there is a significant gap in the ability to accurately portray the diversity and complexity of real-world buildings [
                        - link "6" [ref=e168] [cursor=pointer]:
                          - /url: "#B6-applsci-14-08345"
                        - text: "]. This research aims to bridge this gap by integrating procedural modeling with advanced AI techniques, offering a robust solution for automated and accurate 3D building modeling."
                      - generic [ref=e169]: The motivation for this work stems from the need to enhance the geovisualization of buildings and automate the production process.
                      - generic [ref=e170]:
                        - text: Traditional methods often fall short in terms of efficiency and accuracy when dealing with diverse building structures [
                        - link "7" [ref=e171] [cursor=pointer]:
                          - /url: "#B7-applsci-14-08345"
                        - text: ","
                        - link "8" [ref=e172] [cursor=pointer]:
                          - /url: "#B8-applsci-14-08345"
                        - text: ","
                        - link "9" [ref=e173] [cursor=pointer]:
                          - /url: "#B9-applsci-14-08345"
                        - text: "]. By leveraging AI and machine learning, this research proposes a novel methodology to improve procedural modeling and address the existing limitations."
                      - generic [ref=e174]:
                        - text: In this research, the ambitious task of elucidating the intricate amalgamation of procedural modeling with novel techniques and tools will be undertaken, aimed at enhancing the geovisualization of building models and streamlining the manufacturing process. Central to our inquiry are two overarching hypotheses, the first positing that despite the inherent heterogeneity of real-world buildings, procedural modeling methodologies should aptly accommodate their portrayal. The second hypothesis ventures into the exploration of various modalities through which this accommodation can be achieved [
                        - link "10" [ref=e175] [cursor=pointer]:
                          - /url: "#B10-applsci-14-08345"
                        - text: ","
                        - link "11" [ref=e176] [cursor=pointer]:
                          - /url: "#B11-applsci-14-08345"
                        - text: "]: how to design a grammatical language that can be used to describe buildings with sets of procedural rules, which can then be transformed into 3D models."
                      - generic [ref=e177]:
                        - text: Such modality involves leveraging computer vision algorithms to discern fundamental building attributes from photographic inputs, thus laying the groundwork for machine learning-driven model generation. Although preliminary attempts at this approach have been made, their efficacy remains limited, necessitating further refinement and exploration [
                        - link "12" [ref=e178] [cursor=pointer]:
                          - /url: "#B12-applsci-14-08345"
                        - text: ","
                        - link "13" [ref=e179] [cursor=pointer]:
                          - /url: "#B13-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e180]:
                        - text: It explores the transformative impact of artificial intelligence on architectural heritage research, highlighting AI’s capabilities in enhancing the documentation, preservation, and analysis of historical buildings. The chapter discusses innovative AI tools that significantly improve the accuracy and efficiency of heritage conservation efforts [
                        - link "14" [ref=e181] [cursor=pointer]:
                          - /url: "#B14-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e182]:
                        - text: Some authors explore the intersection of AI and design. It discusses how AI techniques are applied in architectural design, geographic visualization, and program modeling. The text emphasizes AI’s role in enhancing creativity and efficiency within these fields [
                        - link "15" [ref=e183] [cursor=pointer]:
                          - /url: "#B15-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e184]:
                        - text: Authors have been exploring innovative approaches to urban planning. This focuses on developing sustainable urban spatial structures using advanced modeling techniques, emphasizing environmental impact reduction and improving urban living conditions. This study highlights the importance of integrating ecological considerations in city planning for future resilience [
                        - link "16" [ref=e185] [cursor=pointer]:
                          - /url: "#B16-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e186]:
                        - text: Conversely, our second approach, which serves as the focal point of this paper, entails harnessing the capabilities of artificial intelligence (AI) [
                        - link "17" [ref=e187] [cursor=pointer]:
                          - /url: "#B17-applsci-14-08345"
                        - text: ","
                        - link "18" [ref=e188] [cursor=pointer]:
                          - /url: "#B18-applsci-14-08345"
                        - text: "]. Herein, detailed descriptions of buildings, encompassing all requisite specifications, serve as inputs to AI algorithms, which subsequently generate scripts tailored to each individual building. This methodology, referred to as reverse procedural modeling, represents a novel synthesis of AI-driven automation with procedural modeling paradigms."
                      - generic [ref=e189]:
                        - text: To validate the viability and effectiveness of the proposed methodology, a comparative analysis is conducted, comparing AI-generated building models with manually created models using traditional procedural modeling techniques. By identifying discrepancies and assessing the accuracy of AI-generated models in relation to their manually crafted counterparts, the aim is to provide empirical evidence supporting the efficacy and utility of the proposed approach [
                        - link "19" [ref=e190] [cursor=pointer]:
                          - /url: "#B19-applsci-14-08345"
                        - text: ","
                        - link "20" [ref=e191] [cursor=pointer]:
                          - /url: "#B20-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e192]:
                        - text: Procedural building modeling, in conjunction with advancements in artificial intelligence (AI) and access to online databases, opens the door to revolutionary methods of creating complex structures like buildings. This fusion of technologies enables the automation of modeling processes, reducing the need for manual interventions, and accelerating the entire procedure. The ways in which automatic procedural building modeling can be executed using building descriptions or visual recognition of building characteristics, AI, online databases, and machine learning will be explored in detail [
                        - link "21" [ref=e193] [cursor=pointer]:
                          - /url: "#B21-applsci-14-08345"
                        - text: ","
                        - link "22" [ref=e194] [cursor=pointer]:
                          - /url: "#B22-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e195]:
                        - text: Automated procedural building modeling integrates various cutting-edge technologies and methodologies to streamline the architectural design process. It begins with the extraction of building descriptions or the recognition of building characteristics from textual or visual inputs. Natural language processing (NLP) techniques are employed to parse textual descriptions, while computer vision algorithms analyze images or videos to identify architectural features [
                        - link "23" [ref=e196] [cursor=pointer]:
                          - /url: "#B23-applsci-14-08345"
                        - text: ","
                        - link "24" [ref=e197] [cursor=pointer]:
                          - /url: "#B24-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e198]:
                        - text: Once the initial input is obtained, artificial intelligence (AI) algorithms come into play to analyze and interpret the data. Deep learning models, such as convolutional neural networks (CNNs) and recurrent neural networks (RNNs), are trained on large datasets to understand spatial relationships and architectural styles. These AI algorithms generate building layouts or floor plans based on learned patterns and semantic meanings derived from the input data [
                        - link "25" [ref=e199] [cursor=pointer]:
                          - /url: "#B25-applsci-14-08345"
                        - text: ","
                        - link "26" [ref=e200] [cursor=pointer]:
                          - /url: "#B26-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e201]:
                        - text: Moreover, online databases serve as valuable resources for pre-existing building elements, including 3D models, textures, and materials. APIs or web scraping techniques are utilized to access these databases, enabling the automatic retrieval and integration of relevant building components into the modeling pipeline [
                        - link "27" [ref=e202] [cursor=pointer]:
                          - /url: "#B27-applsci-14-08345"
                        - text: ","
                        - link "28" [ref=e203] [cursor=pointer]:
                          - /url: "#B28-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e204]:
                        - text: Machine learning techniques further optimize the procedural modeling process by iteratively refining generated designs based on user feedback and performance metrics. Reinforcement learning algorithms adaptively adjust model parameters to maximize design objectives, such as energy efficiency or structural integrity [
                        - link "29" [ref=e205] [cursor=pointer]:
                          - /url: "#B29-applsci-14-08345"
                        - text: ","
                        - link "30" [ref=e206] [cursor=pointer]:
                          - /url: "#B30-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e207]:
                        - text: Parametric modeling allows for the creation of flexible building models that can be dynamically adjusted based on various parameters such as size, style, and functionality. By defining parameters and constraints, designers can iteratively explore design alternatives and refine their concepts [
                        - link "31" [ref=e208] [cursor=pointer]:
                          - /url: "#B31-applsci-14-08345"
                        - text: ","
                        - link "32" [ref=e209] [cursor=pointer]:
                          - /url: "#B32-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e210]:
                        - text: Rule-based systems enforce design rules and constraints to ensure compliance with architectural guidelines and regulatory requirements. These systems detect errors and violations early in the design process, reducing costly revisions and ensuring adherence to legal mandates [
                        - link "33" [ref=e211] [cursor=pointer]:
                          - /url: "#B33-applsci-14-08345"
                        - text: ","
                        - link "34" [ref=e212] [cursor=pointer]:
                          - /url: "#B34-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e213]:
                        - text: Real-time feedback mechanisms enable designers to interactively manipulate building models and receive immediate visual feedback on design changes. Graphical user interfaces (GUIs) or virtual reality (VR) environments provide intuitive interfaces for exploring and refining designs in real time [
                        - link "35" [ref=e214] [cursor=pointer]:
                          - /url: "#B35-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e215]:
                        - text: Simulation and visualization tools facilitate the evaluation and validation of building models through realistic rendering, lighting analysis, and virtual walkthroughs. By visualizing design outcomes in immersive 3D environments, stakeholders can gain insights into the spatial qualities and functional aspects of proposed buildings [
                        - link "36" [ref=e216] [cursor=pointer]:
                          - /url: "#B36-applsci-14-08345"
                        - text: ","
                        - link "37" [ref=e217] [cursor=pointer]:
                          - /url: "#B37-applsci-14-08345"
                        - text: ","
                        - link "38" [ref=e218] [cursor=pointer]:
                          - /url: "#B38-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e219]:
                        - text: Lastly, scalability and adaptability are crucial aspects of automated procedural building modeling systems, allowing them to accommodate diverse project requirements and scales. Cloud-based infrastructure and modular software architectures enable the efficient handling of large-scale modeling tasks and foster interoperability and extensibility [
                        - link "39" [ref=e220] [cursor=pointer]:
                          - /url: "#B39-applsci-14-08345"
                        - text: ","
                        - link "40" [ref=e221] [cursor=pointer]:
                          - /url: "#B40-applsci-14-08345"
                        - text: "]."
                      - generic [ref=e222]:
                        - text: Automated procedural building modeling represents a transformative approach to architectural design, leveraging advanced technologies to streamline the process, optimize resource utilization, and create sustainable built environments that enrich the lives of inhabitants and communities [
                        - link "41" [ref=e223] [cursor=pointer]:
                          - /url: "#B41-applsci-14-08345"
