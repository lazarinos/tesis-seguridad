                      - generic [ref=e395]:
                        - heading "2.4. Limitations of the Research" [level=3] [ref=e396]
                        - generic [ref=e397]: While this study provides significant insights into the integration of AI and procedural modeling for 3D building visualization, several limitations must be acknowledged. First, the generalizability of the findings is constrained by the specific datasets and architectural styles used in the training and testing phases. The models developed in this research may not perform as effectively when applied to buildings from different cultural contexts or regions with distinct architectural norms. Second, the dependency on high-quality input data, particularly in the case of machine learning techniques, presents a challenge. Variations in image resolution, lighting conditions, and angles can lead to discrepancies in the accuracy of the generated 3D models. Additionally, the computational intensity of the AI-driven methodologies limits their accessibility, particularly in environments with limited processing power or resources. Finally, the focus on integrating AI into procedural modeling overlooks the potential human factors, such as the learning curve associated with the adoption of these technologies by practitioners in architecture and urban planning. Future research should consider these factors and explore the implications of AI-driven tools on the workflows of these professionals.
                    - generic [ref=e398]:
                      - heading "3. Comparative Analysis, Results, and Discussion" [level=2] [ref=e399]
                      - generic [ref=e400]: To ascertain the optimal input modality, a comparative analysis is conducted, evaluating the performance and outcomes of AI-based procedural modeling using both verbal descriptions and optical recognition of building images. Metrics such as model accuracy, fidelity to real-world structures, computational efficiency, and user satisfaction are assessed to gauge the efficacy and suitability of each approach. Additionally, qualitative factors such as ease of data acquisition, interpretability of results, and scalability are considered in the comparative analysis.
                      - generic [ref=e401]:
                        - heading "3.1. Implications" [level=3] [ref=e402]
                        - generic [ref=e403]: The analysis yields insights into the strengths and limitations of each input modality, informing recommendations for practitioners and researchers in the field of procedural modeling. Depending on the specific requirements, constraints, and objectives of the modeling task, one modality may be favored over the other. For instance, in scenarios where detailed visual specifications are readily available in textual form, verbal descriptions may suffice as input. Conversely, in cases where visual data are abundant and provide rich contextual information about building structures, the optical recognition of building images may offer superior accuracy and fidelity in procedural model generation. Moreover, hybrid approaches that combine elements of both modalities may be explored to capitalize on their respective strengths and mitigate their weaknesses.
                        - generic [ref=e404]: "Overall, the analysis underscores the importance of considering input modality selection as a critical factor in AI-based procedural modeling, with implications for the design, implementation, and evaluation of modeling systems in diverse application domains:"
                        - list [ref=e406]:
                          - listitem [ref=e407]:
                            - generic [ref=e408]: "Building Descriptions as Input: Building descriptions serve as the foundational input for the modeling process. These descriptions can be provided in various formats, including textual descriptions, architectural blueprints, or schematic diagrams. Natural Language Processing (NLP) techniques can be employed to parse and extract relevant information from textual descriptions, facilitating the generation of building models."
                          - listitem [ref=e409]:
                            - generic [ref=e410]:
                              - text: "Visual Recognition of Building Characteristics: Computer vision algorithms play a crucial role in automatically extracting building characteristics from visual data. Convolutional neural networks (CNNs) can be trained on annotated datasets to recognize specific architectural features such as facades, windows, doors, and structural components. Through image segmentation and feature detection, these algorithms can accurately identify and classify building elements in images or video streams ["
                              - link "52" [ref=e411] [cursor=pointer]:
                                - /url: "#B52-applsci-14-08345"
                              - text: "]."
                          - listitem [ref=e412]:
                            - generic [ref=e413]: "AI and Data Analysis: AI algorithms, particularly deep learning models, can analyze building descriptions or visual data to understand spatial relationships, architectural styles, and design preferences. Recurrent neural networks (RNNs) and transformer models can process textual descriptions and generate building layouts or floor plans based on learned patterns and semantic meanings. Furthermore, Generative Adversarial Networks (GANs) can be employed to synthesize realistic building designs by learning from large datasets of existing structures."
                          - listitem [ref=e414]:
                            - generic [ref=e415]: "Online Databases of Building Elements: Online databases provide a vast repository of pre-existing building elements that can be utilized in procedural modeling. These databases may include 3D models, textures, materials, and metadata associated with building components. APIs or web scraping techniques can be used to access and query these databases, enabling the automatic retrieval and integration of relevant building elements into the modeling pipeline."
                          - listitem [ref=e416]:
                            - generic [ref=e417]: "Machine Learning for Optimization: Machine learning techniques can optimize the procedural modeling process by iteratively refining generated designs based on user feedback and performance metrics. Reinforcement learning algorithms can adaptively adjust model parameters to maximize design objectives, such as energy efficiency, structural integrity, or aesthetic appeal. Additionally, genetic algorithms and evolutionary strategies can explore the design space and discover novel solutions by simulating natural selection and genetic variation."
                          - listitem [ref=e418]:
                            - generic [ref=e419]: "Parametric Modeling: Parametric modeling enables the creation of flexible building models that can be parametrically controlled and manipulated. By defining parameters such as dimensions, proportions, and constraints, designers can dynamically adjust the properties of building elements and iteratively explore design alternatives. Parametric modeling software such as Grasshopper for Rhino or Autodesk Dynamo provides intuitive visual interfaces for creating parametric designs and automating repetitive tasks."
                          - listitem [ref=e420]:
                            - generic [ref=e421]: "Rule-Based Systems: Rule-based systems enforce design rules and constraints to ensure compliance with architectural guidelines and regulatory requirements. These rules may encompass zoning regulations, building codes, accessibility standards, and environmental considerations. By integrating rule-based validation checks into the modeling workflow, errors and violations can be detected early in the design process, reducing costly revisions and ensuring compliance with legal mandates."
                          - listitem [ref=e422]:
                            - generic [ref=e423]: "Real-time Feedback and Iteration: Real-time feedback mechanisms enable designers to interactively manipulate building models and receive immediate visual feedback on design changes. Graphical user interfaces (GUIs) or virtual reality (VR) environments provide intuitive interfaces for exploring and refining designs in real time. User inputs such as gestures, voice commands, or haptic feedback can be captured and interpreted to dynamically adjust model parameters and geometry."
                          - listitem [ref=e424]:
                            - generic [ref=e425]: "Simulation and Visualization: Simulation and visualization tools facilitate the evaluation and validation of building models through realistic rendering, lighting analysis, and virtual walkthroughs. Building information modeling (BIM) software platforms such as Autodesk Revit or Trimble SketchUp integrate simulation engines for simulating structural performance, daylighting conditions, thermal comfort, and other architectural metrics. By visualizing design outcomes in immersive 3D environments, stakeholders can gain insights into the spatial qualities and functional aspects of proposed buildings."
                          - listitem [ref=e426]:
                            - generic [ref=e427]: "Scalability and Adaptability: The scalability and adaptability of automated procedural building modeling systems are essential for accommodating diverse project requirements and scales. Cloud-based infrastructure and distributed computing technologies enable parallel processing and resource scalability to handle large-scale modeling tasks efficiently. Furthermore, modular software architectures and open-source frameworks foster interoperability and extensibility, allowing developers to integrate custom modules and adapt the system to specific domain contexts."
                        - generic [ref=e428]: Automated procedural building modeling harnesses the synergistic capabilities of AI, machine learning, online databases, and advanced computational techniques to streamline the design process, empower designers with creative tools, and accelerate the realization of architectural visions. By leveraging data-driven insights and computational intelligence, architects and urban planners can address complex design challenges, optimize resource utilization, and create sustainable built environments that enrich the lives of inhabitants and communities.
                      - generic [ref=e429]:
                        - heading "3.2. What Is Needed for Detailed Descriptions of Buildings?" [level=3] [ref=e430]
                        - generic [ref=e431]: "To create the perfect building model, a comprehensive description is needed that includes the following details:"
                        - list [ref=e433]:
                          - listitem [ref=e434]:
                            - generic [ref=e435]: "Building Style: information about the architectural style of the building, such as modern, contemporary, traditional, or a specific architectural movement (e.g., Art Deco, Bauhaus, Postmodern, Gothic, etc.)."
                          - listitem [ref=e436]:
                            - generic [ref=e437]: "Exterior Features: description of exterior features such as facade design, materials (e.g., concrete, glass, steel, brick), color schemes, decorative elements, and any unique architectural elements (e.g., balconies, awnings, ornamentation)."
                          - listitem [ref=e438]:
                            - generic [ref=e439]: "Building Layout and Overall Shape and Dimensions: details about the layout of the building, including the number of floors, floor plans, dimensions, proportions, and any specific structural elements (e.g., columns, beams, cantilevers), and also information about the overall shape of the building (e.g., rectangular, cylindrical, angular) and its dimensions, including length, width, and height."
                          - listitem [ref=e440]:
                            - generic [ref=e441]: "Windows and Doors: specifications for windows and doors, including their placement, size, style (e.g., sliding, casement, double-hung, bay), and materials (e.g., glass, wood, metal) (and specifically for doors, e.g., single, double, sliding)."
                          - listitem [ref=e442]:
                            - generic [ref=e443]: "Roof Design: description of the roof design, including its shape (e.g., flat, pitched, gabled, hipped, …), materials (e.g., shingles, tiles, metal), and any additional features (e.g., skylights, rooftop gardens, dormers)."
                          - listitem [ref=e444]:
                            - generic [ref=e445]: "Landscaping: information about landscaping elements surrounding the building, such as gardens, pathways, trees, and outdoor amenities (e.g., seating areas, fountains)."
                          - listitem [ref=e446]:
                            - generic [ref=e447]: "Description of Interior Layout and Features: (unnecessary if modeling only the outside of a model of a building) details about interior spaces, including room layouts, partitioning, ceiling heights, flooring materials, lighting fixtures, and any specific interior design elements (e.g., staircase design, built-in furniture)."
                          - listitem [ref=e448]:
                            - generic [ref=e449]: "Contextual Information: contextual details such as the building’s location, surroundings, site constraints, and any specific environmental considerations (e.g., climate, orientation, sustainability features)."
                          - listitem [ref=e450]:
                            - generic [ref=e451]: "Facade Design: specific details about the facade design, including materials (e.g., concrete, glass, brick, metal), textures, patterns, and decorative elements (e.g., columns, arches, balconies)."
                          - listitem [ref=e452]:
                            - generic [ref=e453]: "Finishing Details: specific finishing details such as paint colors, surface treatments, and decorative elements both inside and outside the building."
                        - generic [ref=e454]: By providing a thorough description encompassing these aspects, we can ensure that the resulting building model accurately reflects the desired design intent and meets the project requirements. Additionally, accompanying visual references such as architectural drawings, sketches, or reference images can further aid in the accurate interpretation and realization of the building model.
                      - generic [ref=e455]:
                        - heading "3.3. Final Results and Discussion" [level=3] [ref=e456]
                        - generic [ref=e457]: The comparative analysis reveals that the AI-based approach using verbal descriptions provides a structured and efficient method for generating 3D models. However, it lacks the detailed accuracy of models generated through optical recognition. The latter approach excels in capturing intricate architectural features but requires high-quality visual data and significant computational resources.
                        - generic [ref=e458]: We also bring discussions and the contribution of our research with reference to relevant recent literature.
                        - generic [ref=e459]:
                          - text: The key contribution of this research lies in its AI-driven procedural automation, which enhances modeling accuracy and efficiency at an individual building level. Meanwhile, Ref. [
                          - link "53" [ref=e460] [cursor=pointer]:
                            - /url: "#B53-applsci-14-08345"
                          - text: "] focuses on reducing the computational overhead in large-scale urban environments. Together, these works highlight the potential for integrating procedural modeling with lightweight reconstruction methods to improve both the efficiency and fidelity of urban 3D visualizations, especially for smart city applications."
                        - generic [ref=e461]:
                          - text: Our research significantly contributes to the advancements of 3D city modeling techniques that were explored in another study [
                          - link "54" [ref=e462] [cursor=pointer]:
                            - /url: "#B54-applsci-14-08345"
                          - text: "]. In both papers, procedural modeling emerges as an essential method for efficiently generating detailed urban structures, but the integration of AI, as we showed, enhances accuracy and scalability. In Ref. ["
                          - link "54" [ref=e463] [cursor=pointer]:
                            - /url: "#B54-applsci-14-08345"
                          - text: "], procedural modeling is highlighted for its ability to quickly generate complex 3D city models, suitable for large-scale urban planning projects and simulations. However, the limitations regarding manual adjustments, model diversity, and texture accuracy are evident. The AI-driven approaches from our research address these limitations by employing machine learning techniques such as convolutional neural networks (CNNs) and Generative Adversarial Networks (GANs) for tasks such as image-to-geometry translation and texture generation. Thus, the AI integration proposed in this research not only streamlines the generation of diverse building models but also provides higher realism, reducing the manual effort required in traditional procedural methods, and ultimately aligning with the goals outlined in Ref. ["
                          - link "54" [ref=e464] [cursor=pointer]:
                            - /url: "#B54-applsci-14-08345"
                          - text: "]. This fusion of procedural and AI techniques presents a transformative approach for urban planners and architects, offering enhanced visualization, efficiency, and adaptability in 3D smart city modeling."
                        - generic [ref=e465]:
                          - text: We also showed the enhancement of procedural modeling approaches discussed in the literature and in Ref. [
                          - link "55" [ref=e466] [cursor=pointer]:
                            - /url: "#B55-applsci-14-08345"
                          - text: "] by integrating AI-driven methods. While the digital twin research focuses on workflows for large-scale 3D urban models, AI-based procedural modeling optimizes the generation of complex building structures and textures with greater efficiency. The AI techniques, particularly CNNs and GANs, enable more realistic, dynamic models, addressing limitations in traditional procedural approaches and facilitating adaptable, high-detail urban simulations."
                        - generic [ref=e467]:
                          - text: The web-based application discussed in Ref. [
                          - link "56" [ref=e468] [cursor=pointer]:
                            - /url: "#B56-applsci-14-08345"
                          - text: "] by advancing procedural modeling with AI integration is very interesting. While the web-based tool focuses on efficient 3DCM (3D Composite Manufacturing) management, tiling, and spatial analysis, AI-enhanced procedural modeling allows for more detailed and accurate 3D building generation from 2D data. This AI-driven approach improves the efficiency and precision of 3DCM creation, aligning with the goal of optimizing model generation and visualization in web environments."
                        - generic [ref=e469]:
                          - text: Our research also contributes to the advancements in procedural modeling discussed in Ref. [
                          - link "57" [ref=e470] [cursor=pointer]:
                            - /url: "#B57-applsci-14-08345"
                          - text: "] by incorporating AI to enhance model automation. While Ref. ["
                          - link "57" [ref=e471] [cursor=pointer]:
                            - /url: "#B57-applsci-14-08345"
                          - text: "] focused on procedural generation through CGA-based workflows and traditional shape grammars, the AI-driven techniques that we showed here improve the accuracy and efficiency of generating diverse, complex building models. This AI integration aligns with Ref. ["
                          - link "57" [ref=e472] [cursor=pointer]:
                            - /url: "#B57-applsci-14-08345"
                          - text: "]’s goal of automating design, boosting creativity, and offering flexible adjustments in urban design."
                        - generic [ref=e473]: "Scientific Value and Contribution:"
                        - list [ref=e475]:
                          - listitem [ref=e476]:
                            - generic [ref=e477]: "Novel Framework: The integration of these methodologies offers a comprehensive solution that combines the strengths of both approaches, resulting in a novel framework for automated procedural modeling."
                          - listitem [ref=e478]:
                            - generic [ref=e479]: "Empirical Validation: This study provides empirical evidence supporting the effectiveness of the proposed methodologies, highlighting their potential to transform the field of geovisualization."
                          - listitem [ref=e480]:
                            - generic [ref=e481]: "Broader Implications: The findings have significant implications for urban planning, architecture, and other domains that rely on accurate and efficient building modeling."
                        - generic [ref=e482]: The integration of these methodologies offers a comprehensive solution, combining the strengths of both approaches. This research contributes to the field by providing a robust framework for automated procedural modeling, addressing both the efficiency and accuracy required for diverse building structures.
                        - generic [ref=e483]: To validate each research hypothesis and enhance the logical coherence of the paper, it is important to employ specific technical methods and a carefully structured experimental design. Additionally, incorporating case studies that demonstrate the practical application of these methods in the geographic visualization of different types of buildings will significantly improve the readability and comprehensibility of the paper.
                        - generic [ref=e484]: For the first hypothesis, which suggests that procedural modeling can accurately portray the diversity of real-world buildings, the validation process begins with a comparative analysis between traditional geovisualization methods and the proposed procedural modeling techniques. This involves the use of advanced AI and machine learning algorithms to identify and incorporate diverse architectural features into the models. For instance, convolutional neural networks (CNNs) are employed for image recognition, while Natural Language Processing (NLP) techniques is used to interpret descriptive data about the buildings. An experimental design is established where a variety of buildings, differing in architectural style and complexity, are modeled using both traditional and procedural methods. The generated models are evaluated by experts in architecture and urban planning based on metrics such as structural accuracy, visual fidelity, and computational efficiency. This comparative analysis provides empirical evidence on how well procedural models can replicate the diversity observed in real-world design.
                        - generic [ref=e485]: The second hypothesis, which posits that AI-driven procedural modeling can automate the creation of accurate building models using various input modalities such as images and textual descriptions, requires a different approach. To validate this hypothesis, AI algorithms that can process diverse types of input data to generate 3D building models must be implemented. Techniques like reverse procedural modeling, where AI uses detailed descriptions or images to generate scripts for building models, would play a crucial role. The experimental design involves feeding different types of data—such as photographs, blueprints, and verbal descriptions—into the AI-driven procedural modeling system to produce 3D models. These output models can then be compared against manually created models and their real-world counterparts to evaluate the accuracy, level of detail, and computational time. A further step could involve conducting a user study where professionals in cartography, architecture, or urban planning assess the usability and effectiveness of these AI-generated models, providing additional insights into the practical applicability of the proposed approach.
                        - generic [ref=e486]: These case studies would serve to illustrate the application of the proposed methods in real-world scenarios, thereby making the research more accessible and relatable to the reader. For instance, one case study could focus on an urban residential area, demonstrating how procedural modeling can be used to create detailed 3D models of a neighborhood with diverse building types. The study might use AI-driven procedural modeling to generate models based on inputs such as images of houses and textual descriptions of building materials and styles, showcasing the system’s ability to replicate the variety found in residential architecture and their geovisualization.
                        - generic [ref=e487]: Another case study could involve the recreation of a historical city center, highlighting how procedural modeling can be applied to complex architectural styles. In this scenario, archival images and descriptions would be used to model historical buildings with intricate details, demonstrating the system’s potential in heritage conservation and urban planning by accurately capturing the complexity and uniqueness of historical structures. A third case study might explore the modeling of a modern commercial district, where the procedural modeling approach could be applied to visualize large, repetitive structures such as office buildings and shopping malls. This case study will emphasize the computational advantages of procedural modeling, particularly in efficiently and accurately modeling large-scale commercial environments.
                    - generic [ref=e488]:
                      - heading "4. Challenges, Limitations, and Future Directions" [level=2] [ref=e489]
                      - generic [ref=e490]: Despite the significant advancements offered by the proposed AI-driven procedural modeling approach in enhancing geovisualization and automating 3D building modeling, there are several challenges and limitations that need to be addressed to fully realize its potential in practical applications. One of the primary challenges lies in the quality and availability of data. The accuracy and effectiveness of the AI models are closely tied to the quality and diversity of the input datasets. For models based on verbal descriptions, inconsistencies or incomplete data can result in errors during the generation of 3D models. Similarly, the optical recognition approach is highly dependent on the quality of images or videos; poor resolution, occlusions, or unfavorable lighting conditions can hinder accurate feature extraction and lead to less reliable outputs. Another notable limitation is the model’s ability to generalize across different architectural styles and environments. Models that are trained on specific datasets may encounter difficulties when applied to new or unseen types of buildings, particularly those with unique or complex architectural features. This limitation can restrict the method’s applicability in diverse or global contexts, where architectural variability is more pronounced. Additionally, the computational demands associated with training and deploying deep learning models, particularly for optical recognition, are substantial. High-performance computing resources are often required, which may not be readily available in all practical settings, especially in resource-constrained environments. This limitation could hinder the widespread adoption of these methods. A further challenge is the issue of interpretability and transparency within the AI models. Although these models can generate accurate 3D representations, the underlying decision-making processes often lack transparency, making it difficult to understand how certain architectural features were interpreted or why specific design decisions were made. This can be a significant drawback in fields that require a high degree of interpretability, such as urban planning or heritage conservation. Moreover, integrating AI-driven procedural modeling into existing architectural and urban planning workflows may present practical difficulties. Compatibility with existing software and tools, as well as the need for specialized knowledge to operate these AI systems, could pose significant barriers to adoption. Looking towards the future, several directions can be explored to address these challenges and enhance the proposed methodology. First, there is a need for richer and more diverse datasets that encompass a broader range of architectural styles and environmental contexts, which would help improve the models’ ability to generalize. Additionally, combining verbal and visual inputs into a hybrid model could leverage the strengths of both modalities, thereby overcoming some of the limitations associated with each approach. Advances in AI techniques, such as the use of Generative Adversarial Networks (GANs) for data augmentation and reinforcement learning for model optimization, could further enhance the quality and adaptability of the models. These advanced techniques might also contribute to generating more realistic and context-aware 3D models. Improving the transparency and interpretability of AI models should also be a priority. The development of explainable AI (XAI) techniques could make the decision-making processes within these models more understandable, thus increasing trust and usability in professional applications. Additionally, research into more resource-efficient AI models that can operate effectively on lower-end hardware or within cloud-based systems could make these tools more accessible and scalable. Finally, future work should focus on improving the integration of AI-driven procedural modeling tools with industry-standard software and workflows. Developing plugins or APIs that allow for seamless operation within existing CAD or BIM systems could facilitate broader adoption within the architecture, engineering, and construction (AEC) industries. While the proposed AI-driven procedural modeling approach represents a significant advancement, addressing these challenges and exploring the outlined future directions will be crucial for its successful application in real-world scenarios. By continuously refining and improving the methodology, it is possible to overcome the current limitations and expand the utility and impact of this research across various domains.
                      - generic [ref=e491]:
                        - text: Looking ahead, future research could explore the integration of AI-driven procedural modeling with recent developments in generative artificial intelligence, particularly text-to-image programs like Midjourney. These tools, which can generate detailed images from textual descriptions, could be utilized to enhance both modern and heritage architecture. For example, in modern architecture, architects could use text prompts to quickly generate initial design concepts, which could then be refined through procedural modeling techniques. This approach could streamline the creative process, allowing for more experimentation and innovation. In heritage architecture and urbanism, generative AI could play a crucial role in the restoration and preservation of historical sites. By combining textual descriptions of lost or damaged structures with procedural modeling, researchers could create accurate 3D reconstructions that are both visually compelling and historically faithful. This would not only aid in the physical restoration of heritage sites but also in the digital preservation of cultural history. These speculative integrations align with the work of Ref. [
                        - link "58" [ref=e492] [cursor=pointer]:
                          - /url: "#B58-applsci-14-08345"
                        - text: "] who discusses the speculative uses of geovisualization in reimagining architecture and landscapes. By applying similar techniques, future research could push the boundaries of architectural design and visualization. Additionally, the analytical evaluation of Midjourney’s capabilities by Ref. ["
                        - link "59" [ref=e493] [cursor=pointer]:
                          - /url: "#B59-applsci-14-08345"
                        - text: "] highlights the current limitations in AI-generated representations, particularly in Islamic architectural heritage, pointing to areas where procedural modeling could complement these approaches to overcome existing challenges. Furthermore, the study by Ref. ["
                        - link "60" [ref=e494] [cursor=pointer]:
                          - /url: "#B60-applsci-14-08345"
                        - text: "] on the perception of 3D geovisualization in urban planning underscores the importance of combining familiarity with innovative tools to enhance communication and design processes in urban contexts. Future research should focus on these potential integrations, exploring how generative AI can be combined with procedural modeling to address the specific needs of architectural and urban design. This could lead to the development of new methodologies that bridge the gap between cutting-edge AI technologies and practical applications in these fields, ultimately advancing both the efficiency and creativity of design processes."
                    - generic [ref=e495]:
                      - heading "5. Conclusions" [level=2] [ref=e496]
                      - generic [ref=e497]: The comparative analysis of AI-based procedural modeling using verbal descriptions versus optical recognition of building images provides valuable insights into the strengths and limitations of each input modality. By assessing metrics such as model accuracy, fidelity to real-world structures, computational efficiency, and user satisfaction, the study underscores the importance of input modality selection in the design and implementation of modeling systems. The implications for practitioners and researchers are profound, as the choice of input modality can significantly impact the efficacy and suitability of the generated models. Verbal descriptions offer a straightforward method for capturing detailed specifications, especially when textual information is readily available. Natural language processing (NLP) techniques can efficiently parse and extract relevant data from these descriptions, facilitating accurate model generation. However, the fidelity of models derived from verbal descriptions heavily depends on the completeness and clarity of the provided information. This approach may fall short in scenarios where intricate visual details are critical, as it might not capture the nuanced architectural features that are easily perceivable in images. On the other hand, the optical recognition of building images leverages the power of computer vision algorithms, particularly convolutional neural networks (CNNs), to extract detailed architectural features from visual data. This method excels in capturing the contextual richness and fine-grained details of building structures. By identifying and classifying elements such as facades, windows, and doors through image segmentation and feature detection, this approach can produce highly accurate and faithful models. However, it requires substantial computational resources and high-quality, annotated datasets to train the algorithms effectively. Hybrid approaches that combine verbal descriptions with optical recognition hold promise for maximizing the strengths and mitigating the weaknesses of each modality. By integrating textual and visual data, these methods can achieve a higher level of detail and accuracy in model generation. For instance, while textual descriptions can provide a broad framework and specific dimensions, visual data can enrich the model with precise architectural features and contextual information. This synergy can enhance the overall fidelity and usability of the generated models. Scalability and adaptability are critical considerations for the practical application of procedural modeling systems. Cloud-based infrastructure and distributed computing technologies enable the efficient handling of large-scale modeling tasks. Modular software architectures and open-source frameworks foster interoperability and extensibility, allowing developers to integrate custom modules and adapt systems to specific domain contexts. This flexibility ensures that procedural modeling can accommodate diverse project requirements and scales, from individual buildings to extensive urban planning projects.
                      - generic [ref=e498]: Conclusions from this research and the findings of this analysis emphasize the importance of selecting the appropriate input modality based on the specific requirements, constraints, and objectives of the modeling task. For example, in scenarios where detailed visual specifications are readily available in textual form, such as architectural blueprints or schematic diagrams, verbal descriptions may suffice. Conversely, in environments rich with visual data, such as photorealistic images or video streams, optical recognition may offer superior results. Ultimately, the choice of input modality should align with the desired outcomes of the modeling process, whether it be accuracy, efficiency, or user satisfaction. By carefully considering the strengths and limitations of each approach, practitioners can make informed decisions that enhance the effectiveness of AI-based procedural modeling.
                      - generic [ref=e499]: Future research should explore the integration of advanced AI techniques, such as Generative Adversarial Networks (GANs) and reinforcement learning, to further optimize the procedural modeling process. Additionally, the development of comprehensive online databases and the utilization of real-time feedback mechanisms can enhance the adaptability and responsiveness of modeling systems. By continuing to advance the capabilities of AI and machine learning in procedural modeling, the field can address increasingly complex design challenges and contribute to the creation of sustainable and innovative built environments.
                      - generic [ref=e500]: In conclusion, this comparative analysis provides a nuanced understanding of the relative merits of verbal descriptions and optical recognition in AI-based procedural modeling. By leveraging the strengths of each modality and exploring hybrid approaches, practitioners and researchers can enhance the design, implementation, and evaluation of modeling systems, ultimately driving innovation in architectural and urban planning.
                      - generic [ref=e501]: This study demonstrates the potential of combining procedural modeling with AI and machine learning to enhance the geovisualization of buildings. The proposed methodologies offer significant improvements over traditional methods, providing a foundation for future research and development in this field.
                      - generic [ref=e502]: This research bridges the gap in procedural modeling by integrating advanced AI techniques, providing a robust and efficient framework for 3D building modeling. The comparative analysis highlights the strengths and limitations of different approaches, offering valuable insights for practitioners and researchers. This work significantly contributes to the field of geovisualization and the modeling of 3D buildings and sets the stage for future advancements in automated procedural modeling.
