                      - generic [ref=e290]:
                        - text: In order to provide a better understanding of the recent related research and to provide a brief comparison of our research with others,
                        - link "Table 1" [ref=e291] [cursor=pointer]:
                          - /url: "#table_body_display_applsci-15-07984-t001"
                        - text: provides a summary of the related research.
                      - generic [ref=e292]:
                        - generic [ref=e293]: Table 1. Summary of related works.
                        - generic [ref=e295] [cursor=pointer]:
                          - img [ref=e296]
                          - link [ref=e297]:
                            - /url: "#table_body_display_applsci-15-07984-t001"
                      - generic [ref=e298]: "Overall, unlike many of the referenced studies that either focus on static offline analysis, lack explainable AI integration, or omit real-time deployment, our study introduces a unified, cloud-enabled intrusion detection system that excels in adaptability, accuracy, and transparency where it excels in the following:"
                      - list [ref=e300]:
                        - listitem [ref=e301]:
                          - generic [ref=e302]: "Real-time cloud-based detection: Our framework integrates live network traffic capture within a cloud environment (e.g., AWS), enabling continuous monitoring and immediate anomaly detection, a capability often missing in previous works."
                        - listitem [ref=e303]:
                          - generic [ref=e304]: "Hybrid ensemble learning: By combining an ANN and SVM as base classifiers with an RF meta-classifier, our approach leverages the strengths of both DL and traditional ML. This hybrid model achieves superior performance over standalone models."
                        - listitem [ref=e305]:
                          - generic [ref=e306]: "Explainable AI integration (SHAP): We incorporate SHAP (SHapley Additive exPlanations) to provide both global and local interpretability, addressing the black-box nature of most DL-based IDS and increasing trust among security analysts."
                        - listitem [ref=e307]:
                          - generic [ref=e308]: "End-to-end system architecture: Our work goes beyond theoretical accuracy by delivering a fully functional real-time deployment pipeline using Flask, offering a web-based interface for monitoring and actionable threat alerts, closing the gap between research and real-world usability."
