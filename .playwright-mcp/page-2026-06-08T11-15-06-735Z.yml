                        - text: ","
                        - link "11" [ref=e274] [cursor=pointer]:
                          - /url: "#B11-applsci-15-07984"
                        - text: "]. Accurate and timely capture of network data during these transmission windows is essential for identifying malicious activity. To support this capability, a range of packet capture tools, such as pcap, ncap, and dashcap, have been developed ["
                        - link "4" [ref=e275] [cursor=pointer]:
                          - /url: "#B4-applsci-15-07984"
