                        - text: ","
                        - link "22" [ref=e268] [cursor=pointer]:
                          - /url: "#B22-applsci-15-07984"
                        - text: "]."
                      - generic [ref=e269]:
                        - text: The introduction of DL further expanded the potential of IDS by minimizing the need for manual feature engineering. Due to their layered structure, DL models are capable of automatically extracting complex patterns from raw data, enabling deeper insights and more accurate threat detection [
                        - link "12" [ref=e270] [cursor=pointer]:
                          - /url: "#B12-applsci-15-07984"
                        - text: "]. As a result, both ML- and DL-based intrusion detection solutions have evolved continuously, from early research in the 1980s to the sophisticated, self-adaptive systems we see today."
                      - generic [ref=e271]:
                        - text: Real-time network data capture represents one of the key contributions of this study, serving as the primary input for the anomaly detection model. As networking technologies continue to evolve, the structure and behavior of data flows across networks have undergone substantial transformations. These changes, driven by advances in communication protocols and transmission mechanisms, have made it increasingly critical to capture network traffic during the precise window when intrusions occur, namely, during the exchange of data between systems [
                        - link "4" [ref=e272] [cursor=pointer]:
                          - /url: "#B4-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e273] [cursor=pointer]:
