                      - generic [ref=e142]:
                        - text: With the rapid growth of digital connectivity and computational power, unauthorized network intrusions, commonly referred to as network attacks, have become increasingly frequent and sophisticated. These cyberattacks target vulnerabilities in network services to gain unauthorized access or disrupt operations, which ultimately endanger the operations of the entire Information Technology infrastructure [
                        - link "1" [ref=e143] [cursor=pointer]:
                          - /url: "#B1-applsci-15-07984"
                        - text: "]. Overall, the surge in network-based threats has led to a notable rise in both the scale and complexity of cyber incidents worldwide ["
                        - link "1" [ref=e144] [cursor=pointer]:
                          - /url: "#B1-applsci-15-07984"
                        - text: ","
                        - link "2" [ref=e145] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: "]."
                      - generic [ref=e146]:
                        - text: "Recent statistics highlight the severity of this trend: in 2024, over 6.5 billion malware attacks were recorded globally, and the average cost of a data breach reached USD 4.88 million ["
                        - link "2" [ref=e147] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: ","
                        - link "3" [ref=e148] [cursor=pointer]:
                          - /url: "#B3-applsci-15-07984"
                        - text: "]. In the United States alone, the average breach cost in 2023 was approximately USD 9 million, while the global average consistently hovers around USD 4 million ["
                        - link "2" [ref=e149] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: ","
                        - link "3" [ref=e150] [cursor=pointer]:
                          - /url: "#B3-applsci-15-07984"
                        - text: "]. On the other hand, according to"
                        - link "Figure 1" [ref=e151] [cursor=pointer]:
                          - /url: "#fig_body_display_applsci-15-07984-f001"
                        - text: ", it is evident that the estimated annual cost of cybercrime worldwide is projected to reach over USD 13 trillion by 2028, making it one of the most economically damaging threats globally and surpassing the value of the global trade of all major illegal drugs combined ["
                        - link "1" [ref=e152] [cursor=pointer]:
                          - /url: "#B1-applsci-15-07984"
                        - text: ","
                        - link "2" [ref=e153] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: "]. Hence, these figures underscore the critical need for robust, intelligent cybersecurity solutions to protect sensitive digital infrastructure."
                      - generic [ref=e154]:
                        - generic [ref=e156] [cursor=pointer]:
                          - img "Applsci 15 07984 g001" [ref=e157]
