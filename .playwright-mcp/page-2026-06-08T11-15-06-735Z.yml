                          - link "Table 3" [ref=e433] [cursor=pointer]:
                            - /url: "#table_body_display_applsci-15-07984-t003"
                          - text: presents the layered ensemble architecture, detailing its hierarchical composition, including the base classifiers (ANN and SVM), their respective internal layers or operations, and how their outputs are fused using an RF meta-classifier to generate the final intrusion detection decision.
                        - generic [ref=e434]:
                          - generic [ref=e435]: Table 3. Layered ensemble architecture.
                          - generic [ref=e437] [cursor=pointer]:
                            - img [ref=e438]
                            - link [ref=e439]:
                              - /url: "#table_body_display_applsci-15-07984-t003"
                        - generic [ref=e440]: The choice of the number of layers and nodes in the ANN was based on empirical tuning using a grid search over multiple configurations. We evaluated models with 2 to 4 hidden layers and node sizes ranging from 16 to 128 per layer. The final architecture, with 3 hidden layers of 64, 32, and 16 nodes, was selected based on the best trade-off between accuracy and training time. A dropout rate of 0.3 and 0.2 was introduced after each layer, respectively, to minimize overfitting. The SVM used a linear kernel, and the learning process used early stopping based on validation loss to prevent overfitting and ensure convergence. Predictions from both ANN and SVM were stacked to form a 2-feature vector per instance. An RF meta-classifier was trained on this new feature space, allowing the model to leverage ANN’s nonlinear learning and SVM’s margin-based separation. This approach enhanced overall classification reliability.
