                        - text: ","
                        - link "20" [ref=e279] [cursor=pointer]:
                          - /url: "#B20-applsci-15-07984"
                        - text: "]. These tools offer functionalities like selective packet filtering and time-specific data acquisition, enabling more precise detection and analysis of abnormal network behavior. The continuous refinement of such capture mechanisms has significantly advanced the field of network-based intrusion detection ["
