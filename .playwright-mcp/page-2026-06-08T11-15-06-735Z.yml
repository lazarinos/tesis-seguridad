                      - generic [ref=e160]:
                        - text: "Overall, network attacks are broadly categorized into two main types: active attacks and passive attacks where active attacks involve direct system intrusions carried out using malware, viruses, trojans, or other exploitation tools ["
                        - link "3" [ref=e161] [cursor=pointer]:
                          - /url: "#B3-applsci-15-07984"
                        - text: ","
                        - link "4" [ref=e162] [cursor=pointer]:
                          - /url: "#B4-applsci-15-07984"
                        - text: ","
                        - link "5" [ref=e163] [cursor=pointer]:
                          - /url: "#B5-applsci-15-07984"
                        - text: "]. Previously seen as minor threats posed by amateur hackers, these attacks have evolved in scale and impact, now affecting billions of users globally and resulting in estimated damages exceeding USD 2.7 billion between 2021 and 2023 ["
                        - link "1" [ref=e164] [cursor=pointer]:
                          - /url: "#B1-applsci-15-07984"
                        - text: ","
                        - link "2" [ref=e165] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: ","
                        - link "3" [ref=e166] [cursor=pointer]:
                          - /url: "#B3-applsci-15-07984"
                        - text: "]. Nonetheless, annual network security revenue is projected to grow significantly, increasing from approximately USD 20 billion in 2016 to over USD 60 billion by 2028 (as depicted in"
                        - link "Figure 2" [ref=e167] [cursor=pointer]:
                          - /url: "#fig_body_display_applsci-15-07984-f002"
                        - text: ), driven by rising cyber threats, increased adoption of cloud services, and stricter regulatory compliance requirements.
                      - generic [ref=e168]:
                        - generic [ref=e170] [cursor=pointer]:
