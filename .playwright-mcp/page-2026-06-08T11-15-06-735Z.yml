                        - text: showcases commonly observed cyberattacks, including Denial of Service (DoS) and Distributed Denial of Service (DDoS) attacks, Man-in-the-Middle attacks, packet sniffing, port scanning, and ARP spoofing [
                        - link "2" [ref=e179] [cursor=pointer]:
