                        - generic [ref=e352]: Following the data acquisition, the dataset was rigorously preprocessed to optimize its structure for ML and DL tasks. Initially, categorical features such as ‘protocol_type’, ‘service’, and ‘flag’ were transformed into numerical values using label encoding. Then the redundant features with no variance, such as ‘num_outbound_cmds’, were removed, as they do not contribute to learning and may degrade model generalization.
