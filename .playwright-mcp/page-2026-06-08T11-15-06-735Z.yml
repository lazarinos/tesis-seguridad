                    - generic [ref=e235]:
                      - heading "2. Background and Literature Review" [level=2] [ref=e236]
                      - generic [ref=e237]:
                        - text: As networking technologies advance, cyberattacks have proliferated worldwide. What were once largely exploratory hacks causing minimal damage have evolved into lucrative operations for attackers, inflicting substantial losses on governments, corporations, and even individual smartphone users [
                        - link "1" [ref=e238] [cursor=pointer]:
                          - /url: "#B1-applsci-15-07984"
                        - text: ","
                        - link "2" [ref=e239] [cursor=pointer]:
                          - /url: "#B2-applsci-15-07984"
                        - text: ","
                        - link "3" [ref=e240] [cursor=pointer]:
                          - /url: "#B3-applsci-15-07984"
                        - text: ","
                        - link "4" [ref=e241] [cursor=pointer]:
                          - /url: "#B4-applsci-15-07984"
                        - text: "]. Adversaries continuously refine their methods, leveraging everything from novel exploits to botnets to target any device connected to a network. The exponential growth of interconnected systems, the surge in data traffic, and the relentless innovation in attack strategies have made real-time detection and mitigation ever more difficult ["
                        - link "8" [ref=e242] [cursor=pointer]:
                          - /url: "#B8-applsci-15-07984"
                        - text: ","
                        - link "9" [ref=e243] [cursor=pointer]:
                          - /url: "#B9-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e244] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: "]."
                      - generic [ref=e245]:
                        - text: As network attacks have grown more complex, integrating ML into IDSs has become significantly more effective than traditional methods [
                        - link "8" [ref=e246] [cursor=pointer]:
                          - /url: "#B8-applsci-15-07984"
                        - text: ","
                        - link "9" [ref=e247] [cursor=pointer]:
                          - /url: "#B9-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e248] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: "]. Earlier implementations, such as the concept, first introduced by Jim Anderson in 1980, required system administrators to manually inspect logs for anomalies ["
                        - link "10" [ref=e249] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: "]. In contrast, modern IDS solutions increasingly rely on intelligent automation through ML techniques ["
                        - link "12" [ref=e250] [cursor=pointer]:
                          - /url: "#B12-applsci-15-07984"
                        - text: ","
                        - link "13" [ref=e251] [cursor=pointer]:
                          - /url: "#B13-applsci-15-07984"
                        - text: ","
                        - link "14" [ref=e252] [cursor=pointer]:
                          - /url: "#B14-applsci-15-07984"
                        - text: ","
                        - link "15" [ref=e253] [cursor=pointer]:
                          - /url: "#B15-applsci-15-07984"
                        - text: ","
                        - link "16" [ref=e254] [cursor=pointer]:
                          - /url: "#B16-applsci-15-07984"
                        - text: "]."
                      - generic [ref=e255]:
                        - text: Over the past decade, a wide range of ML approaches, including supervised learning, unsupervised learning, pattern recognition, and deep learning (DL) approaches such as ANN and Recurrent Neural Networks (RNNs), have been explored to enhance IDS capabilities [
                        - link "5" [ref=e256] [cursor=pointer]:
                          - /url: "#B5-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e257] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: ","
                        - link "11" [ref=e258] [cursor=pointer]:
                          - /url: "#B11-applsci-15-07984"
                        - text: ","
                        - link "13" [ref=e259] [cursor=pointer]:
                          - /url: "#B13-applsci-15-07984"
                        - text: ","
                        - link "14" [ref=e260] [cursor=pointer]:
                          - /url: "#B14-applsci-15-07984"
                        - text: ","
                        - link "15" [ref=e261] [cursor=pointer]:
                          - /url: "#B15-applsci-15-07984"
                        - text: ","
                        - link "16" [ref=e262] [cursor=pointer]:
                          - /url: "#B16-applsci-15-07984"
                        - text: ","
                        - link "17" [ref=e263] [cursor=pointer]:
                          - /url: "#B17-applsci-15-07984"
                        - text: "]. In this regard, each method offers unique advantages, and selecting the right combination of algorithms and datasets remains essential for effective implementation. This has led to a surge in research aimed at exploring how ML and DL can improve intrusion detection, with a growing emphasis on large-scale, high-quality datasets to train and validate these models. The ongoing pursuit of greater accuracy, performance, and autonomy continues to drive innovation in this domain ["
                        - link "18" [ref=e264] [cursor=pointer]:
                          - /url: "#B18-applsci-15-07984"
                        - text: ","
                        - link "19" [ref=e265] [cursor=pointer]:
