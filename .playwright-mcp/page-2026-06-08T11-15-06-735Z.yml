                      - generic [ref=e686]: Overall, SHAP explainability showed that ANN predictions generally contributed more to anomaly classification, but in cases where ANN was uncertain, SVM votes tipped the decision. This interpretability is critical in cybersecurity contexts where understanding each alert’s origin helps prevent alert fatigue and improve incident response.
                      - generic [ref=e687]:
                        - text: The SHAP force plot (
                        - link "Figure 10" [ref=e688] [cursor=pointer]:
                          - /url: "#fig_body_display_applsci-15-07984-f010"
                        - text: ) provides a local explanation for a single prediction made by the ensemble model by breaking down the model output into additive feature contributions. The predicted value f(x) = 0.537 represents the model’s estimated probability that the instance is an anomaly. This prediction is derived by starting from a base value, typically the mean model output over the training set, and adding SHAP values for each feature. For example, a SHAP value of +0.15 for a feature means that this feature increased the prediction by 0.15, moving it closer to the anomaly class. Conversely, a −0.15 value indicates a negative influence, pulling the prediction back toward the normal class. The final prediction is thus the sum of the base value and all SHAP contributions, allowing clear visualization of how each feature impacted the decision.
                      - generic [ref=e689]:
