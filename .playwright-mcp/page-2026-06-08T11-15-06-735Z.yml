                      - generic [ref=e187]:
                        - text: Traditional security defenses relying on static rule sets and manual log analysis are increasingly ineffective against evolving cyber threats [
                        - link "8" [ref=e188] [cursor=pointer]:
                          - /url: "#B8-applsci-15-07984"
                        - text: ","
                        - link "9" [ref=e189] [cursor=pointer]:
                          - /url: "#B9-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e190] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: ","
                        - link "11" [ref=e191] [cursor=pointer]:
                          - /url: "#B11-applsci-15-07984"
                        - text: ","
                        - link "12" [ref=e192] [cursor=pointer]:
                          - /url: "#B12-applsci-15-07984"
                        - text: "]. Manual monitoring is labor-intensive and inherently reactive, often detecting breaches only after significant damage has occurred. To overcome these limitations, modern intrusion detection systems (IDSs) have begun leveraging machine learning (DL) to enable proactive, real-time threat detection ["
                        - link "12" [ref=e193] [cursor=pointer]:
                          - /url: "#B12-applsci-15-07984"
                        - text: ","
                        - link "13" [ref=e194] [cursor=pointer]:
                          - /url: "#B13-applsci-15-07984"
                        - text: ","
                        - link "14" [ref=e195] [cursor=pointer]:
                          - /url: "#B14-applsci-15-07984"
                        - text: ","
                        - link "15" [ref=e196] [cursor=pointer]:
                          - /url: "#B15-applsci-15-07984"
                        - text: ","
                        - link "16" [ref=e197] [cursor=pointer]:
                          - /url: "#B16-applsci-15-07984"
                        - text: "]. While classical IDS approaches were effective in early network environments, they struggle in modern contexts due to several critical limitations:"
                      - list [ref=e199]:
                        - listitem [ref=e200]:
                          - generic [ref=e201]:
                            - text: "Increased attack complexity: Modern threats such as Distributed Denial of Service (DDoS) and polymorphic malware evolve rapidly, often bypassing static, pattern-based detection methods ["
                            - link "4" [ref=e202] [cursor=pointer]:
                              - /url: "#B4-applsci-15-07984"
                            - text: "]."
                        - listitem [ref=e203]:
                          - generic [ref=e204]:
                            - text: "Scalability challenges: The high volume and velocity of traffic in enterprise and cloud environments overwhelm traditional IDS infrastructures ["
                            - link "3" [ref=e205] [cursor=pointer]:
                              - /url: "#B3-applsci-15-07984"
                            - text: ","
                            - link "4" [ref=e206] [cursor=pointer]:
                              - /url: "#B4-applsci-15-07984"
                            - text: "]."
                        - listitem [ref=e207]:
                          - generic [ref=e208]:
                            - text: "Limited adaptability: Fixed-pattern classifiers are incapable of identifying novel or zero-day attacks not represented in the training data ["
                            - link "4" [ref=e209] [cursor=pointer]:
                              - /url: "#B4-applsci-15-07984"
                            - text: ","
                            - link "5" [ref=e210] [cursor=pointer]:
                              - /url: "#B5-applsci-15-07984"
                            - text: ","
                            - link "6" [ref=e211] [cursor=pointer]:
                              - /url: "#B6-applsci-15-07984"
                            - text: ","
                            - link "7" [ref=e212] [cursor=pointer]:
                              - /url: "#B7-applsci-15-07984"
                            - text: "]."
                      - generic [ref=e213]: "As a result, many IDS models treat anomaly detection as a static binary or multiclass classification task, which significantly limits their ability to adapt to new or evolving cyber threats. This shortcoming underscores the urgent need for a dynamic, data-driven solution that supports continuous learning and real-time threat identification. In this context, our research introduces a hybrid ensemble framework that integrates an Artificial Neural Network (ANN) and Support Vector Machine (SVM) as base classifiers, with a Random Forest (RF) meta-classifier to intelligently combine their predictions for improved detection accuracy. Furthermore, the framework is deployed in a real cloud-based environment that utilizes real-time packet capture tools to stream live network traffic. This integration enables immediate anomaly detection, allowing the system to dynamically analyze incoming data and respond to threats in real time, thereby enhancing the adaptability and operational relevance of modern IDS deployments. Thus, in this regard, the key contributions of this study include the following:"
                      - list [ref=e215]:
                        - listitem [ref=e216]:
                          - generic [ref=e217]: Proposing a novel ensemble learning framework (ANN + SVM with RF meta-classifier) that achieves competitive performance compared to state-of-the-art intrusion detection models.
                        - listitem [ref=e218]:
                          - generic [ref=e219]: Employing Recursive Feature Elimination (RFE) to dynamically select the most relevant features and reduce model complexity.
                        - listitem [ref=e220]:
                          - generic [ref=e221]: Incorporating explainable artificial intelligence (XAI) to interpret individual detection decisions and improve transparency.
                        - listitem [ref=e222]:
                          - generic [ref=e223]: Developing a real-time deployment pipeline using Flask and live packet capture for immediate anomaly detection and dashboard reporting, in the real cloud environment.
                      - generic [ref=e224]:
                        - text: On the other hand, a review of the recent literature indicates that most ML-based IDSs operate offline and lack real-time adaptability or interpretability [
                        - link "5" [ref=e225] [cursor=pointer]:
                          - /url: "#B5-applsci-15-07984"
                        - text: ","
                        - link "6" [ref=e226] [cursor=pointer]:
                          - /url: "#B6-applsci-15-07984"
                        - text: ","
                        - link "9" [ref=e227] [cursor=pointer]:
                          - /url: "#B9-applsci-15-07984"
                        - text: ","
                        - link "10" [ref=e228] [cursor=pointer]:
                          - /url: "#B10-applsci-15-07984"
                        - text: ","
                        - link "11" [ref=e229] [cursor=pointer]:
                          - /url: "#B11-applsci-15-07984"
                        - text: ","
                        - link "12" [ref=e230] [cursor=pointer]:
                          - /url: "#B12-applsci-15-07984"
                        - text: "]. Thus, this study addresses these limitations by combining real-time inference, feature selection, and explainability in a unified, scalable IDS framework."
                      - generic [ref=e231]:
                        - text: The study is organized in the following manner. Following the introduction, the next section provides the background and related work relevant to the research. The methodology is detailed in
