                        - text: . A simple and user-friendly web interface was developed to display real-time anomaly detection results. The system captures live traffic data from the cloud during the testing phase, processes it continuously, and presents the anomaly percentage to users via the web interface as depicted in
                        - link "Figure 14" [ref=e742] [cursor=pointer]:
