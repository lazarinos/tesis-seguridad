                      - generic [ref=e749]: The webpage is configured to automatically refresh every 10 s, ensuring that users always see the most recent detection results. As new data is ingested, it is immediately preprocessed to match the input format required by the pre-trained anomaly detection model, an ensemble-based neural network. The model evaluates each data point to identify abnormal behavior. The proportion of anomalies detected is calculated and displayed as a percentage, offering users a clear and continuously updated insight into system health and potential security threats. This real-time monitoring framework enables timely detection and response to unusual activity patterns, enhancing the system’s effectiveness in identifying and mitigating potential risks.
                      - generic [ref=e750]:
                        - heading "Discussion" [level=3] [ref=e751]
                        - generic [ref=e752]: The results of this study demonstrate the effectiveness of the proposed ensemble intrusion detection system, which combines the strengths of ANN, SVM, and RF within a real-time, explainable framework. To assess the contribution of each component in the proposed ensemble, we evaluated the individual performance of ANN and SVM classifiers independently prior to integration. The ANN model achieved an accuracy of 99.20%, while the SVM achieved 96.80%. When combined in the ensemble architecture with RF as the meta-classifier, the accuracy improved to 99.40%. This improvement illustrates that each base learner contributes complementary strengths, and the ensemble effectively captures their collective predictive power, thereby justifying the architectural design.
                        - generic [ref=e753]: With an overall accuracy of 99.40%, the ensemble model outperformed the individual classifiers and surpassed the accuracy levels reported in several related studies using the same NSL-KDD dataset. Notably, this performance was achieved while maintaining interpretability through SHAP and real-time responsiveness via a cloud-hosted Flask interface, features that are often lacking in existing academic and commercial IDS models. Although the current system operates as a binary classifier (normal vs. anomaly), it can be extended to a multiclass intrusion detection framework by utilizing the detailed attack-type labels present in both the NSL-KDD and UNSW-NB15 datasets. Such an extension would enable the identification of specific attack types (e.g., DoS and probe), further enhancing the model’s practical applicability. However, this would involve additional challenges such as handling class imbalance and retraining the ensemble model for multi-output classification, where we have identified this as a promising direction for future work.
                        - generic [ref=e754]: In comparison to traditional signature-based or rule-based intrusion detection systems, the proposed model offers significant advantages in adaptability, scalability, and transparency. Most commercial IDS solutions either rely on static threat intelligence or lack explainability in their detection processes, which limits their effectiveness in detecting zero-day or polymorphic attacks and reduces the trust of human analysts. In contrast, this study’s approach integrates live packet analysis and machine learning with explainable AI to provide not only accurate predictions but also clear justifications for each decision, enhancing user confidence and operational efficiency.
                        - generic [ref=e755]: Despite its promising results, the current implementation has a few limitations. First, the system is designed primarily for binary classification (normal vs. anomalous traffic) and does not yet distinguish between different types of attacks. Second, while the deployment on a t2.medium EC2 instance was sufficient for research purposes, larger-scale or enterprise-level implementations may require higher resource configurations to handle heavier network loads and parallel user access. While the current deployment on an AWS t2.medium instance validated the system’s real-time functionality and detection accuracy, the evaluation did not include systematic stress testing under high-volume traffic conditions. In future work, we plan to conduct performance benchmarking using simulated traffic bursts and continuous high-throughput streams to measure system response times, model inference latency, and resource utilization. This will provide a more comprehensive understanding of the framework’s scalability in production-grade environments.
                        - generic [ref=e756]: Finally, although SHAP explanations offer interpretability, there remains a need for automated prioritization of alerts and integration with security incident and event management (SIEM) tools to streamline incident response in practical environments. As mentioned above, future work will focus on extending the system to multiclass attack classification, incorporating additional datasets to improve generalization across environments, and enabling online learning capabilities to adapt to evolving threat patterns. Furthermore, integrating the IDS with cloud-based security platforms or enterprise SIEM systems will make the solution more viable for deployment in real-world infrastructures, including critical sectors such as smart agriculture, military, healthcare, and government networks. These enhancements will strengthen the model’s utility as a robust, scalable, and trustworthy tool for proactive network defense.
                    - generic [ref=e757]:
                      - heading "5. Conclusions" [level=2] [ref=e758]
                      - generic [ref=e759]: "This study introduced a novel ensemble intrusion detection framework that effectively combines ANN, SVM, and RF to enhance cybersecurity threat detection in real time. Unlike traditional intrusion detection systems that rely on static rules or isolated classifiers, the proposed hybrid model leverages the strengths of both deep learning and classical machine learning within a unified architecture. The system achieved a high detection accuracy of 99.40% on the NSL-KDD dataset, outperforming individual classifiers. The integration of SHAP-based explainable AI not only enhanced transparency but also provided actionable insights into model decisions, fostering trust among security analysts. To further validate the robustness of the ensemble model, an additional experiment was conducted using the more recent UNSW-NB15 dataset. This dataset includes nine distinct attack types, and the ensemble model maintained a high performance with a binary classification accuracy of 99.80%. The results demonstrated superior generalization compared to standalone classifiers (ANN: 98.30%, SVM: 95.60%) and were consistent with prior benchmark studies. The corresponding confusion matrix and ROC curve highlighted the model’s strong discriminative ability. Beyond its strong performance, the system was then successfully deployed using a Flask-based web interface in an AWS cloud environment, demonstrating its readiness for real-time monitoring and practical deployment. By continuously analyzing live network traffic and delivering interpretable alerts, the proposed framework proves its applicability across critical real-world domains such as healthcare, finance, industrial IoT, and government networks. Each phase of the system, from data preprocessing to explainability, was designed to ensure scalability, interpretability, and operational relevance. Moving forward, expanding the model to support multiclass attack detection, integrating it with enterprise-grade SIEM platforms, and exploring continuous online learning will further enhance its robustness and adaptability in complex security environments."
