                        - text: highlights the balance between precision and recall for the same classifier. The curve maintains a high precision level (close to 1.0) across nearly all recall values, except for a minor drop near the maximum recall threshold. This pattern demonstrates that the model can identify almost all actual anomalies without significantly sacrificing precision, even under imbalanced class distributions. The steep slope at the end indicates a trade-off between precision and recall at extreme thresholds, which is common in high-performing binary classifiers dealing with rare positive classes such as intrusions.
