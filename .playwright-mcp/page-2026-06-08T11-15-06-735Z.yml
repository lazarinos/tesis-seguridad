                        - heading "3.3. Model Construction" [level=3] [ref=e423]
                        - generic [ref=e424]:
                          - text: A deep ANN model was developed using Keras, with ReLU-activated dense layers and a sigmoid output layer for binary classification. An SVM with a linear kernel was trained in parallel. Both models were trained and validated on a 70:30 split of the dataset. Hyperparameter tuning was applied to the ANN to improve learning efficiency.
