                        - generic [ref=e612]: In this study, SHAP, a leading XAI technique grounded in cooperative game theory, was integrated to enhance the interpretability of the proposed ensemble intrusion detection system. SHAP values were computed for both global and local interpretability. The global SHAP summary plot revealed that the model relied slightly more on the ANN outputs than on SVM predictions when forming its final decisions via the Random Forest meta-classifier. For local explanations, SHAP decision plots and waterfall charts were used to visualize the contribution of each feature to individual predictions, offering transparent reasoning behind classifications. These explainability components not only demystify the internal workings of the hybrid ANN–SVM–RF architecture but also foster greater user trust, accountability, and usability in real-time security-critical environments.
