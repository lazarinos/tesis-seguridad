                              - text: shows that training the AI models on millions of samples takes, at most, a few minutes for most of the AI models considered in our work. It also shows that selecting all features for training would lead to a longer training time compared to only selecting the top 15 features (2.1X average increase across all AI models). It also shows that KNN and RF have the fastest training runtimes, respectively. On the other hand, LightGBM has the slowest training runtime for this dataset. For the RoEduNet-SIMARGL2021 dataset,
