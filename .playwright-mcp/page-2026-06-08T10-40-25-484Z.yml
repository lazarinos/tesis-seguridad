                        - generic [ref=e850]:
                          - text: It is crucial to recognize the challenges inherent in developing interpretation methods for network intrusion detection systems (IDSs), which present a stark contrast to other fields like text analysis and computer vision, where explainable AI (XAI) methods are more widely utilized [
                          - link "37" [ref=e851] [cursor=pointer]:
                            - /url: "#B37-applsci-14-04170"
                          - text: ","
                          - link "82" [ref=e852] [cursor=pointer]:
                            - /url: "#B82-applsci-14-04170"
                          - text: "]. Although XAI techniques such as LIME and SHAP hold considerable promise, there is a pressing need for further developments to tailor these methods more effectively for network cybersecurity ["
                          - link "90" [ref=e853] [cursor=pointer]:
                            - /url: "#B90-applsci-14-04170"
                          - text: "]. Nonetheless, the XAI-based analysis conducted in this study marks a significant advancement in enhancing the application of XAI within the domain of network intrusion detection."
                        - generic [ref=e854]:
