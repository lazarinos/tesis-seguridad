                          - link "37" [ref=e855] [cursor=pointer]:
                            - /url: "#B37-applsci-14-04170"
                          - text: "]. While LEMNA offers specific benefits in handling complex nonlinear data relationships, it faces challenges in terms of user accessibility and adaptability compared to LIME and SHAP. Additionally, LEMNA lacks comprehensive testing similar to SHAP and LIME, which may impact its reliability and performance. Despite its potential value in aiding security analysts in understanding and mitigating the risks associated with deep learning-based systems, LEMNA, like software fuzzing methods, carries inherent risks ["
                          - link "88" [ref=e856] [cursor=pointer]:
                            - /url: "#B88-applsci-14-04170"
                          - text: "]. These limitations underscore the intricacies involved in utilizing LEMNA in cybersecurity applications."
                      - generic [ref=e857]:
                        - heading "6.2. Importance of Our XAI Framework for IDSs" [level=3] [ref=e858]
                        - generic [ref=e859]:
                          - text: In the current era of rapid information growth, the frequency of network attacks is escalating, as highlighted by recent research from the Center for Strategic & International Studies (CSIS) [
                          - link "91" [ref=e860] [cursor=pointer]:
                            - /url: "#B91-applsci-14-04170"
                          - text: "]. Despite advances in intrusion detection systems (IDSs) over the years, security analysts face the daunting challenge of analyzing potential attacks that occur more rapidly than they can be processed. Accurate explainable AI (XAI) intrusion detection systems represent a crucial solution to this issue."
                        - generic [ref=e861]:
                          - text: The framework presented in this paper builds upon previous signature-based research [
                          - link "54" [ref=e862] [cursor=pointer]:
                            - /url: "#B54-applsci-14-04170"
                          - text: ","
                          - link "70" [ref=e863] [cursor=pointer]:
                            - /url: "#B70-applsci-14-04170"
                          - text: ","
                          - link "82" [ref=e864] [cursor=pointer]:
                            - /url: "#B82-applsci-14-04170"
                          - text: "], employing a method to identify the most influential features applicable across various models. For each of the seven AI models evaluated in this study, the key features are determined using SHAP and further refined through frequency analysis to pinpoint the most recurrent features. This methodology is also used to ascertain the most critical features for each type of attack. Additionally, our framework offers comprehensible explanations of AI decision-making processes and the pertinent influential features."
                        - generic [ref=e865]: "This approach is applied across three distinct datasets: NSL-KDD, CICIDS-2017, and RoEduNet-SIMARGL2021. Our research also includes a cost analysis of SHAP and LIME based on the number of samples utilized, offering insights into which AI models might be more cost-effective. This end-to-end XAI-based strategy extends beyond traditional multiclass classification for IDSs by highlighting the importance of influential features and providing tailored insights into specific types of attacks."
                      - generic [ref=e866]:
                        - heading "6.3. Insights on Chosen Datasets" [level=3] [ref=e867]
                        - generic [ref=e868]: "To rigorously evaluate our XAI framework, we chose the following datasets: NSL-KDD, CICIDS-2017, and RoEduNet-SIMARGL2021. These datasets were specifically chosen due to their varied and comprehensive representations of network intrusions, which range from DoS to Bot attacks. By dissecting each dataset, we highlighted inherent challenges, such as imbalanced classes, varied attack signatures, and differing traffic patterns. The analysis results of the application of XAI not only underline the relevance of these datasets to real-world network environments but also showcase how our XAI framework effectively identifies and explains key features across such diverse conditions. This depth of analysis ensures that our framework’s capabilities are tested against scenarios that closely mimic the complexities encountered in actual network security operations, especially when considering RoEduNet-SIMARGL2021 since CICIDS-2017 and NSL-KDD are considered benchmark datasets for network intrusion detection tasks."
                        - generic [ref=e869]: In particular, the selection of these three datasets for evaluating our XAI framework was driven by their distinct characteristics and widespread recognition in the network security community. NSL-KDD is an improved version of the KDD’99 dataset and addresses some of the inherent problems of its predecessor. CICIDS-2017 is valued for its realistic network traffic scenarios, which include a wide array of modern attacks. This dataset mimics the state of current network environments more accurately, providing rich testing security technologies. Lastly, RoEduNet-SIMARGL2021 offers data from a real operational network, adding valuable insights into the complexities and nuances of real-world network traffic that laboratory-created datasets may not replicate.
                      - generic [ref=e870]:
                        - heading "6.4. Evaluating Our XAI Framework Using Other Benchmark Datasets and Human Evaluation" [level=3] [ref=e871]
                        - generic [ref=e872]:
                          - text: In this study, we provided a detailed examination of our XAI framework utilizing the RoEduNet-SIMARGL2021, CICIDS-2017, and NSL-KDD datasets. Looking ahead, a valuable direction for future research will be to assess the effectiveness of our XAI framework on additional network intrusion detection benchmark datasets. Potential datasets for exploration include UNSW-NB15 [
                          - link "92" [ref=e873] [cursor=pointer]:
                            - /url: "#B92-applsci-14-04170"
                          - text: "], CICIDS-2018 ["
                          - link "93" [ref=e874] [cursor=pointer]:
                            - /url: "#B93-applsci-14-04170"
                          - text: "], CTU-13 ["
                          - link "94" [ref=e875] [cursor=pointer]:
                            - /url: "#B94-applsci-14-04170"
                          - text: "], UMass ["
                          - link "95" [ref=e876] [cursor=pointer]:
                            - /url: "#B95-applsci-14-04170"
                          - text: "], and various vulnerability-based datasets ["
                          - link "96" [ref=e877] [cursor=pointer]:
                            - /url: "#B96-applsci-14-04170"
                          - text: "]. This expansion would help further validate and refine our framework, broadening its applicability and enhancing its utility in diverse cybersecurity environments."
                        - generic [ref=e878]: Applying and testing our framework on additional datasets and testbeds for network IDSs would broaden its applicability and provide insights into its generalizability. Furthermore, exploring a human evaluation of the explainability provided by our XAI framework would further enhance its applicability.
                        - generic [ref=e879]:
                          - text: In particular, the work by Hoffman et al. [
                          - link "97" [ref=e880] [cursor=pointer]:
                            - /url: "#B97-applsci-14-04170"
                          - text: "] offers guidelines and forms for evaluating XAI from a human perspective. This study advocates for incorporating feedback from security experts to validate and enhance the generated explanations. Using this study as a guideline for incorporating human evaluation could help quantify the level of explanation provided by our XAI framework and ensure its effectiveness in real-world scenarios. Thus, integrating human evaluation into our framework represents a fruitful direction for future research."
                      - generic [ref=e881]:
                        - heading "6.5. Combining Different XAI Frameworks" [level=3] [ref=e882]
                        - generic [ref=e883]:
                          - text: One other future extension can be combining the considered black-box XAI methods in this work (SHAP and LIME) with white-box XAI methods (such as IG [
                          - link "98" [ref=e884] [cursor=pointer]:
                            - /url: "#B98-applsci-14-04170"
                          - text: "] and LRP ["
                          - link "70" [ref=e885] [cursor=pointer]:
                            - /url: "#B70-applsci-14-04170"
                          - text: "])."
                      - generic [ref=e886]:
                        - heading "6.6. Effect of Bias of Top Intrusion Features" [level=3] [ref=e887]
                        - generic [ref=e888]:
                          - text: In considering the overall important features, it is essential to recognize the potential for bias in some of them, which could affect the dataset generation process. For example, “Destination Port” has been flagged as a potential source of bias [
                          - link "99" [ref=e889] [cursor=pointer]:
                            - /url: "#B99-applsci-14-04170"
                          - text: "], where its inclusion in AI network intrusion detection models might lead to contamination effects. Similarly, it is reasonable to speculate that TCP_WIN_SCALE_IN could have a comparable contaminating influence on the RoEduNet-SIMARGL2021 dataset."
                        - generic [ref=e890]: It is important to clarify, however, that our XAI explanation and feature importance assessments are not solely reliant on individual features. Although some features may exhibit bias, the aggregate impact of multiple features should help in counteracting such biases. Nonetheless, as a precaution, we could include a caveat within the XAI explanation whenever a top feature identified is potentially biased, such as “Destination Port” or TCP_WIN_SCALE_IN. This addition would furnish users with further context and encourage a more critical assessment of the model’s decisions in light of possible biases.
                      - generic [ref=e891]:
                        - heading "6.7. Time Performance of XAI Methods" [level=3] [ref=e892]
                        - generic [ref=e893]:
                          - text: The goal of our time performance analysis in
                          - link "Section 4" [ref=e894] [cursor=pointer]:
                            - /url: "#sec4-applsci-14-04170"
                          - text: is to show which AI models are more efficient when used with black-box XAI methods for IDSs. This will depend on the user’s requirements. Our results show that some AI models will be more time-efficient when used for detecting intrusions if the IDS requires real-time inquiries from XAI methods. In particular, we found that while LIME shows consistent efficiency across most AI models, it is less effective with KNN. On the other hand, SHAP works efficiently with LGBM, RF, and DNN but faces significant performance issues with MLP, ADA, and KNN. Thus, if our framework is applied to a real-world scenario, we will recommend efficient models for each XAI method (here, SHAP and LIME). Overall, SHAP is more time-efficient for global explanations, whereas LIME is better in local explanation scenarios across all tested AI models (see
                          - link "Table 15" [ref=e895] [cursor=pointer]:
                            - /url: "#table_body_display_applsci-14-04170-t015"
                          - text: ).
                    - generic [ref=e896]:
                      - heading "7. Conclusions" [level=2] [ref=e897]
                      - generic [ref=e898]: "This paper highlights the essential need for clear explanations of AI methods in intrusion detection by introducing an XAI framework specifically designed for network intrusion detection tasks. This framework provides both global and local explanations for AI models, identifying important model-specific and intrusion-specific features across various AI models and types of network intrusions. This research involves benchmarking seven black-box AI models on three real-world network intrusion datasets: RoEduNet-SIMARGL2021, NSL-KDD, and CICIDS-2017. Initially, it assesses their performance, and then it evaluates the XAI methods, uncovering insights into the overall importance of features, their contributions to model decisions, top features for each type of intrusion, and shared features among different models. Notably, the study shows that the use of XAI methods results in negligible additional time overhead. Additionally, the paper conducts a benchmark comparison with two previous solutions for feature selection in network intrusion detection, emphasizing the advantages of the features selected by the XAI framework. It also makes the source codes available, establishing a baseline XAI framework for network intrusion detection tasks, which encourages collaboration and further exploration in this area. However, the paper acknowledges the potential for future enhancements, particularly in consolidating all models and datasets into a more user-friendly repository."
