                      - heading "1. Introduction" [level=2] [ref=e175]
                      - generic [ref=e176]:
                        - text: The primary goal of an intrusion detection system (IDS) is to identify the unauthorized use, misuse, and abuse of computer network systems by both system insiders and external penetrators [
                        - link "1" [ref=e177] [cursor=pointer]:
                          - /url: "#B1-applsci-14-04170"
                        - text: ","
                        - link "2" [ref=e178] [cursor=pointer]:
                          - /url: "#B2-applsci-14-04170"
                        - text: "]. Typically, the design of any traditional IDS is based on the belief that an intruder’s behavior will be noticeably different from that of a legitimate user and that many unauthorized actions are detectable. With the exponential growth in the number of cyber-intrusions in current networked systems and the high evolution rate of such intrusions, the need to detect such malicious activities and stop related attacks inspires new research directions for developing advanced artificial intelligence (AI) techniques for IDSs ["
                        - link "3" [ref=e179] [cursor=pointer]:
                          - /url: "#B3-applsci-14-04170"
                        - text: ","
                        - link "4" [ref=e180] [cursor=pointer]:
                          - /url: "#B4-applsci-14-04170"
                        - text: "]. Numerous research works have been developed in the literature to detect intrusions, with a focus on statistical anomalies ["
                        - link "5" [ref=e181] [cursor=pointer]:
                          - /url: "#B5-applsci-14-04170"
                        - text: ","
                        - link "6" [ref=e182] [cursor=pointer]:
                          - /url: "#B6-applsci-14-04170"
                        - text: "] and rule-based misuse models ["
                        - link "7" [ref=e183] [cursor=pointer]:
                          - /url: "#B7-applsci-14-04170"
                        - text: ","
                        - link "8" [ref=e184] [cursor=pointer]:
                          - /url: "#B8-applsci-14-04170"
                        - text: "], some of which have also been deployed on an experimental basis in real-world systems ["
                        - link "9" [ref=e185] [cursor=pointer]:
                          - /url: "#B9-applsci-14-04170"
                        - text: ","
                        - link "10" [ref=e186] [cursor=pointer]:
                          - /url: "#B10-applsci-14-04170"
                        - text: "]."
                      - generic [ref=e187]:
                        - text: However, in the era of widespread cyber connectivity among heterogeneous computer networks, intrusion detection encounters numerous contemporary challenges. Intruders now possess greater access, enabling them to execute increasingly sophisticated attacks without detection [
                        - link "11" [ref=e188] [cursor=pointer]:
                          - /url: "#B11-applsci-14-04170"
                        - text: ","
                        - link "12" [ref=e189] [cursor=pointer]:
                          - /url: "#B12-applsci-14-04170"
                        - text: "]. This scenario has prompted the exploration of AI’s potential in bolstering intrusion detection capabilities within IDSs ["
                        - link "13" [ref=e190] [cursor=pointer]:
                          - /url: "#B13-applsci-14-04170"
                        - text: ","
                        - link "14" [ref=e191] [cursor=pointer]:
                          - /url: "#B14-applsci-14-04170"
                        - text: ","
                        - link "15" [ref=e192] [cursor=pointer]:
                          - /url: "#B15-applsci-14-04170"
                        - text: "]. Various AI techniques have been employed to enhance intrusion detection, encompassing artificial neural networks ["
                        - link "16" [ref=e193] [cursor=pointer]:
                          - /url: "#B16-applsci-14-04170"
                        - text: ","
                        - link "17" [ref=e194] [cursor=pointer]:
                          - /url: "#B17-applsci-14-04170"
                        - text: "], support vector machines ["
                        - link "18" [ref=e195] [cursor=pointer]:
                          - /url: "#B18-applsci-14-04170"
                        - text: ","
                        - link "19" [ref=e196] [cursor=pointer]:
                          - /url: "#B19-applsci-14-04170"
                        - text: "], decision trees ["
                        - link "20" [ref=e197] [cursor=pointer]:
                          - /url: "#B20-applsci-14-04170"
                        - text: ","
                        - link "21" [ref=e198] [cursor=pointer]:
                          - /url: "#B21-applsci-14-04170"
                        - text: ","
                        - link "22" [ref=e199] [cursor=pointer]:
                          - /url: "#B22-applsci-14-04170"
                        - text: "], naive Bayes ["
                        - link "23" [ref=e200] [cursor=pointer]:
                          - /url: "#B23-applsci-14-04170"
                        - text: ","
                        - link "24" [ref=e201] [cursor=pointer]:
                          - /url: "#B24-applsci-14-04170"
                        - text: "], and random forest ["
                        - link "25" [ref=e202] [cursor=pointer]:
                          - /url: "#B25-applsci-14-04170"
                        - text: ","
                        - link "26" [ref=e203] [cursor=pointer]:
                          - /url: "#B26-applsci-14-04170"
                        - text: ","
                        - link "27" [ref=e204] [cursor=pointer]:
                          - /url: "#B27-applsci-14-04170"
                        - text: "]."
                      - generic [ref=e205]:
                        - text: While prior AI-based approaches for IDSs have acknowledged the influence of individual features on AI decision-making, they often overlook the intricacies of attack-specific feature relevance or the utilization of these features to enhance global and local explanations of AI methods within IDSs. In particular, earlier research has primarily concentrated on the classification accuracy of different AI algorithms, without offering insights into their underlying behavior and decision-making processes. Moreover, they have not explored the importance of attack-specific features, the integration of global and local explanations, or the examination of diverse intrusion datasets and AI model sets. These constraints highlight the urgent need to utilize the relatively new domain of explainable AI (XAI) to enhance the clarity of AI decisions in IDSs [
                        - link "28" [ref=e206] [cursor=pointer]:
                          - /url: "#B28-applsci-14-04170"
                        - text: "]. Moreover, other prior works have discussed the proliferation of network threats and cyber-attacks in recent years and emphasized the need for the development of sophisticated IDSs capable of not only detecting but also effectively mitigating such threats ["
                        - link "29" [ref=e207] [cursor=pointer]:
                          - /url: "#B29-applsci-14-04170"
                        - text: ","
                        - link "30" [ref=e208] [cursor=pointer]:
                          - /url: "#B30-applsci-14-04170"
                        - text: "]. Additionally, the integration of deep learning techniques into IDSs has shown promising results in real-time anomaly detection for IoT and SCADA infrastructures ["
                        - link "31" [ref=e209] [cursor=pointer]:
                          - /url: "#B31-applsci-14-04170"
                        - text: ","
                        - link "32" [ref=e210] [cursor=pointer]:
                          - /url: "#B32-applsci-14-04170"
                        - text: "]. This diversified foundation further supports this study’s exploration of XAI within network IDSs."
                      - generic [ref=e211]: The XAI field offers two primary advantages when applied to contemporary IDSs. Firstly, it fosters trust between the AI agent and the human security agent, which holds paramount importance in high-risk domains such as IDSs. By substantiating AI predictions with evidence, XAI establishes trust with security domain experts. Secondly, XAI enhances transparency by enabling analysts to comprehend why and how the model operates. This demystifies network intrusion detection, particularly in the context of black-box systems. However, it is important to note that the efficacy of this second benefit relies heavily on the quality of the data and their labeling. For instance, if the network intrusion data used to train the model are poorly labeled, it will inevitably impact the performance of black-box XAI methods.
                      - generic [ref=e212]:
                        - text: In this paper, we propose an end-to-end XAI framework, termed XAI-IDS, designed to enhance explainability in IDSs. The framework’s low-level structure is illustrated in
                        - link "Figure 1" [ref=e213] [cursor=pointer]:
                          - /url: "#fig_body_display_applsci-14-04170-f001"
                        - text: . By “end-to-end XAI framework”, we specifically mean that we address all stages, including loading the dataset, preprocessing the data, training black-box AI models, generating global and local XAI graphs, extracting top intrusion features based on XAI methods, and providing explanations on local and global scales using the extracted features and XAI graphs. We implemented our framework to examine three network intrusion datasets, each with distinct characteristics. The first two datasets, CICIDS-2017 [
                        - link "33" [ref=e214] [cursor=pointer]:
                          - /url: "#B33-applsci-14-04170"
                        - text: "] and NSL-KDD ["
                        - link "34" [ref=e215] [cursor=pointer]:
                          - /url: "#B34-applsci-14-04170"
                        - text: "], are widely acknowledged in the field of network intrusion detection as testbeds or controlled-environment datasets. In contrast, the RoEduNet-SIMARGL2021 dataset ["
                        - link "35" [ref=e216] [cursor=pointer]:
                          - /url: "#B35-applsci-14-04170"
                        - text: "] comprises realistic network traffic. Our framework is capable of furnishing both global and local explanations of the AI model. This entails elucidating how features in the network traffic data collectively influence the outcome and explaining the decision-making process of the AI model for specific data instances."
                      - generic [ref=e217]:
                        - generic [ref=e219] [cursor=pointer]:
                          - img "Applsci 14 04170 g001" [ref=e220]
                          - link [ref=e221]:
                            - /url: "#fig_body_display_applsci-14-04170-f001"
                        - generic [ref=e222]: Figure 1. A summary of our XAI framework designed for network intrusion detection.
                      - generic [ref=e223]:
                        - text: Furthermore, we demonstrate that our framework furnishes human-understandable explanations for the decision-making of the AI model, in stark contrast to black-box models that offer no justifications for their decisions. Additionally, we illustrate that the benefits derived from XAI explanations do not entail a significant time overhead for generating such explanations for most AI models. Finally, we conduct a benchmark comparison with two prior solutions for feature selection in network intrusion detection systems [
                        - link "35" [ref=e224] [cursor=pointer]:
                          - /url: "#B35-applsci-14-04170"
                        - text: ","
                        - link "36" [ref=e225] [cursor=pointer]:
                          - /url: "#B36-applsci-14-04170"
                        - text: "]. Our findings reveal that most AI models exhibit superior performance when utilizing the top significant features selected by XAI-IDS compared to baseline methods."
                      - generic [ref=e226]: "Summary of Contributions: Below, we detail our key contributions:"
                      - list [ref=e228]:
                        - listitem [ref=e229]:
                          - generic [ref=e230]: We present a comprehensive end-to-end framework designed to improve the explainability of AI models used in network intrusion detection tasks. This framework provides both overarching and detailed explanations for AI models dedicated to intrusion detection.
                        - listitem [ref=e231]:
                          - generic [ref=e232]: We extract important features, both model-specific and intrusion-specific, across various classes of AI models and different types of network intrusions.
                        - listitem [ref=e233]:
                          - generic [ref=e234]: We offer human-understandable explanations and justifications for the decision-making process of the AI model, aiding the security analyst.
                        - listitem [ref=e235]:
                          - generic [ref=e236]: We apply seven black-box AI models to one real-world and two emulated network intrusion datasets, presenting diverse performance metrics.
                        - listitem [ref=e237]:
                          - generic [ref=e238]:
                            - text: We provide our source codes to the community, establishing a foundational XAI framework for network intrusion detection and promoting further exploration with additional datasets and models (the URL for our source codes is
                            - link "https://github.com/ogarreche/XAI_NIDS" [ref=e239] [cursor=pointer]:
                              - /url: https://github.com/ogarreche/XAI_NIDS
                            - text: (accessed on 9 April 2024)).
                    - generic [ref=e240]:
                      - heading "2. The Problem Statement" [level=2] [ref=e241]
                      - generic [ref=e242]:
                        - text: Recall that relying on AI for network intrusion detection introduces several challenges, including the variability in performance among different AI models and the opacity of their decision-making processes. Current methods predominantly focus on optimizing accuracy without providing sufficient transparency, leaving security analysts with tools they cannot fully trust or understand [
                        - link "37" [ref=e243] [cursor=pointer]:
                          - /url: "#B37-applsci-14-04170"
                        - text: "]. To address these shortcomings, this work proposes a foundational step toward developing an XAI framework specifically designed for network intrusion detection. We aim to provide insights into IDS operations, making the decision-making processes within IDSs understandable. By introducing this framework, we propose a significant shift toward more reliable and interpretable security systems that stakeholders can robustly audit and trust. In this section, we start by outlining the problem statement to motivate the need for our framework."
                      - generic [ref=e244]:
                        - heading "2.1. Network Intrusion Types" [level=3] [ref=e245]
                        - generic [ref=e246]:
                          - text: There are several common types of network intrusions, as categorized within the MITRE ATT&CK framework [
                          - link "38" [ref=e247] [cursor=pointer]:
                            - /url: "#B38-applsci-14-04170"
                          - text: "]. In our study, we consider the following main network attacks:"
                        - generic [ref=e248]: "Normal Traffic: This pertains to normal traffic gathered from the network."
                        - generic [ref=e249]:
                          - text: "PortScan (PS)/Network Service Discovery [MITRE ATT&CK ID: T1046]: In this type of intrusion, the attacker seeks to conduct reconnaissance on the victim’s computer, often as a preliminary step to subsequent attacks. PortScan entails dispatching connection requests to multiple ports to pinpoint possible access points for intrusion ["
                          - link "39" [ref=e250] [cursor=pointer]:
                            - /url: "#B39-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e251]:
                          - text: "Denial of Service (DoS)/Network Denial of Service [MITRE ATT&CK ID: T1498]: This attack type aims to render the target network or system unavailable by inundating it with excessive traffic, causing it to become overwhelmed and inaccessible ["
                          - link "35" [ref=e252] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: ","
                          - link "36" [ref=e253] [cursor=pointer]:
                            - /url: "#B36-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e254]:
                          - text: "Brute Force [MITRE ATT&CK ID: T1110]: In this attack, the intruder attempts to gain unauthorized access to the network by systematically trying all possible passwords ["
                          - link "36" [ref=e255] [cursor=pointer]:
                            - /url: "#B36-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e256]:
                          - text: "Web Attack/Initial Access [MITRE ATT&CK ID: TA0001, T1659, T1189]: These attacks exploit vulnerabilities in web applications to gain initial access to the underlying systems ["
                          - link "40" [ref=e257] [cursor=pointer]:
                            - /url: "#B40-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e258]:
                          - text: "Infiltration/Initial Access [MITRE ATT&CK ID: TA0001]: This assault entails securing initial entry into a system or application, typically via targeted spear phishing or by exploiting vulnerabilities ["
                          - link "41" [ref=e259] [cursor=pointer]:
                            - /url: "#B41-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e260]:
                          - text: "Botnet/Compromise Infrastructure [MITRE ATT&CK ID: T1584.005, T1059, T1036, T1070]: Botnets are automated attacks that leverage hijacked devices to execute malicious activities, often orchestrated remotely by the attacker ["
                          - link "42" [ref=e261] [cursor=pointer]:
                            - /url: "#B42-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e262]:
                          - text: "Probe Attack/Network Scanning or Surveillance [MITRE ATT&CK ID: T1595]: These attacks consist of scanning a network to collect information or identify known vulnerabilities, acting as the initial phase of more extensive attacks ["
                          - link "43" [ref=e263] [cursor=pointer]:
                            - /url: "#B43-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e264]:
                          - text: "Remote-to-Local Attack (R2L) [MITRE ATT&CK ID: TA0001, T1110, T1078]: R2L attacks occur when an attacker gains unprivileged access to a machine over the network, typically without initially having an account on that machine ["
                          - link "43" [ref=e265] [cursor=pointer]:
                            - /url: "#B43-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e266]:
                          - text: "User-to-Root Attack (U2R) [MITRE ATT&CK ID: TA0004, T1078]: U2R attacks involve exploiting vulnerabilities to escalate privileges from an unprivileged user account to gain root access to the system ["
                          - link "43" [ref=e267] [cursor=pointer]:
                            - /url: "#B43-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e268]: These various types of network intrusions pose significant threats to the security of computer networks. Understanding and effectively detecting these intrusions are critical for maintaining network integrity and security. In our study, we consider these different intrusion types and aim to develop a framework that can accurately detect and provide explanations for them using black-box AI models. By tackling the lack of explainability in IDSs, our work strives to boost the overall efficacy and reliability of intrusion detection systems in practical applications.
                      - generic [ref=e269]:
                        - heading "2.2. Intrusion Detection Systems" [level=3] [ref=e270]
                        - generic [ref=e271]:
                          - text: The growing complexity of network attacks presents a serious risk to various essential infrastructures [
                          - link "44" [ref=e272] [cursor=pointer]:
                            - /url: "#B44-applsci-14-04170"
                          - text: ","
                          - link "45" [ref=e273] [cursor=pointer]:
                            - /url: "#B45-applsci-14-04170"
                          - text: "]. To counteract this, intrusion detection systems (IDSs) are implemented to protect networks from malicious actions conducted by both insiders and external attackers ["
                          - link "46" [ref=e274] [cursor=pointer]:
                            - /url: "#B46-applsci-14-04170"
                          - text: "]. Conventional IDS frameworks operate under the premise that the activities of an intruder will notably deviate from those of a legitimate user, making many unauthorized actions detectable ["
                          - link "47" [ref=e275] [cursor=pointer]:
                            - /url: "#B47-applsci-14-04170"
                          - text: "]. Recent developments in AI have paved the way for the creation of AI models that can autonomously detect network intrusions ["
                          - link "48" [ref=e276] [cursor=pointer]:
                            - /url: "#B48-applsci-14-04170"
                          - text: "]."
                      - generic [ref=e277]:
                        - heading "2.3. Shortcomings of Black-Box AI Models" [level=3] [ref=e278]
                        - generic [ref=e279]:
                          - text: Although AI models have simplified the process of intrusion detection, their opaque nature poses several challenges. The complex interactions of features within AI models obscure the understanding of how and why specific outcomes are produced. This opacity, typical in AI models such as random forest and deep neural networks, complicates the interpretation of model behavior, especially when errors occur. This issue is particularly crucial in safety-sensitive areas like network security through IDSs, underscoring the importance of elucidating the decision-making processes of AI models [
                          - link "49" [ref=e280] [cursor=pointer]:
                            - /url: "#B49-applsci-14-04170"
                          - text: "]."
                      - generic [ref=e281]:
                        - heading "2.4. Explainable AI" [level=3] [ref=e282]
                        - generic [ref=e283]:
                          - text: Explainable AI (XAI) has developed as a research area dedicated to mitigating the opaque qualities of many AI models. XAI endeavors to clarify which features influence the decision-making process of an AI model, both on a global scale over numerous data instances and locally on individual instances. XAI approaches can be model-agnostic, suitable for any AI model, or model-specific, designed for particular AI models. Techniques involve constructing surrogate models or producing lists of important features for the AI model [
                          - link "50" [ref=e284] [cursor=pointer]:
                            - /url: "#B50-applsci-14-04170"
                          - text: ","
                          - link "51" [ref=e285] [cursor=pointer]:
                            - /url: "#B51-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e286]:
                          - text: "Main Methodologies of SHAP and LIME: One widely used explainable artificial intelligence (XAI) tool is SHAP ["
                          - link "50" [ref=e287] [cursor=pointer]:
                            - /url: "#B50-applsci-14-04170"
                          - text: "], which leverages the game theory concept of Shapley values to elucidate an AI model’s decisions. SHAP computes Shapley values for each feature by evaluating the prediction using all other features except the one under scrutiny. It then quantifies the impact of each feature’s contribution by subtracting the results, thereby determining its relative importance to the prediction. This iterative process assigns a “fair” contribution to each feature using Shapley values, enabling a comprehensive analysis of feature contributions. SHAP facilitates both global and local model analyses and is generally model-agnostic, albeit with some model-specific techniques."
                        - generic [ref=e288]:
                          - text: Another prominent XAI tool is Local Interpretable Model-agnostic Explanations (LIME) [
                          - link "51" [ref=e289] [cursor=pointer]:
                            - /url: "#B51-applsci-14-04170"
                          - text: "]. LIME enhances interpretability by approximating the AI model locally with an interpretable surrogate model. It provides insights into the model’s predictions by creating surrogate models that approximate the behavior of the original model within a specified locality surrounding the analyzed sample. By discerning the features that exert the most influence on the model’s output for each prediction, LIME highlights the key contributing features, enhancing the understanding of the model’s decision-making process."
                      - generic [ref=e290]:
                        - heading "2.5. Benefits of XAI for Network IDSs" [level=3] [ref=e291]
                        - generic [ref=e292]:
                          - text: In the field of network intrusion detection, the absence of detailed explanation systems for black-box-based IDSs obstructs the interpretability of outputs from AI-based IDSs. Achieving high accuracy while elucidating AI algorithm behavior and decision-making is crucial for building trust in AI algorithms among security analysts. XAI frameworks can support analysts by offering explanations for decisions, enabling more effective investigations, and ultimately reducing time spent [
                          - link "52" [ref=e293] [cursor=pointer]:
                            - /url: "#B52-applsci-14-04170"
                          - text: "]. Our XAI framework seeks to tackle these challenges, providing deeper insights into AI model predictions and helping analysts comprehend and interpret results from intrusion detection."
                    - generic [ref=e294]:
                      - heading "3. Materials and Methods" [level=2] [ref=e295]
                      - generic [ref=e296]: The main goal of this study is to provide an explainable AI (XAI) pipeline that assists security analysts in understanding network traffic features and the decisions made by AI models for intrusion detection, ultimately helping to mitigate various types of network intrusions. To achieve this goal, we present a comprehensive end-to-end XAI framework that includes the components described in the following subsections.
                      - generic [ref=e297]:
                        - heading "3.1. An End-to-End XAI Pipeline for IDSs" [level=3] [ref=e298]
                        - generic [ref=e299]: "Monitoring and Storing Traffic: The pipeline starts with storing the network traffic by logging the accompanied activities, where such activities can represent normal traffic or a prospective attack on the network. Such logs of the different network activities are stored in a database (DB)."
                        - generic [ref=e300]: "AI Classification and XAI Techniques: The database that contains traffic logs is next used to pipeline its data to train different AI models to detect and identify different possible types of attacks. In such training, we utilize black-box AI models for the intrusion classification task. However, as mentioned earlier, these black-box models would produce results that are not well explained or understood by the security analyst. Therefore, the next essential component in our framework is the application of XAI techniques to provide a diverse set of explanations to the security analyst about different attack types, different intrusion features, and different decisions by the AI models. These explanations (by the XAI model) are then organized in dashboards and intuitive graphs and shown to the security analyst. Given such explanations, the security analyst can investigate specific traffic or make an informed decision by leveraging the XAI explanations, which ultimately enhances the time efficiency of the analyst."
                      - generic [ref=e301]:
                        - heading "3.2. Low-Level XAI Pipeline Components" [level=3] [ref=e302]
                        - generic [ref=e303]:
                          - text: We will now detail the fundamental components of our XAI pipeline, as illustrated in
                          - link "Figure 1" [ref=e304] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f001"
                          - text: and in the Algorithm 1.
                        - generic [ref=e305]:
                          - text: "Loading Intrusion Database: The first step in our pipeline is to import data from the database. We employ three extensively used network intrusion detection datasets: RoEduNet-SIMARGL2021 ["
                          - link "35" [ref=e306] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: "], CICIDS-2017 ["
                          - link "33" [ref=e307] [cursor=pointer]:
                            - /url: "#B33-applsci-14-04170"
                          - text: "], and NSL-KDD ["
                          - link "34" [ref=e308] [cursor=pointer]:
                            - /url: "#B34-applsci-14-04170"
                          - text: "]. These datasets are critical for our analyses and the training of our models."
                        - generic [ref=e309]:
                          - text: "Choosing Feature Columns: The second component in our framework is the selection of important features from the database. Such feature extraction is essential for building AI models for intrusion detection tasks. The feature extraction process usually impacts AI models. We followed prior works ["
                          - link "33" [ref=e310] [cursor=pointer]:
                            - /url: "#B33-applsci-14-04170"
                          - text: ","
                          - link "35" [ref=e311] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: "] for extracting the basic set of features for each network intrusion dataset using information gain ["
                          - link "36" [ref=e312] [cursor=pointer]:
                            - /url: "#B36-applsci-14-04170"
                          - text: "] and K-best ["
                          - link "35" [ref=e313] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: "] methods. As an important note, for RoEduNet-SIMARGL2021 and CICIDS-2017, the experiments for choosing a basic set of features using K-best and information gain were already performed in their respective works. We also performed K-best and information gain for the NSL-KDD dataset. Furthermore, in this work, we perform feature extraction using XAI methods (particularly SHAP) for all three datasets considered in our work (as explained later in this section). In particular, from the basic set of features (explained above), we extract the top intrusion features for different AI models and intrusion types. Based on this feature selection, we also select the best features among all AI models (as will be shown in our evaluation). We also emphasize that we take advantage of our XAI-based feature selection to generate a new set of features (which we use to compare our approach against baselines, as will be shown in"
                          - link "Section 4.4" [ref=e314] [cursor=pointer]:
                            - /url: "#sec4dot4-applsci-14-04170"
                          - text: ), thus creating a feedback loop in the framework to update the basic features after the whole process can be exploited in our framework when applied to real-world IDSs.
                        - generic [ref=e315]:
                          - text: "Feature Normalization: To prevent variations in scales among different traffic features, we apply a standard feature normalization step (min-max feature scaling) to all columns in our datasets (where we apply feature scaling for each column, one column at a time, to address inconsistencies across different features’ scales). This process ensures that all features are brought to a consistent numerical scale, thereby avoiding any discrepancies in magnitude across the dataset. Such a process has been applied in several related prior works ["
                          - link "10" [ref=e316] [cursor=pointer]:
                            - /url: "#B10-applsci-14-04170"
                          - text: ","
                          - link "53" [ref=e317] [cursor=pointer]:
                            - /url: "#B53-applsci-14-04170"
                          - text: ","
                          - link "54" [ref=e318] [cursor=pointer]:
                            - /url: "#B54-applsci-14-04170"
                          - text: ","
                          - link "55" [ref=e319] [cursor=pointer]:
                            - /url: "#B55-applsci-14-04170"
                          - text: "]. In terms of the nature of the datasets, all of them use tabular data. The CICIDS-2017 dataset only has features with numerical values for continuous, discrete, and categorical data. Therefore, we applied normalization to all features used. The RoEduNet-SIMARGL2021 dataset has features with numerical values for discrete and categorical data and three categorical features (i.e., PROTOCOL_MAP, IPV4_DST_ADDR, and IPV4_SRC_ADDR). However, the feature extractor module for a basic set of features (explained earlier) did not generate two of these three features, and thus, we did not use the IP addresses for any of the experiments. On the other hand, PROTOCOL_MAP has an identical counterpart feature column called PROTOCOL but with the correspondent numeric values that represent each protocol (i.e., TCP is 6, ICMP is 1, gre is 47, ipv6-ICMP is 58, skip is 57, and UDP is 17). For the NSL-KDD dataset, we work with 41 features, of which 4 are categorical. The protocol_type feature has 3 categories (i.e., Protocol_type_tcp, Protocol_type_icmp, and Protocol_type_udp). The service feature is quite diverse, with 70 categories, including service_IRC and service_aol. Flag comes with 11 categories, with examples being flag_S0 and flag_SH. Lastly, the label categorizes network behavior into 23 types, which are further classified into 5 broader categories, which are Normal, DoS, Probe, R2L, and U2R. We discuss feature normalization’s effect in"
                          - link "Section 4" [ref=e320] [cursor=pointer]:
                            - /url: "#sec4-applsci-14-04170"
                          - text: .
                        - generic [ref=e321]:
                          - text: "Black-box AI Models: After preprocessing the data, we move on to training the AI models. We divide the data into training and testing sets, with 70% used for training and 30% set aside for testing. During this phase, we utilize seven popular AI classification models: 1. RF; 2. DNN; 3. AdaBoost; 4. MLP; 5. KNN; 6. SVM; 7. LightGBM. These models were selected for their popularity and effectiveness in intrusion detection tasks. Random forests and KNN, which are frequently thought to be interpretable in machine learning, also have interpretability issues. Random forests’ ensemble nature leads to complicated decision processes that go beyond single-tree clarity ["
                          - link "56" [ref=e322] [cursor=pointer]:
                            - /url: "#B56-applsci-14-04170"
                          - text: "]. In low-dimensional spaces, KNN’s simplicity contrasts with interpretability concerns in high-dimensional spaces, where defining the “nearest” neighbor becomes unclear ["
                          - link "57" [ref=e323] [cursor=pointer]:
                            - /url: "#B57-applsci-14-04170"
                          - text: "]. These examples highlight the importance of sophisticated explainability approaches (such as the XAI methods considered in this work), even for models that are typically thought to be transparent. Moreover, simple decision trees that have a depth lower than five, for example, and contain a few leaves can be used as an explainability tool, as shown in prior works ["
                          - link "20" [ref=e324] [cursor=pointer]:
                            - /url: "#B20-applsci-14-04170"
                          - text: ","
                          - link "21" [ref=e325] [cursor=pointer]:
                            - /url: "#B21-applsci-14-04170"
                          - text: ","
                          - link "22" [ref=e326] [cursor=pointer]:
                            - /url: "#B22-applsci-14-04170"
                          - text: "]. Since each level of the tree has a clear rule for each node until it reaches a leaf, it shows the model’s exact decision process behind every decision. Such an approach is simple to follow and has improved explainability when compared to black-box AI models. However, this comes with much lower performance in terms of accuracy, recall, and precision. For training each model, we configure specific parameters to optimize performance. The detailed settings for each model are presented in"
                          - link "Section 4" [ref=e327] [cursor=pointer]:
                            - /url: "#sec4-applsci-14-04170"
                          - text: ", ensuring that the models are fine-tuned to achieve the best possible performance."
                        - generic [ref=e328]:
                          - text: "Black-box AI Evaluation: Following model training, the next phase of our framework involves evaluating the performance of each model on unseen test data. For performance analysis, we utilize the following metrics, derived from confusion matrices generated for each model: accuracy (Acc); precision (Prec); recall (Rec); F1 score (F1); Matthews correlation coefficient (Mcc) ["
                          - link "58" [ref=e329] [cursor=pointer]:
                            - /url: "#B58-applsci-14-04170"
                          - text: "]; balanced accuracy (Bacc); area under the ROC curve (AucRoc). These metrics were chosen based on their widespread usage in similar works focusing on intrusion detection systems (IDSs) ["
                          - link "34" [ref=e330] [cursor=pointer]:
                            - /url: "#B34-applsci-14-04170"
                          - text: ","
                          - link "35" [ref=e331] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: ","
                          - link "36" [ref=e332] [cursor=pointer]:
                            - /url: "#B36-applsci-14-04170"
                          - text: "]. Additionally, they allow us to examine the impact of XAI-based feature selection on model performance, enabling comparisons with prior studies on the considered datasets ["
                          - link "34" [ref=e333] [cursor=pointer]:
                            - /url: "#B34-applsci-14-04170"
                          - text: ","
                          - link "35" [ref=e334] [cursor=pointer]:
                            - /url: "#B35-applsci-14-04170"
                          - text: ","
                          - link "36" [ref=e335] [cursor=pointer]:
                            - /url: "#B36-applsci-14-04170"
                          - text: "]. Moreover, we report training and classification times for each AI model, providing insights into computational efficiency alongside performance metrics."
                        - generic [ref=e336]:
                          - text: "XAI Global Explanations: The aforementioned AI models are considered black-box AI models. Thus, it is essential to provide explanations of such models and accompanied features (traffic log parameters) and labels (attack types). Thus, the next step in our framework is the XAI step. In the first part of this step, we generate global importance values for all features, where we generate different graphs to analyze the impact of each feature on the AI model’s decision, which can help in generating expectations about the model’s behavior. We utilize different SHAP graphs for global explanations ["
                          - link "50" [ref=e337] [cursor=pointer]:
                            - /url: "#B50-applsci-14-04170"
                          - text: "], which provide the average marginal contribution of each feature value over all possible coalitions, where a coalition is defined as a combination of features that are used to estimate the Shapley value of a specific feature."
                        - generic [ref=e338]:
                          - text: "XAI Local Explanations: Our framework consists of two local XAI blocks. First, we use the recent well-known Local Interpretable Model-agnostic Explanations (LIME) ["
                          - link "51" [ref=e339] [cursor=pointer]:
                            - /url: "#B51-applsci-14-04170"
                          - text: "] to gain insight into what happens inside an AI algorithm by capturing feature interactions. We first generate a model that approximates the original model locally (LIME surrogate model) and then generate the LIME local explanations. Second, we leverage SHAP ["
                          - link "50" [ref=e340] [cursor=pointer]:
                            - /url: "#B50-applsci-14-04170"
                          - text: "] by generating SHAP local graphs (named waterfall graphs)."
                        - generic [ref=e341]: "Rationale of Choosing SHAP and LIME: We have chosen SHAP (SHapley Additive exPlanations) and LIME (Local Interpretable Model-agnostic Explanations) frameworks for our XAI pipeline. This decision is based on the shortcomings of single-feature explainability methods like partial dependence plots (PDPs), individual conditional expectation (ICE) plots, and leave-one-column-out (LOCO). These single-feature approaches struggle to account for interactions between different features, which can compromise local accuracy. In contrast, SHAP and LIME overcome these challenges by delivering comprehensive explanations that incorporate feature interactions."
                        - generic [ref=e342]:
                          - text: Moreover, SHAP utilizes game-theoretic principles to assign importance values to features based on their contribution to predictions. This method pinpoints what influences decisions, thereby enhancing the transparency of the AI’s thought process. SHAP is rooted in cooperative game theory, ensuring a consistent and equitable attribution of feature importance [
                          - link "59" [ref=e343] [cursor=pointer]:
                            - /url: "#B59-applsci-14-04170"
                          - text: "]. Conversely, LIME offers insights into individual predictions by locally simplifying the model’s decision boundary, aiding users and developers in understanding why specific decisions were made. In particular, LIME clarifies individual predictions by perturbing the input data and observing how the predictions change. It constructs a locally interpretable model near the prediction to approximate the complex model’s decision boundary, revealing how each feature influences the prediction on a local scale ["
                          - link "60" [ref=e344] [cursor=pointer]:
                            - /url: "#B60-applsci-14-04170"
                          - text: "]. Both methods play a crucial role in increasing the accountability of AI systems, showcasing their adaptability across various industries ["
                          - link "59" [ref=e345] [cursor=pointer]:
                            - /url: "#B59-applsci-14-04170"
                          - text: ","
                          - link "61" [ref=e346] [cursor=pointer]:
                            - /url: "#B61-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e347]:
                          - text: The performance of SHAP and LIME varies with the characteristics of the dataset. For example, SHAP tends to perform better with sparse data due to its inherent completeness constraint, which acts as a regularizing factor. This attribute helps stabilize the explanations that SHAP generates, leading to more consistent and reliable interpretations in such cases [
                          - link "62" [ref=e348] [cursor=pointer]:
                            - /url: "#B62-applsci-14-04170"
                          - text: "]. SHAP’s foundation in well-established game theory principles provides a robust basis for its explanations, enhancing its reliability and trustworthiness ["
                          - link "60" [ref=e349] [cursor=pointer]:
                            - /url: "#B60-applsci-14-04170"
                          - text: "]. Therefore, SHAP and LIME significantly enhance the interpretability of AI models, which is vital for building user trust and ensuring compliance with regulatory standards. This makes them well suited for our XAI pipeline, enabling accurate and interpretable explanations of model decisions at both the global and local levels."
                        - generic [ref=e350]: "Feature Explanation: The final component in our framework is the extraction of detailed metrics from the global explanations. In particular, we extract the model-specific features (i.e., top important features for each AI model) and intrusion-specific features (i.e., top features for each intrusion type) for different classes of AI models that we have and different types of network intrusions. We also provide human-understandable explanations of the decision-making of the AI model and the related top features."
