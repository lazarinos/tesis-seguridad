                        - heading "4.2. Experimental Setup" [level=3] [ref=e515]
                        - generic [ref=e516]: "Computing Resources: Our experiments utilized a high-performance computer (HPC) equipped with four NVIDIA A100 GPUs and 64 GPU-accelerated nodes (NVIDIA, Santa Clara, CA, USA), each with 256 GB of memory, alongside a 64-core AMD EPYC 7713 processor (AMD, Santa Clara, CA, USA) (2.0 GHz, 225 watts). This setup delivered a peak performance of about 7 petaFLOPs."
                        - generic [ref=e517]: "Coding Tools: For our development, we chose the Python programming language to take advantage of various open-source resources and maintain transparency in our implementation. Our toolkit included Keras and ScikitLearn for AI modeling. Additionally, we integrated XAI toolboxes, such as the following:"
                        - generic [ref=e519]:
                          - term [ref=e520]: (a)
                          - definition [ref=e521]:
                            - generic [ref=e522]:
                              - generic [ref=e523]:
                                - text: SHAP [
                                - link "50" [ref=e524] [cursor=pointer]:
                                  - /url: "#B50-applsci-14-04170"
                                - text: "]:"
                              - text: Employed for generating feature explanations, this tool was instrumental in providing both local and global insights into our AI models for intrusion detection.
                          - term [ref=e525]: (b)
                          - definition [ref=e526]:
                            - generic [ref=e527]:
                              - generic [ref=e528]:
                                - text: LIME [
                                - link "51" [ref=e529] [cursor=pointer]:
                                  - /url: "#B51-applsci-14-04170"
                                - text: "]:"
                              - text: We used LIME to develop surrogate models that approximate the decisions of our AI models on individual samples, helping in crafting detailed local explanations.
                          - term [ref=e530]: (c)
                          - definition [ref=e531]:
                            - generic [ref=e532]: "Other toolboxes: Tools like Pandas and Matplotlib were also utilized for data manipulation and visualization tasks."
                        - generic [ref=e533]: "AI Models: We assessed seven widely used AI classification models: a deep neural network (DNN), random forest (RF), AdaBoost (ADA), K-nearest neighbor (KNN), support vector machine (SVM), Multi-Layer Perceptron (MLP), and Light Gradient-Boosting Machine (LightGBM). These models were evaluated to test both the opaque nature of black-box AI and the transparency features of our XAI framework in network intrusion detection."
                        - generic [ref=e534]:
                          - text: "Hyperparameters: Specific details on the hyperparameter settings for each model are available in"
                          - link "Appendix C" [ref=e535] [cursor=pointer]:
                            - /url: "#app3-applsci-14-04170"
                          - text: .
                        - generic [ref=e536]: "Metrics for Black-box AI: We evaluated the black-box AI models using various metrics, such as accuracy (Acc), precision (Prec), recall (Rec), F1 score (F1), the Matthews correlation coefficient (Mcc), balanced accuracy (Bacc), and the area under the ROC curve (AucRoc). These metrics provide a thorough analysis of the AI models’ performance across various benchmarks."
                        - generic [ref=e537]: "Explainability Measures: Our evaluation of XAI models included several explainability measures: global summary plots (for assessing overall feature influence), global beeswarm plots (to examine the correlation between features and AI decisions), local explanations by LIME (which details the reasoning behind AI decisions for individual instances using surrogate models), local explanations by SHAP (which uses Shapley values to explain decisions for individual instances), feature importance per attack type (highlighting key features indicative of specific attack types), and overall feature rank per dataset (identifying common important features across different models). These metrics are crucial for evaluating the effectiveness of our explanations and comparing different explanation methods."
                      - generic [ref=e538]:
