                              - /url: "#B34-applsci-14-04170"
                            - text: "]:"
                          - text: An improvement on the original KDD dataset, created by the University of New Brunswick and the National Research Council of Canada, the NSL-KDD dataset features a diverse array of attack types and normal instances, organized according to a data schema that processes raw traffic. This dataset is extensively utilized for testing intrusion detection systems [
                          - link "67" [ref=e504] [cursor=pointer]:
                            - /url: "#B67-applsci-14-04170"
