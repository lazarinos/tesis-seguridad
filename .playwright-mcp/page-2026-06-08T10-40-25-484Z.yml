                      - generic [ref=e923]:
                        - heading "Appendix A. Explanations of Top Intrusion Features in XAI-IDS" [level=2] [ref=e924]
                        - generic [ref=e925]:
                          - heading "Appendix A.1. Detailed Explainability of Top Intrusion Features in RoEduNet-SIMARGL2021 Dataset" [level=3] [ref=e926]
                          - generic [ref=e927]: We can explain the sample analyzed by LIME using the top five features. We first give detailed definitions of each of these features below.
                          - generic [ref=e928]: "Explaining Top Features from a Security Point of View:"
                          - generic [ref=e930]:
                            - term [ref=e931]: (1)
                            - definition [ref=e932]:
                              - generic [ref=e933]: "TCP_WIN_SCALE_IN: This feature is relevant because certain port scanning techniques involve manipulating TCP window scaling factors to gather information about open ports or available services on a target network. A high or unusual value of TCP_WIN _SCALE_IN could indicate such activity."
                            - term [ref=e934]: (2)
                            - definition [ref=e935]:
                              - generic [ref=e936]: "TCP_FLAGS: The TCP flags can provide insights into the nature of network traffic. In the case of PortScan or Network Service Discovery, specific flag combinations (such as SYN-only packets) are commonly used to scan for open ports. The presence of specific TCP_FLAGS patterns can indicate port scanning behavior."
                            - term [ref=e937]: (3)
                            - definition [ref=e938]:
                              - generic [ref=e939]: "TCP_WIN_MIN_OUT: The minimum window size advertised by the sender (source) can provide information about the behavior of the scanning activity. Port scanners may use specific window sizes to optimize their scanning, and unusual values of TCP_WIN _MIN_OUT suggest scanning behavior."
                            - term [ref=e940]: (4)
                            - definition [ref=e941]:
                              - generic [ref=e942]: "TCP_WIN_MSS_IN: The Maximum Segment Size (MSS) used by the receiver in a TCP connection can offer insights into the scanning activity. Port scanners may manipulate the MSS value to gather information about the target network’s characteristics. Unusual or unexpected values of TCP_WIN_MSS_IN could indicate scanning behavior."
                            - term [ref=e943]: (5)
                            - definition [ref=e944]:
                              - generic [ref=e945]: "TOTAL_FLOW_EXP: This refers to the number of flows exported so far. A high number of TOTAL_FLOW_EXP can be used as an explanation feature to indicate DoS attacks in which the attacker floods the network with many packets. It can also be used as an error troubleshooting tool to catch wrong biases in the AI model."
                        - generic [ref=e946]:
                          - heading "Appendix A.2. Detailed Explainability of Top Intrusion Features in NSL-KDD" [level=3] [ref=e947]
                          - generic [ref=e948]: "Explaining Top Features from a Security Point of View:"
                          - generic [ref=e950]:
                            - term [ref=e951]: (1)
                            - definition [ref=e952]:
                              - generic [ref=e953]: "DST_HOST_SAME_SRV_RATE: This feature is relevant because, during a network attack such as a DoS attack or port scanning, the attacker might repeatedly connect to the same service on a particular host. A high DST_HOST_SAME_SRV_RATE value may indicate such repetitive access to the same service, which could be a sign of suspicious activity."
                            - term [ref=e954]: (2)
                            - definition [ref=e955]:
                              - generic [ref=e956]: "DST_HOST_SRV_COUNT: This feature is important because it can highlight unusually high numbers of connections to a particular service, which could be indicative of a Brute-Force attack or a DoS attack. A high DST_HOST_SRV_COUNT may suggest that an attacker is repeatedly connecting to a service, attempting to gain unauthorized access or overload the service."
                            - term [ref=e957]: (3)
                            - definition [ref=e958]:
                              - generic [ref=e959]: "DST_HOST_SAME_SRC_PORT _RATE: This feature is relevant because, during certain network attacks, such as port scanning or DoS attacks, an attacker might make multiple connections from the same source port. A high DST_HOST_SAME_SRC_PORT _RATE could indicate such behavior, suggesting potential malicious activity."
                            - term [ref=e960]: (4)
                            - definition [ref=e961]:
                              - generic [ref=e962]: "LOGGED_IN: This feature is important because if an unexpected or unauthorized host is logged into a system, it can be an indication of a security breach. The feature could capture scenarios where an attacker has successfully gained unauthorized access to a system."
                            - term [ref=e963]: (5)
                            - definition [ref=e964]:
                              - generic [ref=e965]: "DST_HOST_SERROR_RATE: This feature is significant, as it could indicate the presence of a network attack. SYN errors may occur when there is an attempted connection to a closed port, which could be indicative of port scanning or a failed unauthorized access attempt. A high DST_HOST_SERROR_RATE may thus indicate malicious network behavior."
