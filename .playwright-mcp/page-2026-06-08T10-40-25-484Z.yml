                        - generic [ref=e1009]:
                          - text: "Local XAI Explanations on NSL-KDD Dataset:"
                          - link "Figure A5" [ref=e1010] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f0A5"
                          - text: represents a local explanation for LIME for a specific RF prediction from the NSL-KDD dataset. This figure shows a clear local explanation for a misclassified instance. The local explanation for LIME provides a confidence score that shows the model’s belief in the correctness of a class, adding further detail to our understanding of the model’s decision-making process. In the particular case of the misclassification shown here, the model incorrectly classified a Probe attack as Normal due to the influence of several intrusion features.
                        - generic [ref=e1011]: For instance, the negative impact of “service_ntp_u” and “num_root” suggested normal behavior, which can be attributed to fewer operations as root and less usage of NTP service. Conversely, the presence of “service_IRC” indicated suspicious activity, hinting at a Probe attack. Features like the low values of “service_domain” and “service_tftp_u” further contributed to the Normal classification, associating these services with regular network activities. Simultaneously, the model picked up on suspicious behavior from features such as the high number of “su_root” commands attempted (“su_attempted”) and the presence of “service_pm_dump”. These could be indicative of potential exfiltration attempts, characteristic of a Probe attack. However, the combined impact of these features was insufficient to correct the classification. This analysis underscores the need for the model to be retrained to weigh these features correctly. We believe that this detailed examination of the model’s local decision-making process, provided by our XAI framework, can significantly enhance our understanding and ability to improve black-box AI models.
