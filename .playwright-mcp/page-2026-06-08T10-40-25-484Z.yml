                      - heading "4. Results" [level=2] [ref=e488]
                      - generic [ref=e489]: "We proceed to present our detailed evaluation results, aiming to address several key questions: (1) What is the performance of black-box AI models on the three considered network intrusion datasets? (2) How does XAI help in understanding and explaining the performance of different AI models for intrusion detection? (3) What are the main features for each AI model? (4) What are the main features for each intrusion type? (5) What are the common influential intrusion features among different types of AI models? (6) What is the time overhead of generating XAI explanations? and (7) How does XAI-based feature selection compare to that in baseline methods?"
                      - generic [ref=e490]:
                        - heading "4.1. Dataset Description" [level=3] [ref=e491]
                        - generic [ref=e492]:
                          - generic [ref=e493]:
                            - text: RoEduNet-SIMARGL2021 Dataset [
                            - link "35" [ref=e494] [cursor=pointer]:
                              - /url: "#B35-applsci-14-04170"
                            - text: "]:"
                          - text: Sourced from the SIMARGL project funded by the European Union, this dataset comprises realistic network traffic and features derived from actual traffic flows. It adheres to the Netflow protocol for organization.
                        - generic [ref=e495]:
                          - text: The dataset follows a structured data schema based on Netflow [
                          - link "65" [ref=e496] [cursor=pointer]:
                            - /url: "#B65-applsci-14-04170"
                          - text: "], a network protocol devised by CISCO for the collection and analysis of network flows."
