                          - text: showcase the local explanations for the same methods applied to a sample from the NSL-KDD dataset. Such figures show different local explanations for the same instance. We see that most of the main (top) features remain the same for both explanations. However, LIME offers more details for a single instance than SHAP. First, there is a confidence score in LIME that shows how much the model believes that a class is correct, whereas in SHAP, we do not see that. Moreover, SHAP does not show the confidence score for other classes either (seen in LIME). On the other hand, the SHAP’s explanation (waterfall plot) is easier to read and interpret from a visualization point of view, where it clearly shows the contribution of each feature to the AI model. We believe that, although both methods are different, the combination of the two can serve as a cross-validation for the local explanation of the AI model’s prediction.
