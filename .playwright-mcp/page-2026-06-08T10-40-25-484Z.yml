                              - /url: "#B33-applsci-14-04170"
                            - text: "]:"
                          - text: "Developed by the Canadian Institute for Cybersecurity, this benchmark dataset for intrusion detection includes six distinct attack scenarios: Brute Force, heartbleed, botnet, DoS, PortScan, Web attack, and Infiltration. It simulates realistic background traffic using the B-Profile system ["
                          - link "66" [ref=e500] [cursor=pointer]:
                            - /url: "#B66-applsci-14-04170"
                          - text: "]."
                        - generic [ref=e501]:
                          - generic [ref=e502]:
                            - text: NSL-KDD Dataset [
