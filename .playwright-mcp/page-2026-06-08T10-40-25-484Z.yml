                              - text: reveals that KNN consistently has the fastest training times regardless of feature selection. In contrast, SVM has the most extended training duration, particularly for 15 features, which takes 6.48 min. On the other hand, LightGBM’s training is relatively efficient, taking around 0.72 min for 15 features.
