                      - generic [ref=e422]:
                        - heading "3.3. Feature Importance for Different Attacks" [level=3] [ref=e423]
                        - generic [ref=e424]: One of the important outcomes of our framework is a list of the top features for each attack type. This can help the security analyst look for specific features within the log when investigating suspicious traffic. In our current work, we analyze ten possible classes, which are normal traffic along with nine types of attacks (DoS, PortScan, Brute Force, Infiltration, Web attack, Bot, Probe, U2R, and R2L). We focus on gaining a more in-depth understanding of the feature importance for each attack for the three considered datasets (CICIDS-2017, RoEduNet-SIMARGL2021, and NSL-KDD). Note that the RoEduNet-SIMARGL2021 dataset contains only data for DoS and Port Scan attacks (along with normal traffic), CICIDS-2017 has data for Brute Force, Infiltration, Web attack, and Bot attack classes, and NSL-KDD has only DoS, Probe, U2R, and R2L attack classes.
                      - generic [ref=e425]:
                        - heading "3.4. Illustrations of Local Explanations by XAI" [level=3] [ref=e426]
                        - generic [ref=e427]: We now provide two illustrative examples of XAI local explanations.
                        - generic [ref=e428]:
                          - text: "Local Explanation Using LIME:"
                          - link "Figure 2" [ref=e429] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f002"
                          - text: shows an example of a local explanation of a Port Scan attack sample using LIME for random forest applied to the RoEduNet-SIMARGL2021 database. There are three vertical bars, one for each possible class. These bars contain the top five features with the greatest contributions to this outcome, where the contributions can be seen as five horizontal bars that go toward one classification or another. Here, intrusion features that push the prediction probability toward a specific class (for example, toward Port Scanning) are deemed to contribute positively (i.e., these features are assigned positive contribution values, represented by the bars that are positioned on the right-hand side). On the other hand, those that push the explanation away from the class are considered to contribute negatively (i.e., features that are assigned negative contribution values, represented by the bars that are positioned on the left-hand side) to the Port Scanning classification. The contribution of each feature is shown in
                          - link "Figure 2" [ref=e430] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f002"
                          - text: by the horizontal bar positioned below each possible label. Moreover, the prediction probabilities field (top left) shows how much confidence LIME has in its classification, ranging from zero to one. Lastly, the green box shows the actual value for each feature in this particular instance. Based on the observations provided by LIME, an analyst could see which features contributed the most to a certain prediction and also check the confidence score. For example, it could be the case that LIME has prediction scores of 50% for port scanning, 40% for DoS, and 10% for normal traffic. In this case, the security analyst can check for port scanning and DoS since they have close scores.
                        - generic [ref=e431]:
                          - generic [ref=e433] [cursor=pointer]:
                            - img "Applsci 14 04170 g002" [ref=e434]
                            - link [ref=e435]:
                              - /url: "#fig_body_display_applsci-14-04170-f002"
                          - generic [ref=e436]: Figure 2. An example of a local explanation of an RF model using LIME on a port scanning attack on the RoEduNet-SIMARGL2021 dataset.
                        - generic [ref=e437]:
                          - text: "Local Explanations using SHAP:"
                          - link "Figure 3" [ref=e438] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f003"
                          - text: provides an insightful local explanation for a DoS (Denial of Service) instance using SHAP applied to a random forest model. This illustration, structured as a waterfall graph, effectively ranks the most crucial features influencing the model’s decision for a specific data sample. The features are listed in descending order of impact, offering a detailed view of their contributions. One important key to this explanation is the concept of a “base value”, which, in this context, stands at 0.334. From this baseline, the graph showcases how each feature’s value (depicted in gray) either steers the model’s decision toward classifying the instance as a DoS attack or away from this classification. The arrows stem from this base value and are pivotal in understanding SHAP’s output. They quantitatively indicate the extent to which each feature influences the model’s verdict. Features that nudge the prediction toward identifying the instance as DoS are illustrated with arrows extending left from the base value. These are shown in pink and are interpreted as having a positive contribution. Conversely, features that push the decision away from a DoS classification and, thus, potentially toward a non-DoS category extend right from the base value, depicted in blue, indicating a negative contribution. To summarize, each feature’s contribution is quantified using SHAP in such a way that the evaluation can determine its contribution to deciding in favor of or against the classification of DoS. Specifically, as shown in
                          - link "Figure 3" [ref=e439] [cursor=pointer]:
                            - /url: "#fig_body_display_applsci-14-04170-f003"
                          - text: ", features that push the forecast toward DoS (i.e., the right-hand side of the base value with the color magenta) have a positive effect, while those that push the prediction away (i.e., the left-hand side of the base value with the color blue) have a negative effect."
                        - generic [ref=e440]:
                          - generic [ref=e442] [cursor=pointer]:
                            - img "Applsci 14 04170 g003" [ref=e443]
                            - link [ref=e444]:
                              - /url: "#fig_body_display_applsci-14-04170-f003"
                          - generic [ref=e445]: Figure 3. An example of a local explanation for correctly predicting a DoS sample from the RoEduNet-SIMARGL2021 dataset for the RF model using SHAP.
                        - generic [ref=e446]: This derives explanations for why this sample was classified as a DoS attack.
                        - generic [ref=e447]:
                          - text: "Comparing LIME and SHAP for Local Explanations: The LIME local explanation provides more details about the features that affected the decision for each intrusion class, along with the overall prediction probabilities for each class. On the other hand, SHAP’s local feature visualization shows the contribution of each top feature to the AI model’s decision. From our experiments, we recommend combining complementary local explanations from LIME and SHAP to provide more confident local explanations for an IDS. We also provide examples of local explanations for samples from the CICIDS-2017 and NSL-KDD datasets in"
                          - link "Appendix B" [ref=e448] [cursor=pointer]:
