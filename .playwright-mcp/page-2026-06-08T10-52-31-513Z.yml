                  - heading "Resumen" [level=2] [ref=e142]
                  - generic [ref=e143]: Hoy en día, uno de los principales problemas que encontramos en las redes internas LAN es la débil configuración y medidas de seguridad. Esto se convierte en un problema ya que se expone la integridad, disponibilidad y confidencialidad de la información valiosa para la institución. Está claro que ahora ya no podemos hablar de un perímetro de red, ya que los usuarios finales se pueden conectar a través de diferentes dispositivos hacia los recursos de una organización. Esto hace que la arquitectura cambie hacia un enfoque de redes sin fronteras, y el Ministerio Publico sede Puno no será ajeno a este cambio. En la actualidad el Ministerio Publico carece de un sistema de monitorización y control de eventos de Red, un sistema de detección de intrusos y equipos que están propensos a ser blancos de ataques informáticos. En el presente trabajo se muestra una propuesta a cerca de la implementación de un sistema de seguridad que nos permita reforzar y alertar ante posibles intrusiones no deseadas de nuestra red a través de un dispositivo de bajo costo como es la Raspberry.
