            - cell "Resumen :" [ref=e79]
            - cell [ref=e80]:
              - text: La presente investigación se resume en un modelo de gestión para mejorar la productividad en obras de pavimentación ejecutadas por entidades públicas en la región del Cusco, que abarca el control de productividad durante el ciclo de vida del proyecto, planificación, ejecución y control por el equipo de la residencia e implementar capacitación y motivación dirigida hacia todo el personal involucrado en la cadena de producción de toda la cartera de proyectos. Para determinar los distintos campos que abarca el modelo de gestión propuesto, se ha realizado encuestas a todos los involucrados en la cadena de producción de las obras en estudio y análisis; las encuestas han sido diseñadas y dirigidas con el objeto de determinar un diagnóstico de las variables de productividad, la organización del equipo de dirección de obras y el tipo de capacitación y motivación que se realiza en la entidad ejecutora. Así mismo se han realizado mediciones de productividad diarias de las partidas más incidentes de los tres proyectos de pavimentación en estudio, las observaciones se realizaron a las cuadrillas de mano de obra y maquinaria; posteriormente se realizó la compilación y tratamiento de información con métodos estadísticos probabilísticos para determinar las distribuciones normales de cada actividad y compararlas entre las obras estudiadas. A partir de los resultados de la productividad, diagnóstico de la situación actual de la organización, capacitación y motivación de las obras estudiadas, se plantea el modelo de gestión propuesto, con el objetivo de mejorar la productividad de las obras de pavimentación ejecutadas por entidades públicas; finalmente el modelo propuesto es validado por especialistas o expertos en la gestión y administración pública y privada, mediante un cuestionario en la que se plantean seis criterios de evaluación para que el modelo de gestión propuesto pueda ser implementado en cualquier entidad pública de la región Cusco.
              - text: This research is summarized in a management model to improve the productivity of paving works executed by public entities in the Cusco region, which includes the control of productivity during the life cycle of the project, planning, execution and control by the team of the residence and implement training and motivation directed towards all the personnel involved in the production chain of the entire portfolio of projects. To determine the different fields covered by the proposed management model, surveys have been carried out to all those involved in the production chain of the works under study and analysis; the surveys have been designed and directed in order to determine a diagnosis of the productivity variables, the organization of the works management team and the type of training and motivation that takes place in the executing agency. Likewise, daily productivity measurements of the most incidents of the three paving projects under study have been made, the observations were made to the labor and machinery crews; Subsequently, the compilation and processing of information was carried out with statistical probabilistic methods to determine the normal distributions of each activity and compare them among the works studied. Based on the results of productivity, diagnosis of the current situation of the organization, training and motivation of the works studied, the proposed management model is proposed, with the aim of improving the productivity of paving works executed by public entities ; finally, the proposed model is validated by specialists or experts in public and private management and administration, through a questionnaire in which six evaluation criteria are proposed so that the proposed management model can be implemented in any public entity in the Cusco region.
